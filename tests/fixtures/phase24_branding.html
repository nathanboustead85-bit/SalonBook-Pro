<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Boustio — Premium branding demo</title><style>:root{font:16px system-ui;color:#183d3a;background:#f2f9f7}*{box-sizing:border-box}body{margin:0}header{padding:20px;background:white;color:#087d7b;font-weight:800;font-size:27px}main{max-width:1100px;margin:auto;padding:20px}.notice{background:#fff0d5;padding:14px;border-radius:12px}.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:18px}.panel{min-width:0;background:white;border:1px solid #d3e7e2;border-radius:18px;padding:20px}label{display:block;margin:12px 0}input,select{font:inherit;max-width:100%;width:100%;padding:12px;border:1px solid #81aaa3;border-radius:9px}button{font:inherit;padding:12px;border:0;border-radius:9px;background:#087d7b;color:white;margin:4px;cursor:pointer}button:disabled{background:#a5b5b0}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #e5aa33}.hero{background:#e6f3f0;border-radius:16px;overflow:hidden}.cover{height:160px;background:linear-gradient(120deg,#c7e7e0,#eff7f4);display:flex;align-items:center;justify-content:center}.cover img{width:100%;height:100%;object-fit:cover}.identity{padding:20px}.logo{width:74px;height:74px;border-radius:18px;object-fit:cover;background:white;border:2px solid white}.primary{background:var(--brand);color:white;padding:12px 18px;border-radius:10px;display:inline-block}.panel p{overflow-wrap:anywhere}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style><header>Boustio ☁</header><main><h1>Business branding</h1><p class="notice">Demonstration only. Images stay in this browser session; registration, bookings, payments and publishing are disabled.</p><div class="grid"><section class="panel"><h2>Personalise your page</h2><label>Business name<input data-name value="Kody Blends"></label><label>Tagline<input data-tagline value="Your next great look starts here"></label><label>Brand colour<select data-colour><option value="#087d7b">Premium teal</option><option value="#125c53">Deep green</option><option value="#1e6091">Ocean blue</option><option value="#6d4c91">Violet</option><option value="#bd5d38">Terracotta</option></select></label><label>Business logo (PNG, JPEG or WebP, under 350 KB)<input data-logo type="file" accept="image/png,image/jpeg,image/webp"></label><label>Cover photo (PNG, JPEG or WebP, under 350 KB)<input data-cover type="file" accept="image/png,image/jpeg,image/webp"></label><button data-apply>Update preview</button><p><button data-save>Save demo</button><button data-recover>Recover demo</button><button data-clear>Clear demo</button></p></section><section class="panel"><h2>Customer booking-page preview</h2><div class="hero" data-preview><div class="cover" data-cover-box><span data-cover-placeholder>Cover photo preview</span><img data-cover-image hidden alt="Business cover photo preview"></div><div class="identity"><img class="logo" data-logo-image hidden alt="Business logo preview"><h2 data-preview-name></h2><p data-preview-tagline></p><span class="primary">Choose a service — preview only</span></div></div><p data-message role="alert"></p><button disabled>Register — disabled</button><button disabled>Enable bookings — disabled</button><button disabled>Payments — disabled</button><button disabled>Publish — disabled</button></section></div></main><script src="/bundle.js"></script></html>
