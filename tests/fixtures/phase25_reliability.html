<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Boustio synthetic reliability</title><style>:root{font:16px system-ui;background:#f2faf7;color:#153c35}*{box-sizing:border-box}body{margin:0}header{padding:20px;background:white;color:#087d7b;font-weight:800;font-size:28px}main{max-width:940px;margin:auto;padding:20px}.notice{padding:16px;background:#fff0d5;border-radius:12px}.panel{padding:20px;background:white;border:1px solid #d4e9e1;border-radius:16px;margin:16px 0}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}label{display:grid;gap:6px}select,input,button{font:inherit;padding:12px;max-width:100%;border-radius:9px;border:1px solid #a7c8c0}button{background:#087d7b;color:white;cursor:pointer}button:disabled{background:#aebdb8}.slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.slot{background:#e4f6f0;border-radius:9px;padding:12px}@media(max-width:650px){.grid,.slots{grid-template-columns:1fr}}</style><header>Boustio ☁</header><main><h1>Availability reliability preview</h1><p class="notice">Fictional data and illustrative times only. No real bookings, registration, payments or publishing.</p><section class="panel"><div class="grid"><label>Service<select data-service></select></label><label>Professional<select data-staff></select></label><label>Date<input data-date type="date" value="2026-11-20"></label></div><p><button data-check>Check illustrative availability</button></p><p role="status" data-message></p></section><section class="panel"><h2>Illustrative times</h2><div data-slots class="slots"></div></section><section class="panel"><button disabled>Confirm booking</button> <button disabled>Pay</button> <button disabled>Register</button> <button disabled>Publish</button></section></main><script src="/bundle.js"></script></html>
