<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Boustio — Booking policies demo</title><style>:root{font:16px system-ui;color:#193c39;background:#f2f9f7}*{box-sizing:border-box}body{margin:0}header{background:white;padding:20px;color:#087d7b;font-size:27px;font-weight:800}main{max-width:1100px;margin:auto;padding:18px}.notice{background:#fff0d5;padding:14px;border-radius:12px}.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}.panel{min-width:0;background:white;padding:20px;border:1px solid #d4e7e2;border-radius:18px}label{display:block;margin:12px 0}select,textarea{display:block;width:100%;max-width:100%;font:inherit;padding:10px;border:1px solid #8baea6;border-radius:9px}textarea{min-height:100px}input[type=checkbox]{width:20px;height:20px;vertical-align:middle}button{font:inherit;background:#087d7b;color:white;border:0;border-radius:9px;padding:12px;margin:4px;cursor:pointer}button:disabled{background:#a9b9b5}button:focus-visible,select:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid #dfad3b}.preview{border-left:5px solid #087d7b;background:#f3faf8;padding:14px;border-radius:9px;overflow-wrap:anywhere}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style><header>Boustio ☁</header><main><h1>Booking policies & preferences</h1><p class="notice">Synthetic demonstration only. No live bookings, registration, payments or publishing.</p><div class="grid"><section class="panel"><h2>Business settings</h2><label>Cancellation notice (hours)<select data-cancellationHours></select></label><label>Minimum booking notice (hours)<select data-minimumNoticeHours></select></label><label>Booking window (days ahead)<select data-maximumAdvanceDays></select></label><label>Buffer before appointment (minutes)<select data-bufferBeforeMinutes></select></label><label>Buffer after appointment (minutes)<select data-bufferAfterMinutes></select></label><label><input type="checkbox" data-allowCustomerNotes> Allow customer notes</label><label><input type="checkbox" data-allowStaffChoice> Allow staff choice</label><label><input type="checkbox" data-requirePhone> Require customer phone number</label><label>Customer-facing policy text<textarea data-policyText maxlength="500"></textarea></label><button data-apply>Update preview</button><button data-save>Save demo</button><button data-recover>Recover demo</button><button data-clear>Clear demo</button></section><section class="panel"><h2>Customer booking-page preview</h2><div class="preview" data-preview><h3>Before you book</h3><p data-preview-cancellation></p><p data-preview-notice></p><p data-preview-advance></p><p data-preview-buffer></p><p data-preview-text></p><p data-preview-options></p></div><p data-message role="status"></p><button disabled>Register — disabled</button><button disabled>Book appointment — disabled</button><button disabled>Payments — disabled</button><button disabled>Publish — disabled</button></section></div></main><script src="/bundle.js"></script></html>
