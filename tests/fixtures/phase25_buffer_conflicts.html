<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Boustio — Buffered conflict preview</title><style>:root{font:16px system-ui;color:#153e37;background:#f3faf8}*{box-sizing:border-box}body{margin:0}header{background:white;color:#087d7b;padding:20px;font-size:28px;font-weight:800}main{max-width:960px;margin:auto;padding:20px}.notice{background:#fff1d9;padding:16px;border-radius:12px}.panel{background:white;border:1px solid #d5e9e2;border-radius:16px;padding:20px;margin:16px 0}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}label{display:grid;gap:6px}select,input,button{font:inherit;padding:12px;max-width:100%;border:1px solid #a7c8c0;border-radius:9px}button{background:#087d7b;color:white;cursor:pointer}button:disabled{background:#aebdb8}.slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.slot{padding:12px;border-radius:9px;background:#e4f6f0}@media(max-width:650px){.grid,.slots{grid-template-columns:1fr}}</style><header>Boustio ☁</header><main><h1>Advanced appointment conflict preview</h1><p class="notice">Synthetic appointments and illustrative times only. Preparation and cleanup buffers are applied conservatively. No real bookings, registration, payments or publishing.</p><section class="panel"><div class="grid"><label>Service<select data-service></select></label><label>Professional<select data-staff></select></label><label>Date<input type="date" data-date value="2026-11-20"></label></div><p data-buffer></p><button data-check>Check illustrative times</button><p data-message role="status"></p></section><section class="panel"><h2>Illustrative free times</h2><div class="slots" data-slots></div></section><section class="panel"><button disabled>Confirm booking</button> <button disabled>Pay</button> <button disabled>Register</button> <button disabled>Publish</button></section></main><script src="/bundle.js"></script></html>
