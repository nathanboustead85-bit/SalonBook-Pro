<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Boustio — Business profile preview</title><style>:root{font:16px system-ui;color:#173d3a;background:#f4faf9}*{box-sizing:border-box}body{margin:0}header{background:#fff;padding:20px;color:#087d7b;font-size:26px;font-weight:800}main{max-width:1000px;margin:auto;padding:20px}h1{font-size:clamp(28px,5vw,42px)}.notice{background:#fff1d5;border-radius:12px;padding:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.panel{background:white;border:1px solid #d2e7e3;border-radius:18px;padding:20px;min-width:0}label{display:block;margin:12px 0}input,select{font:inherit;width:100%;max-width:100%;padding:12px;border:1px solid #7ea9a1;border-radius:9px}button{font:inherit;border:0;background:#087d7b;color:white;padding:12px;border-radius:9px;margin:4px;cursor:pointer}button:disabled{background:#a6b5b2}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #e5ad35}p{overflow-wrap:anywhere}@media(max-width:680px){.grid{grid-template-columns:1fr}}</style><header>Boustio ☁</header><main><h1>Premium business profile</h1><p class="notice" role="status">Demonstration only. Saved in this browser session. Registration, bookings, publishing and payments remain disabled.</p><div class="grid"><section class="panel"><h2>Business information</h2><label>Name<input data-name value="Kody Blends"></label><label>Category<select data-category><option>Barber</option><option>Hair salon</option><option>Nails</option><option>Beauty</option></select></label><label>Email<input data-email type="email" value="hello@example.invalid"></label><label>Phone<input data-phone value="07000 000000"></label><label>Street address<input data-address value="12 Example Street"></label><label>Town<input data-town value="Torquay"></label><label>Postcode<input data-postcode value="TQ1 1AA"></label><label>Website (optional)<input data-website value="https://example.invalid"></label><button data-update>Update demonstration profile</button><h2>Opening hours</h2><label>Day<select data-day><option>Monday</option><option>Tuesday</option><option>Wednesday</option><option>Thursday</option><option>Friday</option><option>Saturday</option><option>Sunday</option></select></label><label>Opens<input data-open type="time" value="09:00"></label><label>Closes<input data-close type="time" value="17:00"></label><label>Closed <input data-closed type="checkbox"></label><button data-hours>Update example hours</button><p><button data-save>Save demo</button><button data-recover>Recover demo</button><button data-clear>Clear demo</button></p></section><section class="panel"><h2>Profile completeness</h2><p data-completeness aria-live="polite"></p><p data-summary></p><h3>Opening hours preview</h3><ul data-hours-summary></ul><p data-message role="alert"></p><button disabled>Register — disabled</button><button disabled>Publish — disabled</button><button disabled>Bookings — disabled</button><button disabled>Payments — disabled</button></section></div></main><script src="/bundle.js"></script></html>
