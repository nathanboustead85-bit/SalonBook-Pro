<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Boustio — Customer booking journey demonstration</title><style>:root{font:16px system-ui;color:#17433c;background:#f2faf8}*{box-sizing:border-box}body{margin:0}header{background:white;color:#087d7b;padding:22px;font-size:28px;font-weight:800}main{max-width:920px;margin:auto;padding:20px}.notice{background:#fff0d5;padding:16px;border-radius:12px}.panel{background:white;padding:20px;border-radius:16px;border:1px solid #d4e9e2;margin:16px 0}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.grid>*{min-width:0}label{display:grid;gap:6px}select,input,button{font:inherit;padding:12px;border-radius:9px;border:1px solid #a5c9c0;max-width:100%}button{background:#087d7b;color:white;cursor:pointer}button:disabled{background:#aebbb7}.slots{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.slots>*{min-width:0}.slot{background:#e3f5ef;color:#17433c}.summary{background:#e9f7f2;padding:16px;border-radius:12px}@media(max-width:650px){.grid,.slots{grid-template-columns:repeat(2,minmax(0,1fr))}.grid label:last-child{grid-column:1/-1}}@media(max-width:360px){.grid,.slots{grid-template-columns:minmax(0,1fr)}.grid label:last-child{grid-column:auto}}</style><header>Boustio ☁</header><main><h1>Choose your appointment</h1><p class="notice">Demonstration only — no appointment will be booked. Registration, payments and publishing are disabled.</p><section class="panel"><div class="grid"><label>Service<select data-service></select></label><label>Professional<select data-staff></select></label><label>Date<input data-date type="date" value="2026-11-20"></label></div><p><button data-find>Show illustrative times</button></p><p data-message role="status"></p><div data-slots class="slots"></div></section><section class="panel"><h2>Booking summary</h2><div data-summary class="summary">Choose an illustrative time to see your demonstration summary.</div><p><button data-clear>Clear selection</button></p></section><section class="panel"><button disabled>Confirm booking</button> <button disabled>Pay</button> <button disabled>Register</button> <button disabled>Publish</button></section></main><script src="/bundle.js"></script></html>
