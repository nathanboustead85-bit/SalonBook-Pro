<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Boustio — Staff and schedules demo</title><style>:root{font:16px system-ui;background:#f3faf9;color:#173e3b}*{box-sizing:border-box}body{margin:0}header{padding:20px;background:white;color:#087d7b;font-size:26px;font-weight:800}main{max-width:1000px;margin:auto;padding:20px}.notice{background:#fff0d5;padding:14px;border-radius:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.panel{min-width:0;background:white;padding:20px;border-radius:18px;border:1px solid #d0e7e2}label{display:block;margin:12px 0}input,select{font:inherit;width:100%;max-width:100%;padding:12px;border:1px solid #80a9a2;border-radius:9px}button{font:inherit;padding:12px;background:#087d7b;color:white;border:0;border-radius:9px;margin:4px;cursor:pointer}button:disabled{background:#a2b4b0}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #e9ae35}p,li{overflow-wrap:anywhere}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style><header>Boustio ☁</header><main><h1>Team & working schedules</h1><p class="notice">Synthetic demonstration only. Real registration, bookings, payments and publishing are disabled.</p><div class="grid"><section class="panel"><h2>Professional profile</h2><label>Name<input data-name value="Kody"></label><label>Role<input data-role value="Barber"></label><button data-add-staff>Add demo professional</button><h2>Service assignment</h2><label>Service<input data-service value="Classic haircut"></label><button data-add-service>Add demo service</button><label>Professional<select data-staff-select></select></label><label>Service<select data-service-select></select></label><button data-assign>Assign service</button><h2>Working hours</h2><label>Day<select data-day><option>Monday</option><option>Tuesday</option><option>Wednesday</option><option>Thursday</option><option>Friday</option><option>Saturday</option><option>Sunday</option></select></label><label>Start<input data-start type="time" value="09:00"></label><label>Finish<input data-end type="time" value="17:00"></label><label>Day off <input data-off type="checkbox"></label><button data-hours>Set day</button><h2>Breaks</h2><label>Break starts<input data-break-start type="time" value="12:00"></label><label>Break ends<input data-break-end type="time" value="12:30"></label><button data-break>Add break</button><p><button data-save>Save demo</button><button data-recover>Recover demo</button><button data-clear>Clear demo</button></p></section><section class="panel"><h2>Schedule preview</h2><div data-preview aria-live="polite"></div><p data-message role="alert"></p><button disabled>Register — disabled</button><button disabled>Publish — disabled</button><button disabled>Bookings — disabled</button><button disabled>Payments — disabled</button></section></div></main><script src="/bundle.js"></script></html>
