<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Boustio — Illustrative availability</title><style>:root{font:16px system-ui;color:#143c36;background:#f3faf8}*{box-sizing:border-box}body{margin:0}header{background:white;color:#087d7b;padding:20px;font-size:28px;font-weight:800}main{max-width:950px;margin:auto;padding:20px}.notice{background:#fff0d4;border-radius:12px;padding:16px}.panel{background:white;border:1px solid #d5e9e2;border-radius:16px;padding:20px;margin-top:16px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}label{display:grid;gap:6px}select,input,button{font:inherit;padding:12px;max-width:100%;border:1px solid #aacac1;border-radius:9px}button{background:#087d7b;color:white;cursor:pointer}button:disabled{background:#aabbb6;cursor:not-allowed}.slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.slot{background:#e7f6f2;padding:12px;border-radius:9px;overflow-wrap:anywhere}@media(max-width:650px){.grid,.slots{grid-template-columns:1fr}}</style><header>Boustio ☁</header><main><h1>Customer booking preview</h1><p class="notice">Illustrative availability only. No actual availability, appointment holds or bookings. Real registration, bookings, payments and publishing are disabled.</p><section class="panel"><div class="grid"><label>Service<select data-service></select></label><label>Professional<select data-staff></select></label><label>Date<input data-date type="date" value="2026-11-20"></label></div><p><button data-check>Show illustrative times</button></p><p data-message role="status"></p></section><section class="panel"><h2>Illustrative appointment times</h2><div class="slots" data-slots></div></section><section class="panel"><button disabled>Confirm booking — disabled</button> <button disabled>Pay — disabled</button> <button disabled>Register — disabled</button> <button disabled>Publish — disabled</button></section></main><script src="/bundle.js"></script></html>
