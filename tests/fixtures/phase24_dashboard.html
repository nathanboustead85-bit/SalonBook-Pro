<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Boustio — Business dashboard demonstration</title><style>:root{font:16px system-ui;color:#173c38;background:#f3faf8}*{box-sizing:border-box}body{margin:0}header{background:white;padding:18px 24px;font-size:27px;color:#087d7b;font-weight:800}main{max-width:1100px;margin:auto;padding:20px}.notice{background:#fff0d5;border-radius:12px;padding:14px}.hero{background:#dcefeb;border-radius:20px;overflow:hidden;margin:18px 0}.cover{height:150px;background:linear-gradient(120deg,#b9ded6,#f3faf8)}.cover img{width:100%;height:100%;object-fit:cover}.identity{padding:22px}.identity img{width:72px;height:72px;border-radius:16px;object-fit:cover}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.card{min-width:0;background:white;border:1px solid #d4e8e2;border-radius:16px;padding:20px;overflow-wrap:anywhere}.card h3{margin:0 0 12px}.status{font-size:13px;color:#49645f}button{font:inherit;padding:12px;background:#087d7b;color:white;border:0;border-radius:9px;margin:5px}button:disabled{background:#a7b9b4}button:focus-visible{outline:3px solid #d6a536}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style><header>Boustio ☁</header><main><h1>Business dashboard preview</h1><p class="notice">Synthetic local demonstration only. Registration, customer bookings, payments and publishing are disabled. No production data is connected.</p><button data-refresh>Refresh saved demo sections</button><p data-message role="status"></p><section class="hero" data-hero><div class="cover"><img data-cover hidden alt="Business cover preview"></div><div class="identity"><img data-logo hidden alt="Business logo preview"><h2 data-business></h2><p data-tagline></p><p data-completeness></p></div></section><div class="grid" data-cards></div><p><button disabled>Register — disabled</button><button disabled>Accept bookings — disabled</button><button disabled>Payments — disabled</button><button disabled>Publish — disabled</button></p></main><script src="/bundle.js"></script></html>
