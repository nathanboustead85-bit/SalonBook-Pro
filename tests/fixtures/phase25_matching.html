<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Boustio — Staff matching preview</title><style>:root{font:16px system-ui;color:#153e38;background:#f1faf7}*{box-sizing:border-box}body{margin:0}header{padding:20px;background:white;color:#087d7b;font-size:28px;font-weight:800}main{max-width:920px;margin:auto;padding:20px}.notice{padding:16px;background:#fff0d7;border-radius:12px}.panel{background:white;border:1px solid #d4e8e2;border-radius:16px;padding:20px;margin:16px 0}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}label{display:grid;gap:6px}select,input,button{font:inherit;padding:12px;max-width:100%;border-radius:9px;border:1px solid #a3c7bf}button{background:#087d7b;color:white;cursor:pointer}button:disabled{background:#aebdb8}.slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.slot{padding:12px;background:#e8f7f3;border-radius:9px}@media(max-width:650px){.grid,.slots{grid-template-columns:1fr}}</style><header>Boustio ☁</header><main><h1>Staff and service matching</h1><p class="notice">Synthetic preview only. Matching does not check existing bookings or reserve appointment times. Registration, bookings, payments and publishing are disabled.</p><section class="panel"><div class="grid"><label>Service<select data-service></select></label><label>Assigned professional<select data-staff></select></label><label>Date<input type="date" data-date value="2026-11-20"></label></div><p><button data-check>Show illustrative times</button></p><p data-message role="status"></p></section><section class="panel"><h2>Illustrative times</h2><div class="slots" data-slots></div></section><section class="panel"><button disabled>Confirm booking</button> <button disabled>Pay</button> <button disabled>Register</button> <button disabled>Publish</button></section></main><script src="/bundle.js"></script></html>
