<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Boustio — Demo onboarding recovery</title><style>:root{font:16px system-ui;background:#f4faf9;color:#173f3b}*{box-sizing:border-box}body{margin:0}header{background:white;color:#087d7b;padding:20px;font-size:25px;font-weight:800}main{max-width:920px;margin:auto;padding:20px}.notice{background:#fff0d4;border-radius:12px;padding:15px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.panel{background:white;padding:20px;border:1px solid #cfe7e2;border-radius:18px;min-width:0}label{display:block;margin:12px 0}input,select{width:100%;max-width:100%;padding:12px;font:inherit;border:1px solid #7ca69e;border-radius:8px}button{font:inherit;background:#087d7b;color:white;border:0;border-radius:8px;padding:12px;margin:5px;cursor:pointer}button:disabled{background:#a0b2ae}button:focus-visible,input:focus-visible{outline:3px solid #eab244}p{overflow-wrap:anywhere}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style><header>Boustio ☁</header><main><h1>Business setup — saved demo</h1><p class="notice" role="status">Synthetic demonstration only. Saved in this browser, not online. Real registration, bookings, payments and publishing are disabled.</p><div class="grid"><section class="panel"><h2>Demo account</h2><label>Choose demonstration owner<select data-owner><option value="demo-kody">Demo Kody</option><option value="demo-alex">Demo Alex</option></select></label><button data-switch>Switch demo account</button><h2>Business profile</h2><label>Name<input data-name value="Kody Blends"></label><label>Category<select data-category><option>Barber</option><option>Hair salon</option><option>Nails</option><option>Beauty</option></select></label><button data-business>Set business</button><h2>Services and staff</h2><label>Service<input data-service value="Classic haircut"></label><button data-service-add>Add example service (£20, 30 min)</button><label>Professional<input data-staff value="Kody"></label><button data-staff-add>Add example professional</button><p><button data-save>Save demo progress</button><button data-recover>Recover demo progress</button><button data-clear>Clear this demo</button></p></section><section class="panel"><h2>Onboarding progress</h2><p data-progress aria-live="polite"></p><p data-summary></p><h3>Example booking link</h3><p data-link></p><p data-message role="status"></p><button disabled>Register real account — disabled</button><button disabled>Publish — disabled</button><button disabled>Enable bookings — disabled</button><button disabled>Payments — disabled</button></section></div></main><script src="/bundle.js"></script></html>
