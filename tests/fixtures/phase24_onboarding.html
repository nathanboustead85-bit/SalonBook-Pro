<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Boustio — Business setup demonstration</title><style>:root{font:16px system-ui;color:#153e3a;background:#f4faf9}*{box-sizing:border-box}body{margin:0}header{background:white;padding:20px;color:#087d7b;font-weight:800;font-size:26px}main{max-width:920px;margin:auto;padding:24px 16px}h1{font-size:clamp(26px,5vw,42px)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.panel{background:white;border:1px solid #d5e9e5;border-radius:18px;padding:20px;min-width:0}label{display:block;margin:12px 0}input,select,button{font:inherit;padding:12px;border-radius:9px;max-width:100%}input,select{width:100%;border:1px solid #87aaa3}button{background:#087d7b;color:white;border:0;cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #e8a93d;outline-offset:3px}button:disabled{background:#9aadaa;cursor:not-allowed}.notice{background:#fff1d4;padding:14px;border-radius:12px}p,li{overflow-wrap:anywhere}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style><header>Boustio ☁</header><main><h1>Set up your business</h1><p class="notice" role="status">Demonstration only. Registration, real bookings and payments are disabled. Nothing is saved online.</p><div class="grid"><section class="panel"><h2>Business profile</h2><label>Business name<input data-name value="Kody Blends" maxlength="80"></label><label>Business type<select data-category><option>Barber</option><option>Hair salon</option><option>Nails</option><option>Beauty</option></select></label><button data-business>Preview business</button><h2>Services</h2><label>Service name<input data-service value="Classic haircut"></label><label>Price (£)<input data-price type="number" value="20" min="0" max="1000" step=".01"></label><label>Minutes<input data-duration type="number" value="30" min="5" max="480"></label><button data-add-service>Add demo service</button><h2>Team</h2><label>Professional name<input data-staff value="Kody"></label><button data-add-staff>Add demo professional</button></section><section class="panel"><h2>Preview summary</h2><div data-output aria-live="polite"></div><h3>Example booking link</h3><p data-link></p><p data-error role="alert"></p><button disabled aria-disabled="true">Publish business — unavailable</button><p><button disabled aria-disabled="true">Enable bookings — unavailable</button></p><p><button disabled aria-disabled="true">Accept payments — unavailable</button></p></section></div></main><script src="/bundle.js"></script></html>
