name: Boustio Phase 25.5 Synthetic Availability Reliability
on:
  workflow_dispatch:
  push:
    branches:
      - milestone-customer-booking-experience
    paths:
      - 'website/customer/phase25-reliability.mjs'
      - 'tests/fixtures/phase25_reliability.html'
      - 'tests/phase25_reliability_entry.mjs'
      - 'tests/phase25_reliability_browser.test.cjs'
      - 'docs/PHASE25_5_RELIABILITY.md'
      - '.github/workflows/boustio-phase25-reliability.yml'
permissions:
  contents: read
jobs:
  isolated-reliability:
    if: github.repository == 'nathanboustead85-bit/SalonBook-Pro'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: 'true'
      GCLOUD_PROJECT: demo-boustio-phase21
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install isolated browser and Firebase dependencies
        working-directory: tests
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund playwright@1.56.1 esbuild@0.25.12
          npx playwright install --with-deps chromium
      - name: Check syntax
        run: |
          node --check website/customer/phase25-reliability.mjs
          node --check tests/phase25_reliability_entry.mjs
          node --check tests/phase25_reliability_browser.test.cjs
      - name: Run real Chromium and isolated Firebase emulator tests
        run: timeout --signal=TERM --kill-after=10s 420s tests/node_modules/.bin/firebase emulators:exec --project demo-boustio-phase21 --only auth,firestore "node --test tests/phase25_reliability_browser.test.cjs"
