name: Boustio Phase 49.2 Offline Access Review
on:
  workflow_dispatch:
  push:
    branches: [milestone-customer-booking-experience]
    paths:
      - 'web/phase49/**'
      - 'tests/phase49_2_*'
      - '.github/workflows/boustio-phase49-2-access-review.yml'
permissions:
  contents: read
jobs:
  isolated-access-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GCLOUD_PROJECT: demo-boustio-phase49-2
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:18080
      FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:19099
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install isolated dependencies
        run: npm install --no-save --no-package-lock firebase@11 firebase-admin@13 @firebase/rules-unit-testing@4 firebase-tools@14
      - name: IAM review and inherited regressions
        run: node --test tests/phase49_2_access.test.cjs tests/phase49_1_plan.test.cjs tests/phase48_7_audit.test.cjs tests/phase48_6_samsung.test.cjs tests/phase48_5_recovery.test.cjs tests/phase48_4_multidevice.test.cjs tests/phase48_3_appcheck.test.cjs tests/phase48_2_backend.test.cjs tests/phase48_1_readiness.test.cjs tests/phase47_7_audit.test.cjs tests/phase47_6_samsung.test.cjs tests/phase47_5_recovery.test.cjs tests/phase47_4_multidevice.test.cjs tests/phase47_3_appcheck.test.cjs tests/phase47_2_backend.test.cjs tests/phase47_1_boundary.test.cjs tests/phase46_7_review.test.cjs tests/phase46_6_samsung.test.cjs tests/phase46_5_recovery.test.cjs tests/phase46_4_multidevice.test.cjs tests/phase46_3_appcheck.test.cjs tests/phase46_2_backend.test.cjs tests/phase46_1_gaps.test.cjs tests/phase45_5_audit.test.cjs tests/phase45_4_integrity.test.cjs tests/phase45_3_access.test.cjs tests/phase45_2_secrets.test.cjs tests/phase45_1_readiness.test.cjs
      - name: Firebase emulator access isolation
        run: npx firebase-tools emulators:exec --only auth,firestore --project demo-boustio-phase49-2 --config firebase.phase32-4.json "node --test tests/phase49_2_emulator.test.cjs"
      - name: NO_DEPLOYMENT safety gate
        run: |
          test -s web/phase49/README-49-2.md
          echo "PHASE49_2_EMULATOR_ONLY_NO_DEPLOYMENT"
