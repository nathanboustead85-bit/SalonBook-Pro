name: Boustio Phase 21.3 Chromium Real Firebase SDK Emulators
on:
  workflow_dispatch:
  push:
    branches:
      - milestone-customer-booking-experience
    paths:
      - 'tests/phase21_browser_emulator_entry.mjs'
      - 'tests/phase21_playwright_real_sdk_emulators.test.cjs'
      - 'website/business/dashboard/firebase-browser-sdk-adapter.mjs'
      - 'website/business/dashboard/session-integration-foundation.mjs'
      - 'docs/PHASE21_3_CHROMIUM_REAL_SDK_READINESS.md'
      - 'firestore.rules'
      - '.github/workflows/boustio-phase21-chromium-real-sdk.yml'
permissions:
  contents: read
jobs:
  chromium-real-sdk-isolated:
    if: github.repository == 'nathanboustead85-bit/SalonBook-Pro'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: 'true'
      GCLOUD_PROJECT: demo-boustio-phase21
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install isolated test tooling
        working-directory: tests
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund playwright@1.56.1 esbuild@0.25.12
          npx playwright install --with-deps chromium
      - name: Syntax check
        run: |
          node --check tests/phase21_browser_emulator_entry.mjs
          node --check tests/phase21_playwright_real_sdk_emulators.test.cjs
          node --check website/business/dashboard/firebase-browser-sdk-adapter.mjs
      - name: Run real Chromium and Firebase SDK against ephemeral emulators
        run: timeout --signal=TERM --kill-after=10s 420s tests/node_modules/.bin/firebase emulators:exec --project demo-boustio-phase21 --only auth,firestore "node --test tests/phase21_playwright_real_sdk_emulators.test.cjs"
