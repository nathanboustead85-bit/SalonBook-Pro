name: Boustio Phase 38.5 Final Isolated Security Audit
on:
  workflow_dispatch:
  push:
    branches: [milestone-customer-booking-experience]
    paths:
      - 'web/phase38/**'
      - 'tests/phase38_5_*'
      - '.github/workflows/boustio-phase38-5-final-security-audit.yml'
permissions:
  contents: read
jobs:
  isolated-final-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GCLOUD_PROJECT: demo-boustio-phase38-5
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:18080
      FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:19099
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install isolated dependencies
        run: npm install --no-save --no-package-lock firebase@11 firebase-admin@13 @firebase/rules-unit-testing@4 firebase-tools@14
      - name: Final security audit and launch blockers
        run: node --test tests/phase38_5_audit.test.cjs
      - name: Phase 38.2-38.4 comprehensive regression
        run: node --test tests/phase38_2_schema.test.cjs tests/phase38_3_authorization.test.cjs tests/phase38_4_recovery.test.cjs
      - name: Phase 38.5 real Firebase emulator authorization and read-only verification
        run: npx firebase-tools emulators:exec --only auth,firestore --project demo-boustio-phase38-5 --config firebase.phase32-4.json "node --test tests/phase38_5_emulator.test.cjs"
      - name: NO_DEPLOYMENT safety gate
        run: |
          test -s firestore.rules
          test -s firebase.phase32-4.json
          test -s web/phase38/README-38-5.md
          echo "PHASE38_5_SYNTHETIC_ONLY_LAUNCH_NOT_APPROVED_NO_DEPLOYMENT"
