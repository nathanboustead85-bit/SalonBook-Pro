name: Boustio Phase 27.11 Messaging Counter Failure Recovery Tests
on:
  workflow_dispatch:
  push:
    branches:
      - milestone-customer-booking-experience
    paths:
      - 'functions/chatRetentionRecovery.js'
      - 'tests/phase27_11_retention_recovery.test.cjs'
      - 'docs/PHASE27_11_RETENTION_RECOVERY.md'
      - '.github/workflows/boustio-phase27-11-retention-recovery.yml'
permissions:
  contents: read
jobs:
  retention-recovery:
    if: github.repository == 'nathanboustead85-bit/SalonBook-Pro'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: 'true'
      GCLOUD_PROJECT: demo-boustio-phase2711
      GOOGLE_CLOUD_PROJECT: demo-boustio-phase2711
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
      FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
      BOUSTIO_CHAT_ENABLED: 'false'
      BOUSTIO_CHAT_ABUSE_BUDGET_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install isolated emulator dependencies
        run: |
          npm install --prefix tests --no-audit --no-fund
          npm install --prefix functions --no-audit --no-fund
      - name: Validate syntax and disabled flags
        run: |
          node --check functions/chatRetentionRecovery.js
          node --check tests/phase27_11_retention_recovery.test.cjs
          test "$BOUSTIO_CHAT_ENABLED" = false
          test "$BOUSTIO_CHAT_ABUSE_BUDGET_ENABLED" = false
      - name: Run real Firestore emulator recovery tests
        run: timeout --signal=TERM --kill-after=10s 900s tests/node_modules/.bin/firebase emulators:exec --project demo-boustio-phase2711 --only auth,firestore "node --test --test-concurrency=1 tests/phase27_11_retention_recovery.test.cjs"
      - name: Confirm no production deployment
        run: echo 'PHASE27_11=EMULATOR_ONLY_NO_DEPLOYMENT'
