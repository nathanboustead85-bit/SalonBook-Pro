name: Boustio Phase 29.10 Accessible Offline Onboarding QA
on:
  workflow_dispatch:
  push:
    branches: [milestone-customer-booking-experience]
    paths:
      - 'web/phase29/onboarding-29-10.html'
      - 'tests/phase29_10_accessible_onboarding.test.cjs'
      - '.github/workflows/boustio-phase29-10-accessible-onboarding.yml'
permissions:
  contents: read
jobs:
  isolated-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test accessibility and mobile usability
        run: node --test tests/phase29_10_accessible_onboarding.test.cjs
      - name: Run complete Phase 29 regression suite
        run: node --test tests/phase29*.test.cjs
      - name: Verify offline preview
        run: |
          test -s web/phase29/onboarding-29-10.html
          echo "OFFLINE_ONLY_NO_DEPLOYMENT"
      - uses: actions/upload-artifact@v4
        with:
          name: Boustio-Phase29-10-Samsung-HTML
          path: web/phase29/onboarding-29-10.html
          retention-days: 14
