name: Boustio Phase 39.4 Isolated Android Compatibility
on:
  workflow_dispatch:
  push:
    branches: [milestone-customer-booking-experience]
    paths:
      - 'web/phase39/**'
      - 'tests/phase39_4_*'
      - '.github/workflows/boustio-phase39-4-android-compatibility.yml'
permissions:
  contents: read
jobs:
  isolated-android-compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GCLOUD_PROJECT: demo-boustio-phase39-4
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:18080
      FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:19099
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install isolated test dependencies
        run: npm install --no-save --no-package-lock firebase@11 firebase-admin@13 @firebase/rules-unit-testing@4 firebase-tools@14
      - name: Phase 39.4 compatibility unit tests
        run: node --test tests/phase39_4_compatibility.test.cjs
      - name: Phase 38.2 and 39.3 regression
        run: node --test tests/phase38_2_schema.test.cjs tests/phase39_3_view.test.cjs
      - name: Phase 39.4 Firebase emulator verification
        run: npx firebase-tools emulators:exec --only auth,firestore --project demo-boustio-phase39-4 --config firebase.phase32-4.json "node --test tests/phase39_4_emulator.test.cjs"
      - name: NO_DEPLOYMENT safety gate
        run: |
          test -s firestore.rules
          test -s firebase.phase32-4.json
          echo "PHASE39_4_SYNTHETIC_ONLY_NO_MIGRATION_NO_DEPLOYMENT"
