name: Boustio Phase 44.3 Isolated Read-Only Business Data
on:
  workflow_dispatch:
  push:
    branches: [milestone-customer-booking-experience]
    paths:
      - 'web/phase44/**'
      - 'tests/phase44_3_*'
      - '.github/workflows/boustio-phase44-3-business-data.yml'
permissions:
  contents: read
jobs:
  isolated-business-data:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GCLOUD_PROJECT: demo-boustio-phase44-3
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:18080
      FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:19099
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install isolated dependencies
        run: npm install --no-save --no-package-lock firebase@11 firebase-admin@13 @firebase/rules-unit-testing@4 firebase-tools@14
      - name: Business data and authorization regression tests
        run: node --test tests/phase44_3_business.test.cjs tests/phase44_2_owner.test.cjs tests/phase44_1_admin.test.cjs
      - name: Firebase emulator owner data verification
        run: npx firebase-tools emulators:exec --only auth,firestore --project demo-boustio-phase44-3 --config firebase.phase32-4.json "node --test tests/phase44_3_emulator.test.cjs"
      - name: NO_DEPLOYMENT safety gate
        run: |
          test -s web/phase44/README-44-3.md
          echo "PHASE44_3_EMULATOR_ONLY_NO_DEPLOYMENT"
