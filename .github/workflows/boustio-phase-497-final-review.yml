name: Boustio Phase 49.7 Final Independent Security Review Preparation
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'security/phase497-*'
      - 'tests/phase497_*'
      - 'docs/security/phase-49-7-final-review-package.md'
      - '.github/workflows/boustio-phase-497-final-review.yml'
permissions:
  contents: read
jobs:
  final-review-preparation:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Consolidated security review and fail-closed launch guard tests
        run: node --test tests/phase497_final_review.test.cjs
      - name: Previous staging readiness regression
        run: node --test tests/phase496_staging_readiness.test.cjs
      - name: Previous evidence integrity regression
        run: node --test tests/phase495_evidence_integrity.test.cjs
      - name: Verify no production credentials
        run: |
          test -z "${GOOGLE_APPLICATION_CREDENTIALS:-}"
          test -z "${FIREBASE_TOKEN:-}"
          echo 'Phase 49.7 preparation only; seven blockers OPEN; no deployment'
