name: Boustio Phase 26.4 Callable Runtime Authorization Audit
on:
  workflow_dispatch:
  push:
    branches:
      - milestone-customer-booking-experience
    paths:
      - 'tests/phase26_callable_runtime.test.cjs'
      - 'docs/PHASE26_4_CALLABLE_RUNTIME.md'
      - '.github/workflows/boustio-phase26-callable-runtime.yml'
permissions:
  contents: read
jobs:
  isolated-callable-runtime:
    if: github.repository == 'nathanboustead85-bit/SalonBook-Pro'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CI: 'true'
      BOUSTIO_CHAT_ENABLED: 'false'
      GCLOUD_PROJECT: demo-boustio-phase264
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate source and isolated runtime test
        run: |
          node --check functions/index.js
          node --check tests/phase26_callable_runtime.test.cjs
          test "$GCLOUD_PROJECT" = demo-boustio-phase264
          test "$BOUSTIO_CHAT_ENABLED" = false
      - name: Execute callable handlers with in-memory Admin doubles
        run: node --test tests/phase26_callable_runtime.test.cjs
      - name: Confirm no production access
        run: echo 'PHASE26_4=IN_MEMORY_CALLABLE_RUNTIME_NO_CREDENTIALS_NO_DEPLOYMENT'
