name: Boustio Phase 12.29 Concurrent Migration Safety
on:
  workflow_dispatch:
jobs:
  concurrency-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: milestone-customer-booking-experience
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install isolated emulator dependencies
        run: |
          npm install --global firebase-tools@14
          npm install --prefix functions --no-save --ignore-scripts
      - name: Run simultaneous migration and stale-write tests
        env:
          GCLOUD_PROJECT: demo-boustio-phase1229
        run: |
          firebase emulators:exec --only firestore --project demo-boustio-phase1229 \
            "node tests/phase1229_concurrent_migration.test.js"
      - name: Regression - backup integrity and recovery
        run: node tests/phase1227_migration_recovery.test.js
      - name: Regression - migration safety
        run: node tests/phase1226_migration_safety.test.js
