name: Boustio Phase 29.17 Mobile Accessibility QA
on:
  workflow_dispatch:
  push:
    branches: [milestone-customer-booking-experience]
    paths:
      - 'web/phase29/onboarding-29-17.html'
      - 'tests/phase29_17_mobile_accessibility.test.cjs'
      - '.github/workflows/boustio-phase29-17-mobile-accessibility.yml'
permissions:
  contents: read
jobs:
  isolated-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test mobile accessibility
        run: node --test tests/phase29_17_mobile_accessibility.test.cjs
      - name: Run full Phase 29 regression suite
        run: node --test tests/phase29*.test.cjs
      - name: Verify offline preview
        run: |
          test -s web/phase29/onboarding-29-17.html
          echo "OFFLINE_ONLY_NO_DEPLOYMENT"
      - uses: actions/upload-artifact@v4
        with:
          name: Boustio-Phase29-17-Samsung-HTML
          path: web/phase29/onboarding-29-17.html
          retention-days: 14
