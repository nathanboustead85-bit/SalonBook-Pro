name: Boustio Phase 21.2 Real Firebase SDK Emulator Integration
on:
  workflow_dispatch:
  push:
    branches:
      - milestone-customer-booking-experience
    paths:
      - 'website/business/dashboard/firebase-browser-sdk-adapter.mjs'
      - 'website/business/dashboard/session-integration-foundation.mjs'
      - 'tests/phase21_firebase_browser_sdk_emulator.test.cjs'
      - 'docs/PHASE21_2_FIREBASE_SDK_READINESS.md'
      - 'firestore.rules'
      - '.github/workflows/boustio-phase21-firebase-sdk-emulators.yml'
permissions:
  contents: read
jobs:
  real-sdk-emulator-integration:
    if: github.repository == 'nathanboustead85-bit/SalonBook-Pro'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
      GCLOUD_PROJECT: demo-boustio-phase21
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install test-only Firebase emulator tooling
        working-directory: tests
        run: npm install --no-audit --no-fund
      - name: Syntax check real SDK adapter and tests
        run: |
          node --check website/business/dashboard/firebase-browser-sdk-adapter.mjs
          node --check tests/phase21_firebase_browser_sdk_emulator.test.cjs
      - name: Run real Firebase SDK integration tests on isolated demo emulators
        run: timeout --signal=TERM --kill-after=10s 240s tests/node_modules/.bin/firebase emulators:exec --project demo-boustio-phase21 --only auth,firestore "node --test tests/phase21_firebase_browser_sdk_emulator.test.cjs"
