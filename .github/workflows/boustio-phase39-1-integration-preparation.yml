name: Boustio Phase 39.1 Isolated Dashboard Integration Preparation
on:
  workflow_dispatch:
  push:
    branches: [milestone-customer-booking-experience]
    paths:
      - 'web/phase39/**'
      - 'tests/phase39_1_*'
      - '.github/workflows/boustio-phase39-1-integration-preparation.yml'
permissions:
  contents: read
jobs:
  isolated-integration-preparation:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GCLOUD_PROJECT: demo-boustio-phase39-1
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:18080
      FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:19099
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install isolated test dependencies
        run: npm install --no-save --no-package-lock firebase@11 firebase-admin@13 @firebase/rules-unit-testing@4 firebase-tools@14
      - name: Phase 39.1 dependency contract and fail-closed tests
        run: node --test tests/phase39_1_contract.test.cjs
      - name: Phase 38 integration safety regression
        run: node --test tests/phase38_3_authorization.test.cjs tests/phase38_4_recovery.test.cjs tests/phase38_5_audit.test.cjs
      - name: Phase 39.1 local Firebase emulator integration
        run: npx firebase-tools emulators:exec --only auth,firestore --project demo-boustio-phase39-1 --config firebase.phase32-4.json "node --test tests/phase39_1_emulator.test.cjs"
      - name: NO_DEPLOYMENT safety gate
        run: |
          test -s firestore.rules
          test -s firebase.phase32-4.json
          test -s web/phase39/README-39-1.md
          echo "PHASE39_1_SYNTHETIC_ONLY_NO_PRODUCTION_NO_DEPLOYMENT"
