name: Boustio Phase 39.3 Isolated Secure Dashboard View Model
on:
  workflow_dispatch:
  push:
    branches: [milestone-customer-booking-experience]
    paths:
      - 'web/phase39/**'
      - 'tests/phase39_3_*'
      - '.github/workflows/boustio-phase39-3-secure-view-model.yml'
permissions:
  contents: read
jobs:
  isolated-secure-view-model:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GCLOUD_PROJECT: demo-boustio-phase39-3
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:18080
      FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:19099
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install isolated test dependencies
        run: npm install --no-save --no-package-lock firebase@11 firebase-admin@13 @firebase/rules-unit-testing@4 firebase-tools@14
      - name: Phase 39.3 view model unit and accessibility-contract tests
        run: node --test tests/phase39_3_view.test.cjs
      - name: Phase 39.2 and Phase 38 regression
        run: node --test tests/phase39_2_session.test.cjs tests/phase38_3_authorization.test.cjs tests/phase38_4_recovery.test.cjs
      - name: Phase 39.3 Firebase emulator verification
        run: npx firebase-tools emulators:exec --only auth,firestore --project demo-boustio-phase39-3 --config firebase.phase32-4.json "node --test tests/phase39_3_emulator.test.cjs"
      - name: NO_DEPLOYMENT safety gate
        run: |
          test -s firestore.rules
          test -s firebase.phase32-4.json
          echo "PHASE39_3_SYNTHETIC_ONLY_NO_PRODUCTION_NO_DEPLOYMENT"
