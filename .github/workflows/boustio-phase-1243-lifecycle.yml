name: Boustio Phase 12.43 Availability Withdrawal and Expiry
on:
  workflow_dispatch:
jobs:
  lifecycle-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: milestone-customer-booking-experience
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install emulator dependencies
        run: |
          npm install --global firebase-tools@14
          npm install --prefix functions --no-save --ignore-scripts @firebase/rules-unit-testing@4
      - name: Check lifecycle syntax
        run: |
          node --check functions/phase1243AvailabilityLifecycle.js
          node --check tests/phase1243_availability_lifecycle.test.js
      - name: Test isolated expiry and withdrawal
        env:
          GCLOUD_PROJECT: demo-boustio-phase1243
        run: |
          firebase emulators:exec --config tests/phase1243.firebase.json --only firestore --project demo-boustio-phase1243 \
            "node tests/phase1243_availability_lifecycle.test.js"
      - name: Re-run public snapshot privacy tests
        run: node tests/phase1240_public_availability_projection.test.js
      - name: Re-run production readiness gate
        run: node tests/phase1230_readiness_gate.test.js
