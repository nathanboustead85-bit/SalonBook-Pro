name: Boustio Phase 12.25 Separate Sandbox APK
on:
  workflow_dispatch:
jobs:
  build-sandbox:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - name: Check out Phase 12.25 source
        uses: actions/checkout@v4
        with:
          ref: milestone-customer-booking-experience
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify separate package and real Firebase sandbox client
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          gradle=Path('app/build.gradle.kts').read_text()
          assert 'applicationId = "com.salonbook.pro"' in gradle
          assert 'applicationIdSuffix = ".phase1223sandbox"' in gradle
          assert 'versionNameSuffix = "-phase-12.25-sandbox"' in gradle
          config=json.loads(Path('app/src/debug/google-services.json').read_text())
          assert config['project_info']['project_id']=='salonbook-pro-ad5ff'
          assert any(c['client_info']['android_client_info']['package_name']=='com.salonbook.pro.phase1223sandbox' for c in config['client'])
          src=Path('app/src/main/java/com/salonbook/pro/MainActivity.kt').read_text()
          assert 'setPositiveButton("Inspect")' in src
          assert 'append("\\nLegacy cloud bookings: ")' in src
          assert 'append("\\nInspection issues: ")' in src
          assert 'append("\\n\\nRead-only inspection. No bookings were changed.")' in src
          assert '.setMessage(summary)' in src
          assert 'OwnerMigrationInspector.inspect()' in src
          print('PASS: separate package, matching Firebase client, opt-in inspector')
          PY
      - name: Restore existing signing keystore
        shell: bash
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for value in SIGNING_KEYSTORE_BASE64 SIGNING_STORE_PASSWORD SIGNING_KEY_ALIAS SIGNING_KEY_PASSWORD; do
            if [[ -z "${!value}" ]]; then
              echo "::error::Missing required signing secret: $value"
              exit 1
            fi
          done
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/salonbook-sandbox.jks"
          chmod 600 "$RUNNER_TEMP/salonbook-sandbox.jks"
      - name: Build signed separate debug APK
        env:
          SIGNING_KEYSTORE_PATH: ${{ runner.temp }}/salonbook-sandbox.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload Phase 12.25 sandbox APK
        uses: actions/upload-artifact@v4
        with:
          name: Boustio-Phase-12.25-Sandbox-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
