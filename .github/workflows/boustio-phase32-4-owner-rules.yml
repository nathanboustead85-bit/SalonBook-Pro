name: Boustio Phase 32.4 Real Owner Security Rules Emulator Tests
on:
  workflow_dispatch:
  push:
    branches: [milestone-customer-booking-experience]
    paths:
      - 'web/phase32/firebase.emulator-32-4.json'
      - 'tests/phase32_4_owner_rules.test.cjs'
      - 'web/phase32/README-32-4.md'
      - '.github/workflows/boustio-phase32-4-owner-rules.yml'
      - 'firestore.rules'
permissions:
  contents: read
jobs:
  real-owner-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install isolated emulator rules testing dependencies
        run: npm install --no-save --no-package-lock --ignore-scripts firebase@11 @firebase/rules-unit-testing@4
      - name: Phase 32.1 and 32.2 static safety regressions
        run: node --test tests/phase32_1_staging_preparation.test.cjs tests/phase32_2_emulator_validation.test.cjs
      - name: Run actual repository Firestore rules against local demo emulator
        run: |
          npx --yes firebase-tools@14 emulators:exec --non-interactive --only firestore,auth --project demo-boustio-phase32-staging --config web/phase32/firebase.emulator-32-4.json "node --test tests/phase32_4_owner_rules.test.cjs"
      - name: Phase 31 regression
        run: node --test tests/phase31_*.test.cjs
      - name: Phase 30 regression
        run: node --test tests/phase30*.test.cjs
      - name: Phase 29 regression
        run: node --test tests/phase29*.test.cjs
      - name: No deployment verification
        run: |
          test -s firestore.rules
          echo "DEMO_ONLY_REAL_RULES_TEST_NO_DEPLOYMENT"
