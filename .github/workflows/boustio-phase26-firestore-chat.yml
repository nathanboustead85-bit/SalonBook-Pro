name: Boustio Phase 26.7 Real Firestore Messaging Concurrency Audit
on:
  workflow_dispatch:
  push:
    branches:
      - milestone-customer-booking-experience
    paths:
      - 'tests/phase26_firestore_chat_concurrency.test.cjs'
      - 'docs/PHASE26_7_FIRESTORE_CONCURRENCY.md'
      - '.github/workflows/boustio-phase26-firestore-chat.yml'
permissions:
  contents: read
jobs:
  firestore-chat-concurrency:
    if: github.repository == 'nathanboustead85-bit/SalonBook-Pro'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: 'true'
      GCLOUD_PROJECT: demo-boustio-phase267
      GOOGLE_CLOUD_PROJECT: demo-boustio-phase267
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
      FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
      BOUSTIO_CHAT_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install isolated emulator and Admin SDK dependencies
        run: |
          npm install --prefix tests --no-audit --no-fund
          npm install --prefix functions --no-audit --no-fund
      - name: Validate safety gates and tests
        run: |
          node --check tests/phase26_firestore_chat_concurrency.test.cjs
          test "$GCLOUD_PROJECT" = demo-boustio-phase267
          test "$BOUSTIO_CHAT_ENABLED" = false
          test "$FIRESTORE_EMULATOR_HOST" = 127.0.0.1:8080
      - name: Run real Firestore emulator transaction tests
        run: timeout --signal=TERM --kill-after=10s 600s tests/node_modules/.bin/firebase emulators:exec --project demo-boustio-phase267 --only auth,firestore "node --test --test-concurrency=1 tests/phase26_firestore_chat_concurrency.test.cjs"
      - name: Confirm no deployment
        run: echo 'PHASE26_7=REAL_LOCAL_FIRESTORE_EMULATOR_NO_DEPLOYMENT_NO_PRODUCTION_DATA'
