name: Boustio Phase 29.11 Business Readiness Offline QA
on:
  workflow_dispatch:
  push:
    branches: [milestone-customer-booking-experience]
    paths:
      - 'web/phase29/onboarding-29-11.html'
      - 'tests/phase29_11_business_readiness.test.cjs'
      - '.github/workflows/boustio-phase29-11-business-readiness.yml'
permissions:
  contents: read
jobs:
  isolated-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test Phase 29.11 business readiness
        run: node --test tests/phase29_11_business_readiness.test.cjs
      - name: Run Phase 29 regression tests
        run: node --test tests/phase29*.test.cjs
      - name: Verify offline-only preview
        run: |
          test -s web/phase29/onboarding-29-11.html
          echo "OFFLINE_ONLY_NO_DEPLOYMENT"
      - uses: actions/upload-artifact@v4
        with:
          name: Boustio-Phase29-11-Samsung-HTML
          path: web/phase29/onboarding-29-11.html
          retention-days: 14
