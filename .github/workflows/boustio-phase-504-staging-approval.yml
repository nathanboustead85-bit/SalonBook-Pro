name: Boustio Phase 50.4 Staging Approval Planning
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'security/phase504-*'
      - 'tests/phase504_*'
      - 'docs/security/phase-50-4-staging-approval-checklist.md'
      - '.github/workflows/boustio-phase-504-staging-approval.yml'
permissions:
  contents: read
jobs:
  approval-planning:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enforce pending staging approval and launch safety
        run: node security/phase504-approval-guard.cjs
      - name: Test approval refusal and negative cases
        run: node --test tests/phase504_staging_approval.test.cjs
      - name: Preserve staging design regression
        run: node --test tests/phase503_staging_policy.test.cjs
      - name: No production credentials
        run: |
          test -z "${GOOGLE_APPLICATION_CREDENTIALS:-}"
          test -z "${FIREBASE_TOKEN:-}"
          echo 'Approval planning only; seven blockers OPEN; no staging creation'
