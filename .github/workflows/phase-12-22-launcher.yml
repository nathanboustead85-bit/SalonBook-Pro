name: Boustio Phase 12.22 Test APK
on:
  workflow_dispatch:
jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TEST_APPLICATION_ID: com.salonbook.pro.phase1222sandbox
      TEST_APP_LABEL: Boustio Test 12.22
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-12-22-safe-booking-time
      - name: Verify safe recovered booking-time handling
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path('app/src/main/java/com/salonbook/pro/MainActivity.kt').read_text()
          assert 'val start = runCatching { toMinutes(time) }.getOrNull()' in s
          assert 'start == null || start !in 0..1439' in s
          assert 'return@setOnClickListener' in s
          print('Phase 12.22 safe booking time guard verified')
          PY
      - name: Run booking guard regression checks
        run: python3 tests/phase_12_19_booking_guard.py
      - name: Verify strict clock-time handling
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path('app/src/main/java/com/salonbook/pro/MainActivity.kt').read_text()
          assert 'Regex("^(?:[01][0-9]|2[0-3]):[0-5][0-9]$")' in s
          assert 'time == "24:00"' in s
          assert 'runCatching { toMinutes(other.time) }.getOrNull()' in s
          print('Strict clock validation and malformed saved-time handling verified')
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Add Firebase build configuration for the test package
        # Build-only mapping: does not register a Firebase Android application.
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          package_name = os.environ['TEST_APPLICATION_ID']
          for path in (Path('app/google-services.json'), Path('app/src/debug/google-services.json')):
              config = json.loads(path.read_text())
              sandbox = json.loads(json.dumps(config['client'][0]))
              sandbox['client_info']['android_client_info']['package_name'] = package_name
              config['client'].append(sandbox)
              path.write_text(json.dumps(config))
          PY
      - name: Build separate test APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify the packaged Android ID and launcher name
        run: |
          aapt=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          metadata=$("$aapt" dump badging app/build/outputs/apk/debug/app-debug.apk)
          grep -F "package: name='$TEST_APPLICATION_ID'" <<< "$metadata"
          grep -Fx "application-label:'$TEST_APP_LABEL'" <<< "$metadata"
      - uses: actions/upload-artifact@v4
        with:
          name: Boustio-Phase-12-22-SEPARATE-TEST-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
