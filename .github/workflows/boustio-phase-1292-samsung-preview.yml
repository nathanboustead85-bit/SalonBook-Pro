name: Boustio Phase 12.92 Samsung Preview Artifacts
on:
  workflow_dispatch:
  push:
    branches: [milestone-customer-booking-experience]
    paths:
      - 'web/phase1287/**'
      - 'web/phase1292/**'
      - 'web/phase131/**'
      - 'web/phase132/**'
      - 'web/phase133/**'
      - 'web/phase134/**'
      - 'web/phase135/**'
      - 'web/phase136/**'
      - 'backend/phase137/**'
      - 'tests/phase137_*'
      - 'tests/phase136_*'
      - 'firestore.rules'
      - 'tests/phase135_*'
      - 'tests/phase134_*'
      - 'tests/phase133_*'
      - 'tests/phase132_*'
      - 'tests/phase131_*'
      - 'tests/phase1292_*'
      - 'tests/phase1293_*'
      - 'tests/phase1294_*'
      - 'tests/phase1295_*'
      - 'tests/phase1296_*'
      - 'tests/phase1297_*'
      - 'tests/phase1298_*'
      - 'tests/phase1299_*'
      - 'tests/phase12100_*'
      - 'tests/phase12101_*'
      - 'tests/phase12102_*'
      - 'tests/phase12103_*'
      - 'tests/phase12104_*'
      - 'tests/phase12105_*'
      - 'tests/phase12106_*'
      - 'tests/phase12107_*'
      - 'tests/phase12108_*'
      - 'tests/phase12109_*'
      - 'tests/phase12110_*'
      - 'tests/phase1290_accessibility_browser.cjs'
      - '.github/workflows/boustio-phase-1292-samsung-preview.yml'
permissions:
  contents: read
jobs:
  samsung-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run contracts and regression checks
        run: |
          node tests/phase137_public_slug_lookup.test.js
          node tests/phase136_trusted_slug_resolver.test.js
          node tests/phase135_public_directory_rules.test.js
          node tests/phase134_firebase_public_bridge.test.js
          node tests/phase133_public_catalogue_loader.test.js
          node tests/phase132_public_catalogue_display.test.js
          node tests/phase131_public_business_profile.test.js
          node tests/phase12110_final_release_contract.test.js
          node tests/phase12109_revise_details.test.js
          node tests/phase12108_restart_demo.test.js
          node tests/phase12107_edit_selection.test.js
          node tests/phase12106_invalid_focus.test.js
          node tests/phase12105_continue_details.test.js
          node tests/phase12104_summary_next_step.test.js
          node tests/phase12103_selection_progress.test.js
          node tests/phase12102_field_guidance.test.js
          node tests/phase12101_details_readiness.test.js
          node tests/phase12100_confirmation_polish.test.js
          node tests/phase1299_selection_reset.test.js
          node tests/phase1298_time_groups.test.js
          node tests/phase1297_professional_cards.test.js
          node tests/phase1296_service_cards.test.js
          node tests/phase1295_date_presentation.test.js
          node tests/phase1294_premium_polish.test.js
          node tests/phase1293_premium_layout.test.js
          node tests/phase1292_preview_contract.test.js
          node tests/phase1291_visual_contract.test.js
          node tests/phase1290_accessibility_contract.test.js
          node tests/phase1289_mobile_contract.test.js
          node tests/phase1288_mobile_contract.test.js
          node tests/phase1287_booking_interface.test.js
          node tests/phase1286_booking_journey_preview.test.js
          node tests/phase1285_customer_confirmation_preview.test.js
          node tests/phase1284_booking_review.test.js
          node tests/phase1283_appointment_selection.test.js
          node tests/phase1282_service_staff_selection.test.js
          node tests/phase1281_catalogue_presentation.test.js
          node tests/phase1280_catalogue_contract.test.js
          node tests/phase1279_published_profile_adapter.test.js
      - name: Start local preview server
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/boustio-preview-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8765/web/phase1287/index.html > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/boustio-preview-server.log
          exit 1
      - name: Test mobile journey and generate screenshots
        run: |
          node tests/phase1288_mobile_browser.cjs
          node tests/phase1289_mobile_progress.cjs
          node tests/phase1290_accessibility_browser.cjs
          node tests/phase1291_visual_browser.cjs
          node tests/phase12110_final_release_browser.cjs
          node tests/phase12109_revise_details_browser.cjs
          node tests/phase12108_restart_demo_browser.cjs
          node tests/phase12107_edit_selection_browser.cjs
          node tests/phase12106_invalid_focus_browser.cjs
          node tests/phase12105_continue_details_browser.cjs
          node tests/phase12104_summary_next_step_browser.cjs
          node tests/phase12103_selection_progress_browser.cjs
          node tests/phase12102_field_guidance_browser.cjs
          node tests/phase12101_details_readiness_browser.cjs
          node tests/phase12100_confirmation_polish_browser.cjs
          node tests/phase1299_selection_reset_browser.cjs
          node tests/phase1298_time_groups_browser.cjs
          node tests/phase1297_professional_cards_browser.cjs
          node tests/phase1296_service_cards_browser.cjs
          node tests/phase1292_samsung_capture.cjs
      - name: Package static demo website
        run: |
          mkdir -p artifacts/phase1292-preview-site/web
          cp -r web/phase1280 web/phase1281 web/phase1282 web/phase1283 web/phase1284 web/phase1285 web/phase1286 web/phase1287 artifacts/phase1292-preview-site/web/
          cp web/phase1292/SAMSUNG_PREVIEW_README.txt web/phase1292/PHASE_12_110_RELEASE_CHECKLIST.txt artifacts/phase1292-preview-site/
      - name: Upload Samsung screenshots
        uses: actions/upload-artifact@v4
        with:
          name: phase1292-samsung-preview
          path: artifacts/phase1292-samsung-preview/
          if-no-files-found: error
          retention-days: 14
      - name: Upload static demo website
        uses: actions/upload-artifact@v4
        with:
          name: phase1292-preview-site
          path: artifacts/phase1292-preview-site/
          if-no-files-found: error
          retention-days: 14
