name: Boustio Phase 46.2 Isolated Backend Contract
on:
  workflow_dispatch:
  push:
    branches: [milestone-customer-booking-experience]
    paths:
      - 'web/phase46/**'
      - 'tests/phase46_2_*'
      - '.github/workflows/boustio-phase46-2-backend-contract.yml'
permissions:
  contents: read
jobs:
  isolated-backend-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GCLOUD_PROJECT: demo-boustio-phase46-2
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:18080
      FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:19099
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install isolated dependencies
        run: npm install --no-save --no-package-lock firebase@11 firebase-admin@13 @firebase/rules-unit-testing@4 firebase-tools@14
      - name: Backend contract and launch readiness regressions
        run: node --test tests/phase46_2_backend.test.cjs tests/phase46_1_gaps.test.cjs tests/phase45_5_audit.test.cjs tests/phase45_4_integrity.test.cjs tests/phase45_3_access.test.cjs tests/phase45_2_secrets.test.cjs tests/phase45_1_readiness.test.cjs
      - name: Firebase emulator security boundary verification
        run: npx firebase-tools emulators:exec --only auth,firestore --project demo-boustio-phase46-2 --config firebase.phase32-4.json "node --test tests/phase46_2_emulator.test.cjs"
      - name: NO_DEPLOYMENT safety gate
        run: |
          test -s web/phase46/README-46-2.md
          echo "PHASE46_2_EMULATOR_ONLY_NO_DEPLOYMENT"
