name: Boustio Phase 47.2 Isolated Trusted Backend
on:
  workflow_dispatch:
  push:
    branches: [milestone-customer-booking-experience]
    paths:
      - 'web/phase47/**'
      - 'tests/phase47_2_*'
      - '.github/workflows/boustio-phase47-2-trusted-backend.yml'
permissions:
  contents: read
jobs:
  isolated-trusted-backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GCLOUD_PROJECT: demo-boustio-phase47-2
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:18080
      FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:19099
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install isolated dependencies
        run: npm install --no-save --no-package-lock firebase@11 firebase-admin@13 @firebase/rules-unit-testing@4 firebase-tools@14
      - name: Trusted backend and security regressions
        run: node --test tests/phase47_2_backend.test.cjs tests/phase47_1_boundary.test.cjs tests/phase46_7_review.test.cjs tests/phase46_6_samsung.test.cjs tests/phase46_5_recovery.test.cjs tests/phase46_4_multidevice.test.cjs tests/phase46_3_appcheck.test.cjs tests/phase46_2_backend.test.cjs tests/phase46_1_gaps.test.cjs tests/phase45_5_audit.test.cjs tests/phase45_4_integrity.test.cjs tests/phase45_3_access.test.cjs tests/phase45_2_secrets.test.cjs tests/phase45_1_readiness.test.cjs
      - name: Firebase emulator trusted backend isolation
        run: npx firebase-tools emulators:exec --only auth,firestore --project demo-boustio-phase47-2 --config firebase.phase32-4.json "node --test tests/phase47_2_emulator.test.cjs"
      - name: NO_DEPLOYMENT safety gate
        run: |
          test -s web/phase47/README-47-2.md
          echo "PHASE47_2_EMULATOR_ONLY_NO_DEPLOYMENT"
