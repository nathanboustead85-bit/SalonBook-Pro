name: Boustio Phase 17.30 Read-Only Cloud Function Permission Diagnosis
on:
  workflow_dispatch:
    inputs:
      approval:
        description: 'Type DIAGNOSE_READONLY_ACCESS (no deployment or writes)'
        required: true
        type: string
permissions:
  contents: read
  id-token: write
concurrency:
  group: boustio-phase1730-readonly-diagnostic
  cancel-in-progress: false
jobs:
  diagnose:
    if: ${{ inputs.approval == 'DIAGNOSE_READONLY_ACCESS' && github.ref == 'refs/heads/milestone-customer-booking-experience' && github.repository == 'nathanboustead85-bit/SalonBook-Pro' }}
    runs-on: ubuntu-latest
    environment: boustio-function-deployment
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: milestone-customer-booking-experience
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify diagnostic safeguards
        run: |
          node --check scripts/phase1730_readonly_diagnostic.js
          node tests/phase1730_readonly_diagnostic.test.js
      - name: Authenticate protected deployment identity
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/107806967630/locations/global/workloadIdentityPools/boustio-github/providers/github-development-deploy
          service_account: boustio-function-deployer@salonbook-pro-ad5ff.iam.gserviceaccount.com
          project_id: salonbook-pro-ad5ff
          create_credentials_file: true
          export_environment_variables: true
      - uses: google-github-actions/setup-gcloud@v2
      - name: Diagnose read-only Cloud Functions and Cloud Run access
        env:
          BOUSTIO_PHASE1730_APPROVAL: ${{ inputs.approval }}
        run: node scripts/phase1730_readonly_diagnostic.js
