name: Boustio Phase 30.13 Selected Time Clarity Preview
on:
  workflow_dispatch:
  push:
    branches: [milestone-customer-booking-experience]
    paths:
      - 'web/phase30/booking-30-13.html'
      - 'tests/phase30_13_selected_time.test.cjs'
      - '.github/workflows/boustio-phase30-13-selected-time.yml'
permissions:
  contents: read
jobs:
  isolated-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test selected time visibility and clearing
        run: node --test tests/phase30_13_selected_time.test.cjs
      - name: Full Phase 30 regression
        run: node --test tests/phase30*.test.cjs
      - name: Preserve Phase 29 regression
        run: node --test tests/phase29*.test.cjs
      - name: Verify offline preview
        run: |
          test -s web/phase30/booking-30-13.html
          echo "OFFLINE_PREVIEW_NO_BOOKINGS_NO_DEPLOYMENT"
      - uses: actions/upload-artifact@v4
        with:
          name: Boustio-Phase30-13-Samsung-HTML
          path: web/phase30/booking-30-13.html
          retention-days: 30
