name: Boustio Phase 28.3 Public Catalogue Firestore Emulator
on:
  workflow_dispatch:
  push:
    branches:
      - milestone-customer-booking-experience
    paths:
      - 'tests/phase28_3_public_catalogue_emulator.test.cjs'
      - 'docs/PHASE28_3_PUBLIC_CATALOGUE_EMULATOR.md'
      - '.github/workflows/boustio-phase28-3-public-catalogue-emulator.yml'
permissions:
  contents: read
jobs:
  isolated-firestore-public-catalogue:
    if: github.repository == 'nathanboustead85-bit/SalonBook-Pro'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: 'true'
      GCLOUD_PROJECT: demo-boustio-phase283
      BOUSTIO_CHAT_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install isolated Firebase emulator dependencies
        working-directory: tests
        run: npm install --no-audit --no-fund
      - name: Check syntax
        run: node --check tests/phase28_3_public_catalogue_emulator.test.cjs
      - name: Run real Firestore emulator integration tests
        run: timeout --signal=TERM --kill-after=10s 300s tests/node_modules/.bin/firebase emulators:exec --project demo-boustio-phase283 --only firestore "node --test tests/phase28_3_public_catalogue_emulator.test.cjs"
      - name: Confirm no production deployment
        run: echo 'FIRESTORE_EMULATOR_ONLY_NO_DEPLOYMENT'
