name: Boustio Phase 43.3 Isolated App Check Policy
on:
  workflow_dispatch:
  push:
    branches: [milestone-customer-booking-experience]
    paths:
      - 'web/phase43/**'
      - 'tests/phase43_3_*'
      - '.github/workflows/boustio-phase43-3-app-check-policy.yml'
permissions:
  contents: read
jobs:
  isolated-app-check-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GCLOUD_PROJECT: demo-boustio-phase43-3
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:18080
      FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:19099
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install isolated dependencies
        run: npm install --no-save --no-package-lock firebase@11 firebase-admin@13 @firebase/rules-unit-testing@4 firebase-tools@14
      - name: App Check policy and prior revocation regression tests
        run: node --test tests/phase43_3_policy.test.cjs tests/phase43_2_revocation.test.cjs tests/phase43_1_auth.test.cjs
      - name: Synthetic Firebase emulator access and policy verification
        run: npx firebase-tools emulators:exec --only auth,firestore --project demo-boustio-phase43-3 --config firebase.phase32-4.json "node --test tests/phase43_3_emulator.test.cjs"
      - name: NO_DEPLOYMENT safety gate
        run: |
          test -s web/phase43/README-43-3.md
          echo "PHASE43_3_EMULATOR_ONLY_NO_DEPLOYMENT"
