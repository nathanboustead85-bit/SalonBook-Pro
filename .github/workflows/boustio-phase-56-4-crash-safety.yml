name: Boustio Phase 56.4 crash safety simulations
on:
  push:
    paths:
      - 'app/src/main/java/com/salonbook/pro/RecoveryCrashSimulator.kt'
      - 'app/src/test/java/com/salonbook/pro/RecoveryCrashSimulatorTest.kt'
      - 'tests/phase564_crash_safety_isolation.test.cjs'
      - '.github/workflows/boustio-phase-56-4-crash-safety.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  crash-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Synthetic crash safety JUnit tests
        run: gradle --no-daemon :app:testReleaseUnitTest --tests com.salonbook.pro.RecoveryCrashSimulatorTest
      - name: Isolation and launch safety gate tests
        run: node --test tests/phase564_crash_safety_isolation.test.cjs
