name: Boustio Phase 56.2 snapshot recovery safety
on:
  push:
    paths:
      - 'app/src/main/java/com/salonbook/pro/SnapshotRecoveryVerifier.kt'
      - 'app/src/test/java/com/salonbook/pro/SnapshotRecoveryVerifierTest.kt'
      - 'tests/phase562_snapshot_recovery_isolation.test.cjs'
      - '.github/workflows/boustio-phase-56-2-snapshot-recovery.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  snapshot-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Synthetic snapshot recovery unit tests
        run: gradle --no-daemon :app:testReleaseUnitTest --tests com.salonbook.pro.SnapshotRecoveryVerifierTest
      - name: Isolation and launch safety tests
        run: node --test tests/phase562_snapshot_recovery_isolation.test.cjs
