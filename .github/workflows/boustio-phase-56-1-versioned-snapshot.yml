name: Boustio Phase 56.1 versioned snapshot protocol
on:
  push:
    paths:
      - 'app/src/main/java/com/salonbook/pro/VersionedSnapshotProtocol.kt'
      - 'app/src/test/java/com/salonbook/pro/VersionedSnapshotProtocolTest.kt'
      - 'tests/phase561_versioned_snapshot_isolation.test.cjs'
      - '.github/workflows/boustio-phase-56-1-versioned-snapshot.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  versioned-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Synthetic versioned snapshot JUnit tests
        run: gradle --no-daemon :app:testReleaseUnitTest --tests com.salonbook.pro.VersionedSnapshotProtocolTest
      - name: Isolation and safety gate tests
        run: node --test tests/phase561_versioned_snapshot_isolation.test.cjs
