name: Boustio Phase 50.1 Controlled Staging Discovery
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'security/phase501-*'
      - 'tests/phase501_*'
      - 'docs/security/phase-50-1-controlled-staging-discovery.md'
      - '.github/workflows/boustio-phase-501-staging-inventory.yml'
permissions:
  contents: read
jobs:
  staging-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate read-only staging inventory and safety invariants
        run: node --test tests/phase501_staging_inventory.test.cjs
      - name: Preserve final independent security review guard
        run: node --test tests/phase497_final_review.test.cjs
      - name: No production credentials
        run: |
          test -z "${GOOGLE_APPLICATION_CREDENTIALS:-}"
          test -z "${FIREBASE_TOKEN:-}"
          echo 'Discovery only; no staging or production access; seven blockers OPEN'
