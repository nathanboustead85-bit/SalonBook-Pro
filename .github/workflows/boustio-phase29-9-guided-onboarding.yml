name: Boustio Phase 29.9 Guided Offline Onboarding QA
on:
  workflow_dispatch:
  push:
    branches: [milestone-customer-booking-experience]
    paths:
      - 'web/phase29/onboarding-29-9.html'
      - 'tests/phase29_9_guided_onboarding.test.cjs'
      - '.github/workflows/boustio-phase29-9-guided-onboarding.yml'
permissions:
  contents: read
jobs:
  isolated-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run Phase 29.9 tests
        run: node --test tests/phase29_9_guided_onboarding.test.cjs
      - name: Run Phase 29 regression tests
        run: node --test tests/phase29*.test.cjs
      - name: Confirm offline-only preview
        run: |
          test -s web/phase29/onboarding-29-9.html
          echo "NO_DEPLOYMENT_NO_LIVE_FEATURES"
      - uses: actions/upload-artifact@v4
        with:
          name: Boustio-Phase29-9-Samsung-HTML
          path: web/phase29/onboarding-29-9.html
          retention-days: 14
