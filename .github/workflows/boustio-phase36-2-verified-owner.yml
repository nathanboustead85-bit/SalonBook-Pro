name: Boustio Phase 36.2 Isolated Verified Owner Sessions
on:
  workflow_dispatch:
  push:
    branches: [milestone-customer-booking-experience]
    paths:
      - 'web/phase36/verified-owner-session-36-2.js'
      - 'tests/phase36_2_verified_owner_session.test.cjs'
      - 'web/phase36/README-36-2.md'
      - '.github/workflows/boustio-phase36-2-verified-owner.yml'
permissions:
  contents: read
jobs:
  isolated-verified-owner:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GCLOUD_PROJECT: demo-boustio-phase36-2
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:18080
      FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:19099
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install isolated Firebase test dependencies
        run: npm install --no-save --no-package-lock firebase@11 firebase-admin@13 @firebase/rules-unit-testing@4 firebase-tools@14
      - name: Real Auth and Firestore emulator verified owner session tests
        run: npx firebase-tools emulators:exec --only auth,firestore --project demo-boustio-phase36-2 --config firebase.phase32-4.json "node --test tests/phase36_2_verified_owner_session.test.cjs"
      - name: Phase 34 regression suite
        run: node --test tests/phase34_*.test.cjs
      - name: Phase 33 regression suite
        run: node --test tests/phase33_*.test.cjs
      - name: Phase 35.5 offline audit regression
        run: node --test tests/phase35_5_final_audit.test.cjs
      - name: No deployment verification
        run: |
          test -s firestore.rules
          test -s firebase.phase32-4.json
          echo "PHASE36_2_AUTH_FIRESTORE_EMULATORS_ONLY_NO_DEPLOYMENT"
