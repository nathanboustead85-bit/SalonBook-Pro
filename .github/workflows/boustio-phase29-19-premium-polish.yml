name: Boustio Phase 29.19 Premium Mobile Polish QA
on:
  workflow_dispatch:
  push:
    branches: [milestone-customer-booking-experience]
    paths:
      - 'web/phase29/onboarding-29-19.html'
      - 'tests/phase29_19_premium_polish.test.cjs'
      - '.github/workflows/boustio-phase29-19-premium-polish.yml'
permissions:
  contents: read
jobs:
  isolated-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test premium mobile polish
        run: node --test tests/phase29_19_premium_polish.test.cjs
      - name: Run full Phase 29 regression suite
        run: node --test tests/phase29*.test.cjs
      - name: Verify offline preview
        run: |
          test -s web/phase29/onboarding-29-19.html
          echo "OFFLINE_ONLY_NO_DEPLOYMENT"
      - uses: actions/upload-artifact@v4
        with:
          name: Boustio-Phase29-19-Samsung-HTML
          path: web/phase29/onboarding-29-19.html
          retention-days: 14
