name: Boustio Phase 22.3 Real Browser Dashboard Firebase Integration
on:
  workflow_dispatch:
  push:
    branches:
      - milestone-customer-booking-experience
    paths:
      - 'tests/phase22_secure_dashboard_entry.mjs'
      - 'tests/phase22_secure_dashboard_browser.test.cjs'
      - 'website/business/dashboard/secure-interface-foundation.mjs'
      - 'website/business/dashboard/firebase-integration-foundation.mjs'
      - 'website/business/dashboard/firebase-browser-sdk-adapter.mjs'
      - 'website/business/dashboard/session-integration-foundation.mjs'
      - 'docs/PHASE22_3_SECURE_DASHBOARD_INTERFACE.md'
      - 'firestore.rules'
      - '.github/workflows/boustio-phase22-secure-dashboard.yml'
permissions:
  contents: read
jobs:
  isolated-real-browser-dashboard:
    if: github.repository == 'nathanboustead85-bit/SalonBook-Pro'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: 'true'
      GCLOUD_PROJECT: demo-boustio-phase21
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install isolated Firebase and Chromium test dependencies
        working-directory: tests
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund playwright@1.56.1 esbuild@0.25.12
          npx playwright install --with-deps chromium
      - name: Check integration test syntax
        run: |
          node --check tests/phase22_secure_dashboard_entry.mjs
          node --check tests/phase22_secure_dashboard_browser.test.cjs
          node --check website/business/dashboard/firebase-integration-foundation.mjs
          node --check website/business/dashboard/secure-interface-foundation.mjs
      - name: Run real Chromium dashboard against isolated Firebase emulators
        run: timeout --signal=TERM --kill-after=10s 420s tests/node_modules/.bin/firebase emulators:exec --project demo-boustio-phase21 --only auth,firestore "node --test tests/phase22_secure_dashboard_browser.test.cjs"
