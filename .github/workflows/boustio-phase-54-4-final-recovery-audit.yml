name: Boustio Phase 54.4 final recovery audit
on:
  push:
    paths:
      - 'app/src/main/java/com/salonbook/pro/DurableRecoveryJournal.kt'
      - 'app/src/test/java/com/salonbook/pro/DurableRecoveryJournalTest.kt'
      - 'app/src/test/java/com/salonbook/pro/DurableRecoveryJournalFinalAuditTest.kt'
      - 'tests/phase544_recovery_release_gate.test.cjs'
      - '.github/workflows/boustio-phase-54-4-final-recovery-audit.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  final-recovery-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Kotlin synthetic recovery and regression tests
        run: gradle --no-daemon :app:testReleaseUnitTest --tests com.salonbook.pro.DurableRecoveryJournalTest --tests com.salonbook.pro.DurableRecoveryJournalFinalAuditTest
      - name: Verify recovery isolation and all seven launch gates
        run: node --test tests/phase544_recovery_release_gate.test.cjs
