name: Boustio Phase 12.20 Test APK
on:
  workflow_dispatch:
  push:
    branches: [phase-12-20-test-build-identity]
jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TEST_APPLICATION_ID: com.salonbook.pro.phase1220sandbox
      TEST_APP_LABEL: Boustio Test 12.20
    steps:
      - uses: actions/checkout@v4
      - name: Run booking guard regression checks
        run: python3 tests/phase_12_19_booking_guard.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Add Firebase build configuration for the test package
        # Build-only mapping: does not register a Firebase Android application.
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          package_name = os.environ['TEST_APPLICATION_ID']
          for path in (Path('app/google-services.json'), Path('app/src/debug/google-services.json')):
              config = json.loads(path.read_text())
              sandbox = json.loads(json.dumps(config['client'][0]))
              sandbox['client_info']['android_client_info']['package_name'] = package_name
              config['client'].append(sandbox)
              path.write_text(json.dumps(config))
          PY
      - name: Build separate test APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify the packaged Android ID and launcher name
        run: |
          aapt=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          metadata=$("$aapt" dump badging app/build/outputs/apk/debug/app-debug.apk)
          grep -F "package: name='$TEST_APPLICATION_ID'" <<< "$metadata"
          grep -Fx "application-label:'$TEST_APP_LABEL'" <<< "$metadata"
      - uses: actions/upload-artifact@v4
        with:
          name: Boustio-Phase-12-20-SEPARATE-TEST-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
