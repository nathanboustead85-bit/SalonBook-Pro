name: Boustio Phase 12.47 Mobile Staging Demo
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: boustio-phase-1247-pages
  cancel-in-progress: false
jobs:
  staging:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: milestone-customer-booking-experience
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify staging is standalone and safe
        run: |
          node tests/phase1247_staging_demo.test.js
          node tests/phase1230_readiness_gate.test.js
      - name: Prepare static-only deployment
        run: |
          mkdir -p _site
          cp web/phase1247/index.html _site/index.html
          printf '%s\n' 'User-agent: *' 'Disallow: /' > _site/robots.txt
          touch _site/.nojekyll
          test "$(find _site -type f | wc -l)" -eq 3
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy synthetic demo to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
