name: Boustio Phase 70.7 employee website
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: boustio-phase-70-7-employee-website
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: bbf0b52f7cb03890989bfe049329dc49ab944094
          path: historical-source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/phase70-1-web-architecture.test.cjs tests/phase70-2-web-recovery.test.cjs
      - run: npm install --no-save --no-package-lock @playwright/test@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: cp -R preview historical-source/preview
      - run: npx playwright test tests/phase70-4-browser.spec.cjs tests/phase70-5-unified.spec.cjs tests/phase70-6-customers.spec.cjs tests/phase70-7-employees.spec.cjs --workers=1 --reporter=list
