name: Boustio Phase 59.5 secure offline chat foundation
on:
  push:
    paths:
      - 'chat/security.cjs'
      - 'tests/phase59-5-chat-foundation.test.cjs'
      - 'security/phase59-5-chat-foundation.md'
      - '.github/workflows/boustio-phase-59-5-chat-foundation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  secure-chat-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run isolated secure chat validation tests
        run: node --test tests/phase59-5-chat-foundation.test.cjs
