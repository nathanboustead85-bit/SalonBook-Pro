name: Boustio Phase 55.3 snapshot consistency
on:
  push:
    paths:
      - 'app/src/main/java/com/salonbook/pro/AndroidStorageSnapshotAdapter.kt'
      - 'app/src/test/java/com/salonbook/pro/AndroidStorageSnapshotAdapterTest.kt'
      - 'app/src/test/java/com/salonbook/pro/AndroidStorageSnapshotAdapterValidationTest.kt'
      - 'app/src/test/java/com/salonbook/pro/AndroidStorageSnapshotConsistencyTest.kt'
      - 'tests/phase553_snapshot_consistency.test.cjs'
      - '.github/workflows/boustio-phase-55-3-snapshot-consistency.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  snapshot-consistency:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run synthetic snapshot consistency and existing adapter unit tests
        run: gradle --no-daemon :app:testReleaseUnitTest --tests com.salonbook.pro.AndroidStorageSnapshotAdapterTest --tests com.salonbook.pro.AndroidStorageSnapshotAdapterValidationTest --tests com.salonbook.pro.AndroidStorageSnapshotConsistencyTest
      - name: Verify isolation and launch blockers
        run: node --test tests/phase553_snapshot_consistency.test.cjs
