name: Boustio Phase 17 critical security regression
on:
  workflow_dispatch:
  push:
    paths:
      - "functions/phase17PublicDatabaseWriter.js"
      - "functions/phase17RecoveryClaim.js"
      - "functions/phase17ClaimedRecovery.js"
      - "functions/phase17DurableRecovery.js"
      - "tests/phase17_critical_security.test.js"
      - ".github/workflows/boustio-phase17-critical-security.yml"
permissions:
  contents: read
jobs:
  security-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node tests/phase17_critical_security.test.js
      - run: node tests/phase17_end_to_end_recovery.test.js
      - run: node tests/phase17_recovery_claim.test.js
      - run: node tests/phase17_recovery_firestore_store.test.js
      - run: node tests/phase17_durable_recovery.test.js
      - run: node tests/phase17_publication_recovery.test.js
      - run: node tests/phase17_trusted_revision.test.js
      - run: node tests/phase17_public_database_writer.test.js
