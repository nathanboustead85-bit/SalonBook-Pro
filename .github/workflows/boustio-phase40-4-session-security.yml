name: Boustio Phase 40.4 Isolated Session Security
on:
  workflow_dispatch:
  push:
    branches: [milestone-customer-booking-experience]
    paths:
      - 'web/phase40/**'
      - 'tests/phase40_4_*'
      - '.github/workflows/boustio-phase40-4-session-security.yml'
permissions:
  contents: read
jobs:
  isolated-session-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GCLOUD_PROJECT: demo-boustio-phase40-4
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:18080
      FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:19099
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install isolated emulator dependencies
        run: npm install --no-save --no-package-lock firebase@11 firebase-admin@13 @firebase/rules-unit-testing@4 firebase-tools@14
      - name: Session and prior phase negative regression
        run: node --test tests/phase40_4_security.test.cjs tests/phase40_3_contract.test.cjs tests/phase40_1_negative.test.cjs
      - name: Firebase emulator owner and revocation failure regression
        run: npx firebase-tools emulators:exec --only auth,firestore --project demo-boustio-phase40-4 --config firebase.phase32-4.json "node --test tests/phase40_4_emulator.test.cjs"
      - name: NO_DEPLOYMENT safety gate
        run: |
          test -s web/phase40/README-40-4.md
          test -s firestore.rules
          echo "PHASE40_4_SYNTHETIC_ONLY_NO_LIVE_FEATURES_NO_DEPLOYMENT"
