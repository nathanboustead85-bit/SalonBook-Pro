name: Boustio Phase 58.4 Kotlin runtime verification
on:
  push:
    paths:
      - 'app/src/test/java/com/salonbook/pro/recovery/**'
      - 'app/src/main/java/com/salonbook/pro/recovery/**'
      - 'app/build.gradle.kts'
      - 'security/phase58-4-kotlin-runtime-verification.json'
      - '.github/workflows/boustio-phase-58-4-kotlin-runtime-verification.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  kotlin-recovery-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile and run actual Kotlin local unit tests
        run: gradle :app:testDebugUnitTest --tests 'com.salonbook.pro.recovery.RecoveryPreviewValidatorTest' --no-daemon --stacktrace
      - name: Verify all launch gates remain open
        run: |
          node -e "const a=require('./security/phase58-4-kotlin-runtime-verification.json'),g=require('./security/phase51-consolidated-gates.json');if(a.productionRestoreEnabled||a.deployment||a.originalAndroidAppointments!=='DO_NOT_TOUCH'||Object.values(g.gates).some(x=>x.status!=='OPEN'))process.exit(1)"
