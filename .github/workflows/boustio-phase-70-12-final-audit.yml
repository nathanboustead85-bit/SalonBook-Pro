name: Boustio Phase 70.12 final website audit
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: boustio-phase-70-12-final-audit
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: bbf0b52f7cb03890989bfe049329dc49ab944094
          path: historical-source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/phase70-1-web-architecture.test.cjs tests/phase70-2-web-recovery.test.cjs
      - run: npm install --no-save --no-package-lock @playwright/test@1.56.1
      - run: npx playwright install --with-deps chromium webkit firefox
      - run: node preview/make-icons.cjs
      - run: cp -R preview historical-source/preview
      - run: npx playwright test tests/phase70-4-browser.spec.cjs tests/phase70-5-unified.spec.cjs tests/phase70-6-customers.spec.cjs tests/phase70-7-employees.spec.cjs tests/phase70-8-messages.spec.cjs tests/phase70-9-insights.spec.cjs --workers=1 --reporter=list
      - run: npx playwright test tests/phase70-10-pwa.spec.cjs --browser=chromium --workers=1 --reporter=list
      - run: npx playwright test tests/phase70-10-pwa.spec.cjs --browser=webkit --workers=1 --reporter=list
      - run: npx playwright test tests/phase70-4-browser.spec.cjs tests/phase70-5-unified.spec.cjs tests/phase70-6-customers.spec.cjs tests/phase70-7-employees.spec.cjs tests/phase70-8-messages.spec.cjs tests/phase70-9-insights.spec.cjs --browser=webkit --workers=1 --reporter=list
      - run: npx playwright test tests/phase70-4-browser.spec.cjs tests/phase70-5-unified.spec.cjs tests/phase70-6-customers.spec.cjs tests/phase70-7-employees.spec.cjs tests/phase70-8-messages.spec.cjs tests/phase70-9-insights.spec.cjs tests/phase70-10-pwa.spec.cjs --browser=firefox --workers=1 --reporter=list
      - run: npx playwright test tests/phase70-11-security.spec.cjs --browser=all --workers=1 --reporter=list
      - run: npx playwright test tests/phase70-12-audit.spec.cjs --browser=all --workers=1 --reporter=list
