name: Boustio Phase 30.4 Premium Confirmation Preview
on:
  workflow_dispatch:
  push:
    branches: [milestone-customer-booking-experience]
    paths:
      - 'web/phase30/booking-30-4.html'
      - 'tests/phase30_4_premium_confirmation.test.cjs'
      - '.github/workflows/boustio-phase30-4-premium-confirmation.yml'
permissions:
  contents: read
jobs:
  isolated-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test premium confirmation and reset
        run: node --test tests/phase30_4_premium_confirmation.test.cjs
      - name: Full Phase 30 regression
        run: node --test tests/phase30*.test.cjs
      - name: Preserve Phase 29 regression
        run: node --test tests/phase29*.test.cjs
      - name: Verify standalone preview
        run: |
          test -s web/phase30/booking-30-4.html
          echo "OFFLINE_PREVIEW_NO_BOOKINGS_NO_DEPLOYMENT"
      - uses: actions/upload-artifact@v4
        with:
          name: Boustio-Phase30-4-Samsung-HTML
          path: web/phase30/booking-30-4.html
          retention-days: 30
