name: Boustio Phase 37.1 Isolated Browser Dashboard
on:
  workflow_dispatch:
  push:
    branches: [milestone-customer-booking-experience]
    paths:
      - 'web/phase37/**'
      - 'tests/phase37_1_browser.test.mjs'
      - '.github/workflows/boustio-phase37-1-browser-dashboard.yml'
permissions:
  contents: read
jobs:
  isolated-browser-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GCLOUD_PROJECT: demo-boustio-phase36-5
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:18080
      FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:19099
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install isolated browser and Firebase test dependencies
        run: npm install --no-save --no-package-lock jsdom@26 firebase@11 firebase-admin@13 @firebase/rules-unit-testing@4 firebase-tools@14
      - name: Phase 37.1 browser DOM tests
        run: node --test tests/phase37_1_browser.test.mjs
      - name: Phase 36.5 real Auth and Firestore emulator audit
        run: npx firebase-tools emulators:exec --only auth,firestore --project demo-boustio-phase36-5 --config firebase.phase32-4.json "node --test tests/phase36_5_final_integration_audit.test.cjs"
      - name: Phase 36.4 dashboard regression
        run: npx firebase-tools emulators:exec --only auth,firestore --project demo-boustio-phase36-4 --config firebase.phase32-4.json "node --test tests/phase36_4_secure_dashboard_session.test.cjs"
        env:
          GCLOUD_PROJECT: demo-boustio-phase36-4
      - name: Phase 34 regression
        run: node --test tests/phase34_*.test.cjs
      - name: Phase 33 regression
        run: node --test tests/phase33_*.test.cjs
      - name: No deployment verification
        run: |
          test -s firestore.rules
          test -s firebase.phase32-4.json
          echo "PHASE37_1_BROWSER_PREVIEW_NO_DEPLOYMENT"
