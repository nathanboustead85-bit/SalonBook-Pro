name: Boustio Phase 12.39 Catalogue Schema Adapter
on:
  workflow_dispatch:
jobs:
  catalogue-adapter:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: milestone-customer-booking-experience
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check catalogue adapter syntax
        run: |
          node --check web/phase1239/catalogueAdapter.js
          node --check tests/phase1239_catalogue_adapter.test.js
      - name: Test actual public profile v1 compatibility
        run: node tests/phase1239_catalogue_adapter.test.js
      - name: Re-run isolated availability safeguards
        run: node tests/phase1238_availability_preview.test.js
      - name: Re-run customer preview safeguards
        run: node tests/phase1237_customer_booking_preview.test.js
      - name: Re-run readiness safeguards
        run: node tests/phase1230_readiness_gate.test.js
