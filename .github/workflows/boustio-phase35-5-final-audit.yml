name: Boustio Phase 35.5 Final Isolated Firebase Audit
on:
  workflow_dispatch:
  push:
    branches: [milestone-customer-booking-experience]
    paths:
      - 'web/phase35/final-audit-35-5.js'
      - 'tests/phase35_5_final_audit.test.cjs'
      - 'web/phase35/README-35-5.md'
      - '.github/workflows/boustio-phase35-5-final-audit.yml'
permissions:
  contents: read
jobs:
  final-isolated-firebase-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install isolated Firebase emulator test dependencies
        run: npm install --no-save --no-package-lock firebase@11 @firebase/rules-unit-testing@4 firebase-tools@14
      - name: Phase 35.1 real Firestore security-rule tests
        env:
          GCLOUD_PROJECT: demo-boustio-phase35-1
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:18080
        run: npx firebase-tools emulators:exec --only firestore --project demo-boustio-phase35-1 --config firebase.phase32-4.json "node --test tests/phase35_1_firestore_emulator.test.cjs"
      - name: Phase 35.2 atomic transaction and concurrency tests
        env:
          GCLOUD_PROJECT: demo-boustio-phase35-2
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:18080
        run: npx firebase-tools emulators:exec --only firestore --project demo-boustio-phase35-2 --config firebase.phase32-4.json "node --test tests/phase35_2_atomic_refresh.test.cjs"
      - name: Phase 35.3 real Auth and Firestore lifecycle tests
        env:
          GCLOUD_PROJECT: demo-boustio-phase35-3
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:18080
          FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:19099
        run: npx firebase-tools emulators:exec --only auth,firestore --project demo-boustio-phase35-3 --config firebase.phase32-4.json "node --test tests/phase35_3_auth_lifecycle.test.cjs"
      - name: Phase 35.4 emulator and injected network failure tests
        env:
          GCLOUD_PROJECT: demo-boustio-phase35-4
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:18080
        run: npx firebase-tools emulators:exec --only firestore --project demo-boustio-phase35-4 --config firebase.phase32-4.json "node --test tests/phase35_4_network_recovery.test.cjs"
      - name: Phase 35.5 final isolated security audit
        run: node --test tests/phase35_5_final_audit.test.cjs
      - name: Phase 34 regression suite
        run: node --test tests/phase34_*.test.cjs
      - name: Phase 33 regression suite
        run: node --test tests/phase33_*.test.cjs
      - name: Phase 32 static and offline regression
        run: |
          files=$(find tests -maxdepth 1 -name 'phase32_*.test.cjs' ! -name 'phase32_3_emulator_runtime.test.cjs' ! -name 'phase32_[4-8]_*.test.cjs' | sort)
          test -n "$files"
          node --test $files
      - name: Phase 32.3 deny-all Firestore and Auth emulator runtime tests
        env:
          GCLOUD_PROJECT: demo-boustio-phase32-staging
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:18080
          FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:19099
        run: npx firebase-tools emulators:exec --only firestore,auth --project demo-boustio-phase32-staging --config web/phase32/firebase.emulator-32-3.json "node --test tests/phase32_3_emulator_runtime.test.cjs"
      - name: Phase 32.4-32.8 real Firestore security rule regressions
        env:
          GCLOUD_PROJECT: demo-boustio-phase32-staging
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:18080
          FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:19099
        run: npx firebase-tools emulators:exec --only firestore,auth --project demo-boustio-phase32-staging --config firebase.phase32-4.json "node --test tests/phase32_[4-8]_*.test.cjs"
      - name: Phase 31 regression suite
        run: node --test tests/phase31_*.test.cjs
      - name: Phase 30 regression suite
        run: node --test tests/phase30_*.test.cjs
      - name: Phase 29 regression suite
        run: node --test tests/phase29_*.test.cjs
      - name: Verify no production deployment
        run: |
          test -s firestore.rules
          test -s firebase.phase32-4.json
          echo "PHASE35_5_ISOLATED_AUDIT_ONLY_PRODUCTION_NOT_APPROVED_NO_DEPLOYMENT"
