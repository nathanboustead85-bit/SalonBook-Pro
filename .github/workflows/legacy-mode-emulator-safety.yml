name: Boustio Legacy Mode Emulator Safety
on:
  push:
    branches:
      - phase-9d4-teal-clients
    paths:
      - 'functions/controlledLegacyModeInitialization.js'
      - 'functions/controlledLegacyModeInitialization.integration.test.js'
      - 'functions/phase1038ExecutionSecurity.test.js'
      - 'functions/phase1039ExecutionEvidence.js'
      - 'functions/phase1039ExecutionEvidence.test.js'
      - 'functions/phase1040EmulatorLockedInitialization.js'
      - 'functions/phase1040EmulatorLockedInitialization.integration.test.js'
      - 'functions/phase1041EmulatorApprovalIssuance.js'
      - 'functions/phase1041EmulatorApprovalIssuance.integration.test.js'
      - 'functions/phase1042ApprovalEndToEnd.integration.test.js'
      - 'functions/phase1043TrustedEmulatorEvidence.js'
      - 'functions/phase1043TrustedEmulatorEvidence.integration.test.js'
      - 'functions/phase1044KeyRotationAndAudit.js'
      - 'functions/phase1044KeyRotationAndAudit.integration.test.js'
      - 'functions/phase1045SecurityBoundaryReview.test.js'
      - 'functions/phase1046TrustedOrchestrator.js'
      - 'functions/phase1046TrustedOrchestrator.integration.test.js'
      - 'docs/phase-10-45-final-security-boundary-review.md'
      - 'functions/index.js'
      - 'functions/bookingMode.js'
      - '.github/workflows/legacy-mode-emulator-safety.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  legacy-mode-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GCLOUD_PROJECT: demo-boustio-legacy-init
      GOOGLE_CLOUD_PROJECT: demo-boustio-legacy-init
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Firebase function dependencies
        working-directory: functions
        run: npm install --no-audit --no-fund
      - name: Run isolated Firestore emulator integration tests
        run: npx --yes firebase-tools@latest emulators:exec --project demo-boustio-legacy-init --only firestore "node --test functions/controlledLegacyModeInitialization.integration.test.js"
      - name: Run Phase 10.38 static execution security tests (no production credentials)
        run: node --test functions/phase1038ExecutionSecurity.test.js
      - name: Run Phase 10.39 approval and least-privilege evidence policy tests
        run: node --test functions/phase1039ExecutionEvidence.test.js
      - name: Run Phase 10.40 isolated single-use approval and concurrency tests
        run: npx --yes firebase-tools@latest emulators:exec --project demo-boustio-legacy-init --only firestore "node --test functions/phase1040EmulatorLockedInitialization.integration.test.js"
      - name: Run Phase 10.41 isolated approval issuance and audit tests
        run: npx --yes firebase-tools@latest emulators:exec --project demo-boustio-legacy-init --only firestore "node --test functions/phase1041EmulatorApprovalIssuance.integration.test.js"
      - name: Run Phase 10.42 end-to-end approval and booking preservation tests
        run: npx --yes firebase-tools@latest emulators:exec --project demo-boustio-legacy-init --only firestore "node --test functions/phase1042ApprovalEndToEnd.integration.test.js"
      - name: Run Phase 10.43 real Auth emulator and Ed25519 evidence tests
        run: npx --yes firebase-tools@latest emulators:exec --project demo-boustio-legacy-init --only firestore,auth "node --test functions/phase1043TrustedEmulatorEvidence.integration.test.js"
      - name: Run Phase 10.44 signing-key rotation, revocation and signed audit tests
        run: npx --yes firebase-tools@latest emulators:exec --project demo-boustio-legacy-init --only firestore,auth "node --test functions/phase1044KeyRotationAndAudit.integration.test.js"
      - name: Run Phase 10.45 final cross-phase security boundary regression tests
        run: node --test functions/phase1045SecurityBoundaryReview.test.js
      - name: Run Phase 10.46 trusted orchestrator adversarial emulator tests
        run: npx --yes firebase-tools@latest emulators:exec --project demo-boustio-legacy-init --only firestore,auth "node --test functions/phase1046TrustedOrchestrator.integration.test.js"
