name: Boustio Legacy Mode Emulator Safety
on:
  push:
    branches:
      - phase-9d4-teal-clients
    paths:
      - 'functions/controlledLegacyModeInitialization.js'
      - 'functions/controlledLegacyModeInitialization.integration.test.js'
      - 'functions/phase1038ExecutionSecurity.test.js'
      - 'functions/phase1039ExecutionEvidence.js'
      - 'functions/phase1039ExecutionEvidence.test.js'
      - 'functions/phase1040EmulatorLockedInitialization.js'
      - 'functions/phase1040EmulatorLockedInitialization.integration.test.js'
      - 'functions/phase1041EmulatorApprovalIssuance.js'
      - 'functions/phase1041EmulatorApprovalIssuance.integration.test.js'
      - 'functions/phase1042ApprovalEndToEnd.integration.test.js'
      - 'functions/phase1043TrustedEmulatorEvidence.js'
      - 'functions/phase1043TrustedEmulatorEvidence.integration.test.js'
      - 'functions/phase1044KeyRotationAndAudit.js'
      - 'functions/phase1044KeyRotationAndAudit.integration.test.js'
      - 'functions/phase1045SecurityBoundaryReview.test.js'
      - 'functions/phase1046TrustedOrchestrator.js'
      - 'functions/phase1046TrustedOrchestrator.integration.test.js'
      - 'functions/phase1047LegacyBypassPrevention.test.js'
      - 'functions/phase1048SignedApproval.js'
      - 'functions/phase1051IndependentAuditWitness.js'
      - 'functions/phase1053DurableAuditPrototype.js'
      - 'functions/phase1056EmulatorPermissions.js'
      - 'functions/phase1059FinalSecurityReview.test.js'
      - 'functions/phase113BookingEngineContract.js'
      - 'functions/phase112ArchitectureAndContract.test.js'
      - 'docs/phase-11-2-security-booking-architecture.md'
      - 'functions/phase112ArchitecturePolicy.js'
      - 'functions/phase112ArchitecturePolicy.test.js'
      - 'functions/phase113BookingContract.js'
      - 'functions/phase113DemoBookingEngine.js'
      - 'functions/phase113DemoBookingEngine.integration.test.js'
      - 'functions/phase114UkSchedule.js'
      - 'functions/phase114UkSchedule.integration.test.js'
      - 'functions/phase115DemoJourney.js'
      - 'functions/phase115LocalServer.js'
      - 'functions/phase115DemoJourney.integration.test.js'
      - 'functions/phase116OwnerCalendarBridge.js'
      - 'functions/phase116OwnerAuthorizer.js'
      - 'functions/phase116OwnerCalendarBridge.integration.test.js'
      - 'functions/phase117CalendarDevServer.js'
      - 'functions/phase117AndroidCalendar.integration.test.js'
      - 'demo/phase117/**'
      - 'docs/phase-11-7-android-calendar-demo.md'
      - 'functions/phase117DemoCalendarController.js'
      - 'functions/phase117DemoCalendarController.test.js'
      - 'functions/phase118DemoAndroidCalendarServer.js'
      - 'functions/phase118DemoAndroidCalendarServer.test.js'
      - 'demo/phase117/**'
      - 'docs/phase-11-7-android-calendar-interface.md'
      - 'demo/phase116/**'
      - 'docs/phase-11-6-owner-calendar-bridge.md'
      - 'demo/phase115/**'
      - 'docs/phase-11-5-emulator-booking-website.md'
      - 'docs/phase-11-4-uk-scheduling.md'
      - 'docs/phase-11-3-demo-booking-engine.md'
      - 'docs/phase-11-2-security-and-booking-architecture.md'
      - 'docs/phase-10-59-final-security-review.md'
      - 'docs/phase-10-56-permissions.md'
      - 'docs/phase-10-57-booking-protection.md'
      - 'docs/phase-10-58-security-regression.md'
      - 'docs/phase-10-53-durable-audit-recovery.md'
      - 'docs/phase-10-54-durable-witness-integration.md'
      - 'docs/phase-10-55-receipt-crash-integrity.md'
      - 'functions/phase1050ProductionArchitecturePolicy.js'
      - 'functions/phase1050ProductionArchitecturePolicy.test.js'
      - 'docs/phase-10-50-production-security-architecture.md'
      - 'docs/phase-10-45-final-security-boundary-review.md'
      - 'functions/index.js'
      - 'functions/bookingMode.js'
      - '.github/workflows/legacy-mode-emulator-safety.yml'
      - 'functions/phase1110UnifiedCalendarPreview.test.js'
      - 'functions/phase1111UnifiedCalendarFeed.js'
      - 'functions/phase1111UnifiedCalendarFeed.integration.test.js'
      - 'functions/phase1112AndroidEmulatorAdapter.test.js'
      - 'functions/phase1113UnifiedCalendarAndroid.test.js'
      - 'functions/phase1113VersionIdentity.test.js'
      - 'functions/phase1114WebsiteToAndroidHttp.integration.test.js'
      - 'functions/phase1115CloudCalendarContract.js'
      - 'functions/phase1115CloudCalendarContract.test.js'
      - 'docs/phase-11-15-cloud-connection-readiness.md'
      - 'functions/phase1116AndroidCloudContract.test.js'
      - 'functions/phase1117StagingTransport.js'
      - 'functions/phase1117StagingTransport.test.js'
      - 'functions/phase1118StagingReadiness.test.js'
      - 'functions/phase1119CalendarReconciliation.js'
      - 'functions/phase1119CalendarReconciliation.test.js'
      - 'functions/phase1120SafeCalendarRefresh.js'
      - 'functions/phase1120SafeCalendarRefresh.test.js'
      - 'functions/phase1121CalendarReconnect.js'
      - 'functions/phase1121CalendarReconnect.test.js'
      - 'functions/phase1122BookingConflicts.js'
      - 'functions/phase1122BookingConflicts.test.js'
      - 'functions/phase1123SafeConflictResolution.js'
      - 'functions/phase1123SafeConflictResolution.test.js'
      - 'docs/phase-11-17-staging-readiness.md'
      - 'docs/phase-11-16-android-cloud-contract.md'
      - 'app/src/debug/**'
      - 'app/build.gradle.kts'
      - 'app/src/main/java/com/salonbook/pro/MainActivity.kt'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  legacy-mode-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GCLOUD_PROJECT: demo-boustio-legacy-init
      GOOGLE_CLOUD_PROJECT: demo-boustio-legacy-init
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Firebase function dependencies
        working-directory: functions
        run: npm install --no-audit --no-fund
      - name: Run isolated Firestore emulator integration tests
        run: npx --yes firebase-tools@latest emulators:exec --project demo-boustio-legacy-init --only firestore "node --test functions/controlledLegacyModeInitialization.integration.test.js"
      - name: Run Phase 10.38 static execution security tests (no production credentials)
        run: node --test functions/phase1038ExecutionSecurity.test.js
      - name: Run Phase 10.39 approval and least-privilege evidence policy tests
        run: node --test functions/phase1039ExecutionEvidence.test.js
      - name: Run Phase 10.40 isolated single-use approval and concurrency tests
        env:
          BOUSTIO_LEGACY_EMULATOR_TEST_GATE: explicit-test-only
        run: npx --yes firebase-tools@latest emulators:exec --project demo-boustio-legacy-init --only firestore "node --test functions/phase1040EmulatorLockedInitialization.integration.test.js"
      - name: Run Phase 10.41 isolated approval issuance and audit tests
        env:
          BOUSTIO_LEGACY_EMULATOR_TEST_GATE: explicit-test-only
        run: npx --yes firebase-tools@latest emulators:exec --project demo-boustio-legacy-init --only firestore "node --test functions/phase1041EmulatorApprovalIssuance.integration.test.js"
      - name: Run Phase 10.42 end-to-end approval and booking preservation tests
        env:
          BOUSTIO_LEGACY_EMULATOR_TEST_GATE: explicit-test-only
        run: npx --yes firebase-tools@latest emulators:exec --project demo-boustio-legacy-init --only firestore "node --test functions/phase1042ApprovalEndToEnd.integration.test.js"
      - name: Run Phase 10.43 real Auth emulator and Ed25519 evidence tests
        env:
          BOUSTIO_LEGACY_EMULATOR_TEST_GATE: explicit-test-only
        run: npx --yes firebase-tools@latest emulators:exec --project demo-boustio-legacy-init --only firestore,auth "node --test functions/phase1043TrustedEmulatorEvidence.integration.test.js"
      - name: Run Phase 10.44 signing-key rotation, revocation and signed audit tests
        env:
          BOUSTIO_LEGACY_EMULATOR_TEST_GATE: explicit-test-only
        run: npx --yes firebase-tools@latest emulators:exec --project demo-boustio-legacy-init --only firestore,auth "node --test functions/phase1044KeyRotationAndAudit.integration.test.js"
      - name: Run Phase 10.45 final cross-phase security boundary regression tests
        run: node --test functions/phase1045SecurityBoundaryReview.test.js
      - name: Run Phase 10.46–10.58 comprehensive cross-phase security regressions
        env:
          BOUSTIO_LEGACY_EMULATOR_TEST_GATE: explicit-test-only
        run: npx --yes firebase-tools@latest emulators:exec --project demo-boustio-legacy-init --only firestore,auth "node --test functions/phase1046TrustedOrchestrator.integration.test.js"
      - name: Run Phase 10.47 direct legacy bypass regression tests
        run: node --test functions/phase1047LegacyBypassPrevention.test.js
      - name: Run Phase 10.50 least-privilege architecture policy regression tests
        run: node --test functions/phase1050ProductionArchitecturePolicy.test.js
      - name: Run Phase 10.59 final non-destructive security sign-off gates
        run: node --test functions/phase1059FinalSecurityReview.test.js
      - name: Run Phase 11.2 architecture and Phase 11.3 contract static safety gates
        run: node --test functions/phase112ArchitecturePolicy.test.js
      - name: Run Phase 11.2 architecture and booking contract static tests
        run: node --test functions/phase112ArchitectureAndContract.test.js
      - name: Run Phase 11.3 isolated transactional booking integration tests
        run: npx --yes firebase-tools@latest emulators:exec --project demo-boustio-legacy-init --only firestore,auth "node --test functions/phase113DemoBookingEngine.integration.test.js"
      - name: Run Phase 11.4 UK schedules and authenticated customer emulator tests
        run: npx --yes firebase-tools@latest emulators:exec --project demo-boustio-legacy-init --only firestore,auth "node --test functions/phase114UkSchedule.integration.test.js"
      - name: Run Phase 11.5 isolated website booking journey integration tests
        run: npx --yes firebase-tools@latest emulators:exec --project demo-boustio-legacy-init --only firestore,auth "node --test functions/phase115DemoJourney.integration.test.js"
      - name: Run Phase 11.6 isolated owner calendar integration tests
        run: npx --yes firebase-tools@latest emulators:exec --project demo-boustio-legacy-init --only firestore,auth "node --test functions/phase116OwnerCalendarBridge.integration.test.js"
      - name: Run Phase 11.7 isolated Android calendar UI and reconnect tests
        run: npx --yes firebase-tools@latest emulators:exec --project demo-boustio-legacy-init --only firestore,auth "node --test functions/phase117DemoCalendarController.test.js"
      - name: Run Phase 11.7 isolated Android calendar demo integration tests
        run: npx --yes firebase-tools@latest emulators:exec --project demo-boustio-legacy-init --only firestore,auth "node --test functions/phase117AndroidCalendar.integration.test.js"
      - name: Verify Phase 11.13 debug version identity
        run: node --test functions/phase1113VersionIdentity.test.js
      - name: Run Phase 11.13 unified Android calendar lifecycle safety tests
        run: node --test functions/phase1113UnifiedCalendarAndroid.test.js
      - name: Run Phase 11.12 Android debug emulator adapter safety tests
        run: node --test functions/phase1112AndroidEmulatorAdapter.test.js
      - name: Run Phase 11.17 synthetic staging transport security tests
        run: node --test functions/phase1117StagingTransport.test.js
      - name: Run Phase 11.23 conservative booking conflict resolution tests
        run: node --test functions/phase1123SafeConflictResolution.test.js
      - name: Run Phase 11.22 booking conflict detection tests
        run: node --test functions/phase1122BookingConflicts.test.js
      - name: Run Phase 11.21 offline reconnect and recovery tests
        run: node --test functions/phase1121CalendarReconnect.test.js
      - name: Run Phase 11.20 non-destructive calendar refresh tests
        run: node --test functions/phase1120SafeCalendarRefresh.test.js
      - name: Run Phase 11.19 isolated calendar reconciliation tests
        run: node --test functions/phase1119CalendarReconciliation.test.js
      - name: Run Phase 11.18 isolated staging readiness safety tests
        run: node --test functions/phase1118StagingReadiness.test.js
      - name: Run Phase 11.16 Android HTTPS cloud safety tests
        run: node --test functions/phase1116AndroidCloudContract.test.js
      - name: Run Phase 11.15 cloud connection readiness security contract tests
        run: node --test functions/phase1115CloudCalendarContract.test.js
      - name: Run Phase 11.14 website booking to Android HTTP end-to-end integration tests
        run: npx --yes firebase-tools@latest emulators:exec --project demo-boustio-legacy-init --only firestore,auth "node --test functions/phase1114WebsiteToAndroidHttp.integration.test.js"
      - name: Run Phase 11.11 website-to-unified-calendar emulator integration tests
        run: npx --yes firebase-tools@latest emulators:exec --project demo-boustio-legacy-init --only firestore,auth "node --test functions/phase1111UnifiedCalendarFeed.integration.test.js"
      - name: Run Phase 11.10 integrated calendar preview safety tests
        run: node --test functions/phase1110UnifiedCalendarPreview.test.js
      - name: Run Phase 11.8 isolated Android demo API security tests
        run: npx --yes firebase-tools@latest emulators:exec --project demo-boustio-legacy-init --only firestore,auth "node --test functions/phase118DemoAndroidCalendarServer.test.js"

  integrated-calendar-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify debug-only package and synthetic Firebase config
        run: |
          set -euo pipefail
          grep -q 'applicationIdSuffix = ".devcalendar1110"' app/build.gradle.kts
          grep -q 'demo-boustio-legacy-init' app/src/debug/google-services.json
          ! grep -q 'salonbook-pro-ad5ff' app/src/debug/google-services.json
          test -f app/src/debug/java/com/salonbook/pro/debug/DemoCalendarActivity.java
      - name: Build integrated Boustio calendar debug APK
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Boustio-Integrated-Calendar-DEBUG-NOT-PRODUCTION
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
