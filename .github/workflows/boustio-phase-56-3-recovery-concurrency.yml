name: Boustio Phase 56.3 recovery concurrency safety
on:
  push:
    paths:
      - 'app/src/main/java/com/salonbook/pro/RecoveryConcurrencyGuard.kt'
      - 'app/src/test/java/com/salonbook/pro/RecoveryConcurrencyGuardTest.kt'
      - 'tests/phase563_recovery_concurrency_isolation.test.cjs'
      - '.github/workflows/boustio-phase-56-3-recovery-concurrency.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recovery-concurrency:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Synthetic concurrency and rollback JUnit tests
        run: gradle --no-daemon :app:testReleaseUnitTest --tests com.salonbook.pro.RecoveryConcurrencyGuardTest
      - name: Isolation and launch safety gate tests
        run: node --test tests/phase563_recovery_concurrency_isolation.test.cjs
