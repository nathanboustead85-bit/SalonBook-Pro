name: Boustio Phase 20 Firebase Emulator Security
on:
  workflow_dispatch:
  push:
    branches:
      - milestone-customer-booking-experience
    paths:
      - 'tests/phase20_firebase_emulator_integration.test.cjs'
      - 'tests/phase20_auth_lifecycle_emulator.test.cjs'
      - 'tests/phase20_auth_firestore_sdk_emulator.test.cjs'
      - 'tests/phase20_dashboard_session_recovery.test.cjs'
      - 'tests/phase20_real_dashboard_emulator.test.cjs'
      - 'tests/phase20_network_recovery.test.cjs'
      - 'tests/phase20_firestore_offline_emulator.test.cjs'
      - 'tests/phase20_connection_monitor.test.cjs'
      - 'tests/phase20_integrated_sdk_monitor_emulator.test.cjs'
      - 'tests/phase20_browser_connectivity.test.cjs'
      - 'tests/phase20_playwright_browser.test.cjs'
      - 'tests/phase20_playwright_session_recovery.test.cjs'
      - 'tests/phase20_playwright_multidevice.test.cjs'
      - 'tests/phase20_playwright_security_failures.test.cjs'
      - 'tests/phase20_phase_completion_gate.test.cjs'
      - 'website/business/dashboard/session-recovery-foundation.mjs'
      - 'website/business/dashboard/browser-connectivity-foundation.mjs'
      - 'website/business/dashboard/connection-monitor-foundation.mjs'
      - 'website/business/dashboard/network-recovery-foundation.mjs'
      - 'website/business/dashboard/session-integration-foundation.mjs'
      - 'tests/package.json'
      - 'firestore.rules'
      - 'firebase.json'
      - 'docs/PHASE20_FIREBASE_EMULATOR_READINESS.md'
      - 'docs/PHASE20_2_AUTH_LIFECYCLE_READINESS.md'
      - 'docs/PHASE20_3_SDK_INTEGRATION_READINESS.md'
      - 'docs/PHASE20_4_DASHBOARD_SESSION_READINESS.md'
      - 'docs/PHASE20_5_REAL_DASHBOARD_READINESS.md'
      - 'docs/PHASE20_6_NETWORK_RECOVERY_READINESS.md'
      - 'docs/PHASE20_7_FIRESTORE_OFFLINE_READINESS.md'
      - 'docs/PHASE20_8_CONNECTION_MONITOR_READINESS.md'
      - 'docs/PHASE20_9_INTEGRATED_SDK_MONITOR_READINESS.md'
      - 'docs/PHASE20_10_BROWSER_CONNECTIVITY_READINESS.md'
      - 'docs/PHASE20_11_PLAYWRIGHT_READINESS.md'
      - 'docs/PHASE20_12_BROWSER_SESSION_READINESS.md'
      - 'docs/PHASE20_13_MULTIDEVICE_READINESS.md'
      - 'docs/PHASE20_14_SECURITY_FAILURE_READINESS.md'
      - 'docs/PHASE20_15_FINAL_READINESS.md'
      - '.github/workflows/boustio-phase20-firebase-emulators.yml'
permissions:
  contents: read
jobs:
  isolated-emulator-security:
    if: github.repository == 'nathanboustead85-bit/SalonBook-Pro'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
      GCLOUD_PROJECT: demo-boustio-phase20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install test-only Firebase emulator tooling
        working-directory: tests
        run: npm install --no-audit --no-fund
      - name: Syntax check
        run: |
          node --check tests/phase20_firebase_emulator_integration.test.cjs
          node --check tests/phase20_auth_lifecycle_emulator.test.cjs
          node --check tests/phase20_auth_firestore_sdk_emulator.test.cjs
          node --check tests/phase20_dashboard_session_recovery.test.cjs
          node --check tests/phase20_real_dashboard_emulator.test.cjs
          node --check tests/phase20_network_recovery.test.cjs
          node --check tests/phase20_firestore_offline_emulator.test.cjs
          node --check tests/phase20_connection_monitor.test.cjs
          node --check tests/phase20_integrated_sdk_monitor_emulator.test.cjs
          node --check tests/phase20_browser_connectivity.test.cjs
          node --check website/business/dashboard/browser-connectivity-foundation.mjs
          node --check website/business/dashboard/connection-monitor-foundation.mjs
          node --check website/business/dashboard/network-recovery-foundation.mjs
          node --check website/business/dashboard/session-integration-foundation.mjs
      - name: Run Auth and Firestore emulator security tests (demo project only)
        run: timeout --signal=TERM --kill-after=10s 240s tests/node_modules/.bin/firebase emulators:exec --project demo-boustio-phase20 --only auth,firestore "node --test tests/phase20_firebase_emulator_integration.test.cjs tests/phase20_auth_lifecycle_emulator.test.cjs tests/phase20_auth_firestore_sdk_emulator.test.cjs tests/phase20_dashboard_session_recovery.test.cjs tests/phase20_real_dashboard_emulator.test.cjs tests/phase20_network_recovery.test.cjs tests/phase20_firestore_offline_emulator.test.cjs tests/phase20_connection_monitor.test.cjs tests/phase20_integrated_sdk_monitor_emulator.test.cjs tests/phase20_browser_connectivity.test.cjs"

  chromium-browser-recovery:
    if: github.repository == 'nathanboustead85-bit/SalonBook-Pro'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated Playwright browser test tooling
        working-directory: tests
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Syntax check browser test and recovery modules
        run: |
          node --check tests/phase20_playwright_browser.test.cjs
          node --check tests/phase20_playwright_session_recovery.test.cjs
          node --check tests/phase20_playwright_multidevice.test.cjs
          node --check tests/phase20_playwright_security_failures.test.cjs
          node --check tests/phase20_phase_completion_gate.test.cjs
          node --check website/business/dashboard/session-recovery-foundation.mjs
          node --check website/business/dashboard/browser-connectivity-foundation.mjs
          node --check website/business/dashboard/connection-monitor-foundation.mjs
      - name: Run real Chromium offline recovery tests (no production services)
        run: timeout --signal=TERM --kill-after=10s 180s node --test tests/phase20_playwright_browser.test.cjs tests/phase20_playwright_session_recovery.test.cjs tests/phase20_playwright_multidevice.test.cjs tests/phase20_playwright_security_failures.test.cjs tests/phase20_phase_completion_gate.test.cjs
