name: Boustio Phase 73.9.1 cross platform
on:
  workflow_dispatch:
  push:
    branches: [boustio-phase-73-9-2-conflicts]
jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: boustio-phase-73-9-2-conflicts
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: node --test tests/phase73-8-9-integration-audit.test.cjs
      - run: npm install --no-save --package-lock=false firebase-admin@13 firebase-tools@14
      - run: node --test tests/phase66-8-employee-backend.test.cjs tests/phase72-1-sync-architecture.test.cjs tests/phase72-3-access.test.cjs tests/phase72-4-booking-locks.test.cjs tests/phase72-4-2-transaction.test.cjs tests/phase72-4-3-firestore-adapter.test.cjs tests/phase72-4-6-trusted-validation.test.cjs tests/phase72-4-10-audit.test.cjs tests/phase72-5-1-android-contract.test.cjs tests/phase72-5-2-android-request.test.cjs tests/phase72-5-3-android-queue.test.cjs tests/phase72-5-4-android-recovery.test.cjs tests/phase72-5-5-session.test.cjs tests/phase72-5-6-transport.test.cjs tests/phase72-5-10-audit.test.cjs tests/phase72-6-1-web-contract.test.cjs tests/phase72-6-2-web-session.test.cjs tests/phase72-6-7-conflict-resolution.test.cjs tests/phase72-6-9-reliability.test.cjs tests/phase72-6-10-audit.test.cjs tests/phase72-7-1-customer-contract.test.cjs tests/phase72-7-2-customer-security.test.cjs tests/phase72-7-3-trusted-customer.test.cjs tests/phase72-7-8-confirmation-state.test.cjs tests/phase72-7-9-customer-recovery.test.cjs tests/phase72-7-10-audit.test.cjs tests/phase72-8-1-migration-safety.test.cjs tests/phase72-8-2-backup-integrity.test.cjs tests/phase72-8-3-record-validation.test.cjs tests/phase72-8-4-conflict-detection.test.cjs tests/phase72-8-5-migration-dry-run.test.cjs tests/phase72-8-6-recovery.test.cjs tests/phase72-8-7-audit.test.cjs tests/phase72-9-6-audit.test.cjs tests/phase72-10-1-readiness.test.cjs tests/phase72-10-2-adapter-review.test.cjs tests/phase72-10-3-security-gates.test.cjs tests/phase72-10-4-final-verification.test.cjs tests/phase73-1-auth-boundary.test.cjs tests/phase73-6-10-native-audit.test.cjs tests/phase73-7-5-web-receipts.test.cjs tests/phase73-7-7-web-session-recovery.test.cjs tests/phase73-7-8-web-refresh-recovery.test.cjs tests/phase73-7-9-web-recovery-integration.test.cjs tests/phase73-7-10-web-recovery-security.test.cjs tests/phase73-8-1-browser-ui.test.cjs
      - run: npx firebase emulators:exec --config firebase.phase73.json --only auth,firestore --project demo-boustio "node --test tests/phase72-9-5-isolation.test.cjs tests/phase73-2-auth-emulator.test.cjs tests/phase73-3-booking-handler.test.cjs tests/phase73-4-receipts.test.cjs tests/phase73-5-rescheduling.test.cjs tests/phase73-6-2-http-bridge.test.cjs tests/phase73-7-1-web-connector.test.cjs"
        env:
          GCLOUD_PROJECT: demo-boustio

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: boustio-phase-73-9-2-conflicts
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle --no-daemon :app:testIsolatedDebugUnitTest

  native-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: boustio-phase-73-9-2-conflicts
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: npm install --no-save --package-lock=false firebase-admin@13 firebase-tools@14
      - run: npx firebase emulators:exec --config firebase.phase73.json --only auth,firestore --project demo-boustio "node --test --test-concurrency=1 tests/phase73-6-3-native.test.cjs tests/phase73-9-1-cross-platform.test.cjs tests/phase73-9-2-conflicts.test.cjs"
        env:
          GCLOUD_PROJECT: demo-boustio

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false esbuild @playwright/test firebase
      - run: npx esbuild web/phase37/dashboard-37-2-entry.js --bundle --platform=browser --outfile=/tmp/historical-dashboard.js
      - run: npx esbuild preview/dashboard-recovery-entry.cjs --bundle --platform=browser --outfile=bundle.js
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npx playwright test tests/phase73-8-2-dashboard.spec.cjs --browser=all

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --no-save --package-lock=false esbuild @playwright/test firebase firebase-admin@13 firebase-tools@14
      - run: npx esbuild preview/emulator-booking-entry.cjs --bundle --platform=browser --outfile=bundle.js
      - run: npx firebase emulators:exec --config firebase.phase73.json --only auth,firestore --project demo-boustio "npx playwright test tests/phase73-8-3-emulator-dashboard.spec.cjs tests/phase73-8-4-persistent-receipts.spec.cjs tests/phase73-8-5-refresh-recovery.spec.cjs tests/phase73-8-6-recovery-security.spec.cjs tests/phase73-8-7-session-expiry.spec.cjs tests/phase73-8-8-concurrent-bookings.spec.cjs --browser=all --workers=1"
        env:
          GCLOUD_PROJECT: demo-boustio
