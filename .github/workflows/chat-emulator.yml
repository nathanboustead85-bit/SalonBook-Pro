name: Boustio Chat Emulator Smoke Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Firebase tooling
        run: npm install --no-save firebase-tools@14
      - name: Install function dependencies
        working-directory: functions
        run: npm install --no-audit --no-fund
      - name: Check unauthenticated and authenticated chat access in Firebase emulators
        env:
          GCLOUD_PROJECT: demo-boustio-chat
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
          FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
        run: npx firebase emulators:exec --project demo-boustio-chat --only auth,functions,firestore "node --test functions/tests/chat-emulator-smoke.test.js functions/tests/chat-emulator-integration.test.js"
