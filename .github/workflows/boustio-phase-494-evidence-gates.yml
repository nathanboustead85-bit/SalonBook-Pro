name: Boustio Phase 49.4 Independent Evidence Gate Preparation
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'security/phase494-gates.json'
      - 'docs/security/phase-49-4-evidence-and-approval-gates.md'
      - 'tests/phase494_approval_gates.test.cjs'
      - '.github/workflows/boustio-phase-494-evidence-gates.yml'
permissions:
  contents: read
jobs:
  evidence-gate-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fail-closed independent evidence and approval gate regression
        run: node --test tests/phase494_approval_gates.test.cjs
      - name: Previous phase synthetic security regression
        run: node --test tests/phase493_security_preparation.test.cjs
      - name: Verify no production credential variables
        run: |
          test -z "${GOOGLE_APPLICATION_CREDENTIALS:-}"
          test -z "${FIREBASE_TOKEN:-}"
          echo 'Phase 49.4 preparation only: seven launch blockers OPEN; no deployment'
