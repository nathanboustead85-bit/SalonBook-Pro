name: Boustio Phase 33.6 Dashboard Loading and Recovery
on:
  workflow_dispatch:
  push:
    branches: [milestone-customer-booking-experience]
    paths:
      - 'web/phase33/dashboard-refresh-33-6.js'
      - 'tests/phase33_6_dashboard_refresh.test.cjs'
      - 'web/phase33/README-33-6.md'
      - '.github/workflows/boustio-phase33-6-dashboard-refresh.yml'
permissions:
  contents: read
jobs:
  dashboard-refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Phase 33.6 loading, failure and recovery tests
        run: node --test tests/phase33_6_dashboard_refresh.test.cjs
      - name: Phase 33.1 through 33.5 regressions
        run: node --test tests/phase33_1_dashboard_adapter.test.cjs tests/phase33_2_legacy_services.test.cjs tests/phase33_3_staff_mapping.test.cjs tests/phase33_4_opening_hours.test.cjs tests/phase33_5_dashboard_assembly.test.cjs
      - name: Phase 32 offline safety regression
        run: node --test tests/phase32_9_content_recovery.test.cjs tests/phase32_1_staging_preparation.test.cjs tests/phase32_2_emulator_validation.test.cjs tests/phase32_10_final_audit.test.cjs
      - name: Phase 31 regression
        run: node --test tests/phase31_*.test.cjs
      - name: Phase 30 regression
        run: node --test tests/phase30*.test.cjs
      - name: Phase 29 regression
        run: node --test tests/phase29*.test.cjs
      - name: No deployment verification
        run: |
          test -s firestore.rules
          echo "PHASE33_6_OFFLINE_READ_ONLY_NO_DEPLOYMENT"
