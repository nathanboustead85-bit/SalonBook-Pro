name: Boustio Phase 50.2 Firebase Configuration Discovery
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'security/phase502-*'
      - 'tests/phase502_*'
      - 'docs/security/phase-50-2-firebase-configuration-discovery.md'
      - '.github/workflows/boustio-phase-502-config-discovery.yml'
permissions:
  contents: read
jobs:
  config-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify actual Firebase configuration and staging separation guards
        run: node --test tests/phase502_config_discovery.test.cjs
      - name: Preserve Phase 50.1 read-only staging safeguards
        run: node --test tests/phase501_staging_inventory.test.cjs
      - name: Confirm no production credentials
        run: |
          test -z "${GOOGLE_APPLICATION_CREDENTIALS:-}"
          test -z "${FIREBASE_TOKEN:-}"
          echo 'Source discovery only; seven blockers OPEN; no staging execution or deployment'
