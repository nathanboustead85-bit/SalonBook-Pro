name: Boustio Phase 49.5 Evidence Integrity and Independent Review
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'security/phase495-*'
      - 'tests/phase495_*'
      - 'docs/security/phase-49-5-evidence-integrity.md'
      - '.github/workflows/boustio-phase-495-evidence-integrity.yml'
permissions:
  contents: read
jobs:
  evidence-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate integrity, reviewer separation and launch safeguards
        run: node --test tests/phase495_evidence_integrity.test.cjs
      - name: Prior independent approval gate regression
        run: node --test tests/phase494_approval_gates.test.cjs
      - name: Confirm no production credentials
        run: |
          test -z "${GOOGLE_APPLICATION_CREDENTIALS:-}"
          test -z "${FIREBASE_TOKEN:-}"
          echo 'Evidence preparation only: seven blockers OPEN; no deployment'
