name: Boustio Phase 17 named database adapter tests
on:
  workflow_dispatch:
  push:
    paths:
      - "functions/phase17PublicDatabaseAdapter.js"
      - "tests/phase17_named_database_adapter.test.js"
      - ".github/workflows/boustio-phase17-named-database-adapter.yml"
permissions:
  contents: read
jobs:
  named-database-adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node tests/phase17_named_database_adapter.test.js
      - run: node tests/phase17_trusted_publication_bridge.test.js
