name: Boustio Phase 59.12 integrated Firebase chat emulator
on:
  push:
    paths:
      - 'chat/integrated-emulator-chat.cjs'
      - 'tests/phase5912-integration/**'
      - 'security/phase59-12-integrated-chat.md'
      - '.github/workflows/boustio-phase-59-12-integrated-chat.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integrated-chat:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install isolated Firebase and image dependencies
        working-directory: tests/phase5912-integration
        run: npm install --no-audit --no-fund
      - name: Install FFmpeg and FFprobe
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Test integrated Firestore and Storage emulator chat
        working-directory: tests/phase5912-integration
        run: NODE_PATH=./node_modules npx firebase emulators:exec --project demo-boustio-phase5912 --only firestore,storage "node --test integration.test.cjs" --config firebase.json
