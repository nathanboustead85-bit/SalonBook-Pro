name: Boustio Phase 39.5 Final Isolated Dashboard Audit
on:
  workflow_dispatch:
  push:
    branches: [milestone-customer-booking-experience]
    paths:
      - 'web/phase39/**'
      - 'tests/phase39_5_*'
      - '.github/workflows/boustio-phase39-5-final-integration-audit.yml'
permissions:
  contents: read
jobs:
  isolated-final-integration-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GCLOUD_PROJECT: demo-boustio-phase39-5
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:18080
      FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:19099
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install isolated test dependencies
        run: npm install --no-save --no-package-lock firebase@11 firebase-admin@13 @firebase/rules-unit-testing@4 firebase-tools@14
      - name: Phase 39.5 final security and integration audit
        run: node --test tests/phase39_5_audit.test.cjs
      - name: Phase 39.1-39.4 complete unit regression
        run: node --test tests/phase39_1_contract.test.cjs tests/phase39_2_session.test.cjs tests/phase39_3_view.test.cjs tests/phase39_4_compatibility.test.cjs
      - name: Phase 39.5 local Firebase emulator audit
        run: npx firebase-tools emulators:exec --only auth,firestore --project demo-boustio-phase39-5 --config firebase.phase32-4.json "node --test tests/phase39_5_emulator.test.cjs"
      - name: NO_DEPLOYMENT safety gate
        run: |
          test -s firestore.rules
          test -s firebase.phase32-4.json
          test -s web/phase39/README-39-5.md
          echo "PHASE39_5_ISOLATED_ONLY_NO_LIVE_FEATURES_NO_DEPLOYMENT"
