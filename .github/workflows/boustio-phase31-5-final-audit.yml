name: Boustio Phase 31.5 Offline Integration Final Audit
on:
  workflow_dispatch:
  push:
    branches: [milestone-customer-booking-experience]
    paths:
      - 'web/phase31/AUDIT-31-5.md'
      - 'tests/phase31_5_final_audit.test.cjs'
      - '.github/workflows/boustio-phase31-5-final-audit.yml'
permissions:
  contents: read
jobs:
  offline-integration-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Phase 31.5 comprehensive cross-phase audit
        run: node --test tests/phase31_5_final_audit.test.cjs
      - name: Phase 31.1 to 31.4 complete regression
        run: node --test tests/phase31_*.test.cjs
      - name: Existing catalogue and availability compatibility
        run: |
          node tests/phase1239_catalogue_adapter.test.js
          node tests/phase1280_catalogue_contract.test.js
          node tests/phase1240_public_availability_projection.test.js
      - name: Phase 30 full regression
        run: node --test tests/phase30*.test.cjs
      - name: Phase 29 full regression
        run: node --test tests/phase29*.test.cjs
      - name: Verify no production or deployment work
        run: |
          test -s web/phase31/AUDIT-31-5.md
          echo "OFFLINE_AUDIT_ONLY_NO_FIREBASE_WRITES_NO_DEPLOYMENT"
