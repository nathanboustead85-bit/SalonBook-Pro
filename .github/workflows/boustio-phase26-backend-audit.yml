name: Boustio Phase 26.3 Backend Publishing Security Audit
on:
  workflow_dispatch:
  push:
    branches:
      - milestone-customer-booking-experience
    paths:
      - 'tests/phase26_backend_publishing.test.cjs'
      - 'docs/PHASE26_3_BACKEND_PUBLISHING.md'
      - '.github/workflows/boustio-phase26-backend-audit.yml'
permissions:
  contents: read
jobs:
  backend-publishing-audit:
    if: github.repository == 'nathanboustead85-bit/SalonBook-Pro'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: 'true'
      GCLOUD_PROJECT: demo-boustio-phase263
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
      FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install emulator dependencies
        working-directory: tests
        run: npm install --no-audit --no-fund
      - name: Validate source and tests
        run: |
          node --check functions/index.js
          node --check tests/phase26_backend_publishing.test.cjs
          test "$GCLOUD_PROJECT" = demo-boustio-phase263
      - name: Run local Firebase rules and backend contract tests
        run: timeout --signal=TERM --kill-after=10s 420s tests/node_modules/.bin/firebase emulators:exec --project demo-boustio-phase263 --only auth,firestore "node --test tests/phase26_backend_publishing.test.cjs"
      - name: Confirm no production changes
        run: echo 'PHASE26_3=LOCAL_EMULATOR_ONLY_NO_DEPLOYMENT_NO_PRODUCTION_WRITES'
