name: Boustio Phase 41.5 Final Isolated Integration Audit
on:
  workflow_dispatch:
  push:
    branches: [milestone-customer-booking-experience]
    paths:
      - 'web/phase41/**'
      - 'tests/phase41_*'
      - '.github/workflows/boustio-phase41-5-final-audit.yml'
permissions:
  contents: read
jobs:
  isolated-phase41-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GCLOUD_PROJECT: demo-boustio-phase41-5
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:18080
      FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:19099
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install emulator-only dependencies
        run: npm install --no-save --no-package-lock firebase@11 firebase-admin@13 @firebase/rules-unit-testing@4 firebase-tools@14
      - name: Phase 41 full isolated regression and audit
        run: node --test tests/phase41_1_contract.test.cjs tests/phase41_2_auth.test.cjs tests/phase41_3_data.test.cjs tests/phase41_4_recovery.test.cjs tests/phase41_5_audit.test.cjs tests/phase40_5_audit.test.cjs
      - name: Firebase emulator owner isolation and recovery
        run: |
          npx firebase-tools emulators:exec --only auth,firestore --project demo-boustio-phase41-5 --config firebase.phase32-4.json "node --test tests/phase41_5_emulator.test.cjs"
      - name: NO_DEPLOYMENT safety gate
        run: |
          test -s web/phase41/README-41-5.md
          echo "PHASE41_5_ISOLATED_AUDIT_NO_LIVE_FEATURES_NO_DEPLOYMENT"
