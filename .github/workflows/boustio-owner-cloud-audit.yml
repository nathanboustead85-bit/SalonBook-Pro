name: Boustio Cloud Audit - Safe Offline Gate
# Live inspection must use Firebase verified-owner authentication.
# The previous workflow accepted an arbitrary UID and a deployment service-account
# credential; it is intentionally disabled to avoid cross-owner data access.
on:
  workflow_dispatch:
jobs:
  audit-safety:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out inspected backend
        uses: actions/checkout@v4
        with:
          ref: milestone-customer-booking-experience
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify read-only inspector and booking integration
        run: |
          node --check functions/index.js
          node --check functions/inspectMigration.js
          npm --prefix functions run test:booking-integration
      - name: Explain live audit gate
        run: |
          echo 'Offline tests passed. Live Firestore audit remains disabled.'
          echo 'Use verified-owner Firebase callable authentication for live inspection.'
          echo 'No Firebase credentials, UIDs, Firestore reads or writes used by this job.'
