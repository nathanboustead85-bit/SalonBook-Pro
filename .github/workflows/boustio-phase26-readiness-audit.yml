name: Boustio Phase 26.1 Read-Only Production Readiness Audit
on:
  workflow_dispatch:
  push:
    branches:
      - milestone-customer-booking-experience
    paths:
      - 'tests/phase26_readiness_audit.test.cjs'
      - 'docs/PHASE26_1_READINESS_AUDIT.md'
      - '.github/workflows/boustio-phase26-readiness-audit.yml'
permissions:
  contents: read
jobs:
  read-only-audit:
    if: github.repository == 'nathanboustead85-bit/SalonBook-Pro'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run source-only readiness assertions
        run: node --test tests/phase26_readiness_audit.test.cjs
      - name: Confirm no production changes
        run: echo 'PHASE26_1=READ_ONLY_NO_DEPLOYMENT_NO_FIRESTORE_WRITES'
