name: Boustio Phase 59.14 crash recovery emulator
on:
  push:
    paths:
      - 'chat/media-recovery.cjs'
      - 'tests/phase5914-recovery/**'
      - 'security/phase59-14-crash-recovery.md'
      - '.github/workflows/boustio-phase-59-14-crash-recovery.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install isolated Firebase dependencies
        working-directory: tests/phase5914-recovery
        run: npm install --no-audit --no-fund
      - name: Test Firestore and Storage emulator recovery
        working-directory: tests/phase5914-recovery
        run: NODE_PATH=./node_modules npx firebase emulators:exec --project demo-boustio-phase5914 --only firestore,storage "node --test recovery.test.cjs" --config firebase.json
