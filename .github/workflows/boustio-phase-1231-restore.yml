name: Boustio Phase 12.31 Isolated Backup Restore
on:
  workflow_dispatch:
jobs:
  restore-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: milestone-customer-booking-experience
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install emulator dependencies
        run: |
          npm install --global firebase-tools@14
          npm install --prefix functions --no-save --ignore-scripts
      - name: Validate isolated restore test
        run: node --check tests/phase1231_firestore_restore.test.js
      - name: Execute emulator backup and restore drill
        env:
          GCLOUD_PROJECT: demo-boustio-phase1231
        run: |
          firebase emulators:exec --only firestore --project demo-boustio-phase1231 \
            "node tests/phase1231_firestore_restore.test.js"
      - name: Re-run readiness gate checks
        run: node tests/phase1230_readiness_gate.test.js
      - name: Re-run backup integrity regression tests
        run: node tests/phase1227_migration_recovery.test.js
