name: Boustio Phase 17.7 OIDC Identity and IAM Principal Comparison
on:
  workflow_dispatch:
    inputs:
      approval:
        description: 'Type VERIFY_IDENTITY_MAPPING for safe GitHub OIDC identity comparison'
        required: true
        type: string
permissions:
  contents: read
  id-token: write
concurrency:
  group: boustio-phase177-identity-check
  cancel-in-progress: false
jobs:
  verify:
    if: ${{ inputs.approval == 'VERIFY_IDENTITY_MAPPING' && github.ref == 'refs/heads/milestone-customer-booking-experience' }}
    runs-on: ubuntu-latest
    environment: boustio-readonly-verification
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: milestone-customer-booking-experience
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate diagnostic and redaction safeguards
        run: |
          node --check scripts/phase177_oidc_identity_check.js
          node tests/phase177_oidc_identity_check.test.js
      - name: Compare GitHub OIDC identity to expected IAM principal without API access
        env:
          BOUSTIO_PHASE177_APPROVED: 'true'
        run: node scripts/phase177_oidc_identity_check.js
