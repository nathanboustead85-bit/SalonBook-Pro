name: Boustio Phase 27.10 Atomic Retention V2 Concurrency Tests
on:
  workflow_dispatch:
  push:
    branches:
      - milestone-customer-booking-experience
    paths:
      - 'functions/chatRetentionV2Atomic.js'
      - 'tests/phase27_10_retention_concurrency.test.cjs'
      - 'docs/PHASE27_10_RETENTION_CONCURRENCY.md'
      - '.github/workflows/boustio-phase27-10-retention-concurrency.yml'
permissions:
  contents: read
jobs:
  retention-v2-concurrency:
    if: github.repository == 'nathanboustead85-bit/SalonBook-Pro'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: 'true'
      GCLOUD_PROJECT: demo-boustio-phase2710
      GOOGLE_CLOUD_PROJECT: demo-boustio-phase2710
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
      FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
      BOUSTIO_CHAT_ENABLED: 'false'
      BOUSTIO_CHAT_ABUSE_BUDGET_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install emulator dependencies
        run: |
          npm install --prefix tests --no-audit --no-fund
          npm install --prefix functions --no-audit --no-fund
      - name: Check syntax and disabled flags
        run: |
          node --check functions/chatRetentionV2Atomic.js
          node --check tests/phase27_10_retention_concurrency.test.cjs
          test "$BOUSTIO_CHAT_ENABLED" = false
          test "$BOUSTIO_CHAT_ABUSE_BUDGET_ENABLED" = false
      - name: Run real Firestore emulator concurrency tests
        run: timeout --signal=TERM --kill-after=10s 900s tests/node_modules/.bin/firebase emulators:exec --project demo-boustio-phase2710 --only auth,firestore "node --test --test-concurrency=1 tests/phase27_10_retention_concurrency.test.cjs"
      - name: Confirm no production deployment
        run: echo 'PHASE27_10=EMULATOR_ONLY_NO_DEPLOYMENT'
