name: Boustio Phase 26.15 Final Messaging Security Release Audit
on:
  workflow_dispatch:
  push:
    branches:
      - milestone-customer-booking-experience
    paths:
      - 'scripts/phase26_15_chat_release_audit.js'
      - 'tests/phase26_15_chat_release_audit.test.cjs'
      - 'docs/PHASE26_15_FINAL_MESSAGING_SECURITY_REVIEW.md'
      - '.github/workflows/boustio-phase26-15-final-chat-audit.yml'
permissions:
  contents: read
jobs:
  messaging-release-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CI: 'true'
      BOUSTIO_CHAT_ENABLED: 'false'
      BOUSTIO_CHAT_ABUSE_BUDGET_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate final audit syntax
        run: |
          node --check scripts/phase26_15_chat_release_audit.js
          node --check tests/phase26_15_chat_release_audit.test.cjs
      - name: Verify security review and release blockers
        run: node --test tests/phase26_15_chat_release_audit.test.cjs
      - name: Print fail-closed release assessment
        run: node -e 'const r=require("./scripts/phase26_15_chat_release_audit").audit(); console.log(JSON.stringify(r,null,2)); if(r.decision!=="NOT_READY_FOR_PUBLIC_LAUNCH")process.exit(1)'
      - name: Verify no production deployment
        run: |
          test "$BOUSTIO_CHAT_ENABLED" = false
          test "$BOUSTIO_CHAT_ABUSE_BUDGET_ENABLED" = false
          echo 'PHASE26_15=AUDIT_ONLY_NO_DEPLOYMENT'
