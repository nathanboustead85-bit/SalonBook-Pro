name: Boustio Phase 72.7.10 customer prototype audit
on:
  workflow_dispatch:
  push:
    branches: [boustio-phase-72-7-10-customer-audit]
jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: boustio-phase-72-7-10-customer-audit
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --no-save --package-lock=false firebase-admin@13 firebase-tools@14
      - run: node --test tests/phase66-8-employee-backend.test.cjs tests/phase72-1-sync-architecture.test.cjs tests/phase72-3-access.test.cjs tests/phase72-4-booking-locks.test.cjs tests/phase72-4-2-transaction.test.cjs tests/phase72-4-3-firestore-adapter.test.cjs tests/phase72-4-6-trusted-validation.test.cjs tests/phase72-4-10-audit.test.cjs tests/phase72-5-1-android-contract.test.cjs tests/phase72-5-2-android-request.test.cjs tests/phase72-5-3-android-queue.test.cjs tests/phase72-5-4-android-recovery.test.cjs tests/phase72-5-5-session.test.cjs tests/phase72-5-6-transport.test.cjs tests/phase72-5-10-audit.test.cjs tests/phase72-6-1-web-contract.test.cjs tests/phase72-6-2-web-session.test.cjs tests/phase72-6-7-conflict-resolution.test.cjs tests/phase72-6-9-reliability.test.cjs tests/phase72-6-10-audit.test.cjs tests/phase72-7-1-customer-contract.test.cjs tests/phase72-7-2-customer-security.test.cjs tests/phase72-7-3-trusted-customer.test.cjs tests/phase72-7-8-confirmation-state.test.cjs tests/phase72-7-9-customer-recovery.test.cjs tests/phase72-7-10-audit.test.cjs
      - run: npx firebase emulators:exec --only firestore --project demo-boustio "node --test tests/phase72-7-7-customer-privacy.test.cjs"
        env:
          GCLOUD_PROJECT: demo-boustio
