name: Boustio Phase 59.18 emulator inbox and notification candidates
on:
  push:
    paths:
      - 'chat/emulator-inbox-events.cjs'
      - 'tests/phase5918-events/**'
      - 'security/phase59-18-emulator-inbox-events.md'
      - '.github/workflows/boustio-phase-59-18-emulator-inbox-events.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  emulator-events:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install isolated Firebase dependencies
        working-directory: tests/phase5918-events
        run: npm install --no-audit --no-fund
      - name: Test actual Firestore emulator inbox and event projections
        working-directory: tests/phase5918-events
        run: npx firebase emulators:exec --project demo-boustio-phase5918 --only firestore "node --test events.test.cjs" --config firebase.json
      - name: Check adapter syntax
        run: node --check chat/emulator-inbox-events.cjs
