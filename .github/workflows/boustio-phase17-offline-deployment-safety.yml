name: Boustio Phase 17 Offline Deployment Safety Regression
on:
  workflow_dispatch:
  push:
    branches:
      - milestone-customer-booking-experience
    paths:
      - 'tests/phase17_readonly_deployment_regression.test.js'
      - 'tests/phase17_release_auth_booking_lock.test.js'
      - 'tests/phase17_customer_preview_safety.test.js'
      - 'tests/phase17_website_recovery.test.js'
      - 'tests/phase17_customer_data_protection.test.js'
      - 'tests/phase17_business_account_readiness.test.js'
      - 'tests/phase17_booking_conflict_readiness.test.js'
      - 'tests/phase17_final_release_audit.test.js'
      - 'docs/PHASE17_RELEASE_READINESS.md'
      - 'functions/bookingEngine.js'
      - 'functions/trustedBooking.js'
      - 'website/index.html'
      - 'website/book/customer-chat.js'
      - 'website/book/index.html'
      - 'firestore.rules'
      - 'functions/index.js'
      - '.firebaserc'
      - 'firebase.json'
      - 'scripts/boustio_deploy_permissions.js'
      - 'scripts/phase1728_deployment_permissions.js'
      - '.github/workflows/boustio-deploy-permissions-readonly.yml'
      - '.github/workflows/boustio-phase-1728-deployment-permissions.yml'
      - '.github/workflows/production-deployment.yml'
      - '.github/workflows/deploy-website.yml'
      - '.github/workflows/boustio-phase17-offline-deployment-safety.yml'
permissions:
  contents: read
concurrency:
  group: boustio-phase17-offline-safety-${{ github.ref }}
  cancel-in-progress: false
jobs:
  offline-regression:
    if: github.repository == 'nathanboustead85-bit/SalonBook-Pro'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax-check read-only probes and regression test
        run: |
          node --check scripts/boustio_deploy_permissions.js
          node --check scripts/phase1728_deployment_permissions.js
          node --check tests/phase17_readonly_deployment_regression.test.js
          node --check tests/phase17_release_auth_booking_lock.test.js
          node --check tests/phase17_customer_preview_safety.test.js
          node --check tests/phase17_website_recovery.test.js
          node --check tests/phase17_customer_data_protection.test.js
          node --check tests/phase17_business_account_readiness.test.js
          node --check tests/phase17_booking_conflict_readiness.test.js
          node --check tests/phase17_final_release_audit.test.js
      - name: Run offline deployment safety regression
        run: node tests/phase17_readonly_deployment_regression.test.js
      - name: Run offline authentication, configuration and booking lock tests
        run: node --test tests/phase17_release_auth_booking_lock.test.js
      - name: Verify customer preview cannot submit bookings
        run: node --test tests/phase17_customer_preview_safety.test.js
      - name: Verify website failure handling and safe retry
        run: node --test tests/phase17_website_recovery.test.js
      - name: Verify customer data access and messaging safeguards
        run: node --test tests/phase17_customer_data_protection.test.js
      - name: Verify business account and owner access safeguards
        run: node --test tests/phase17_business_account_readiness.test.js
      - name: Verify booking conflicts and transaction safety offline
        run: node --test tests/phase17_booking_conflict_readiness.test.js
      - name: Final Phase 17 release-readiness safety audit (offline)
        run: node --test tests/phase17_final_release_audit.test.js
