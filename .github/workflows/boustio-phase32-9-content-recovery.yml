name: Boustio Phase 32.9 Offline Business Data Corruption Recovery Tests
on:
  workflow_dispatch:
  push:
    branches: [milestone-customer-booking-experience]
    paths:
      - 'web/phase32/content-validation-32-9.js'
      - 'tests/phase32_9_content_recovery.test.cjs'
      - 'web/phase32/README-32-9.md'
      - '.github/workflows/boustio-phase32-9-content-recovery.yml'
permissions:
  contents: read
jobs:
  content-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Phase 32.9 malformed content and recovery tests
        run: node --test tests/phase32_9_content_recovery.test.cjs
      - name: Phase 32 staging safety regressions
        run: node --test tests/phase32_1_staging_preparation.test.cjs tests/phase32_2_emulator_validation.test.cjs
      - name: Phase 31 regression
        run: node --test tests/phase31_*.test.cjs
      - name: Phase 30 regression
        run: node --test tests/phase30*.test.cjs
      - name: Phase 29 regression
        run: node --test tests/phase29*.test.cjs
      - name: No deployment verification
        run: |
          test -s firestore.rules
          echo "PHASE32_9_OFFLINE_ONLY_NO_DEPLOYMENT"
