name: Boustio Phase 42.5 Final Isolated Security Audit
on:
  workflow_dispatch:
  push:
    branches: [milestone-customer-booking-experience]
    paths:
      - 'web/phase42/**'
      - 'tests/phase42_5_*'
      - '.github/workflows/boustio-phase42-5-final-audit.yml'
permissions:
  contents: read
jobs:
  isolated-final-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GCLOUD_PROJECT: demo-boustio-phase42-4
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:18080
      FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:19099
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install isolated dependencies
        run: npm install --no-save --no-package-lock firebase@11 firebase-admin@13 @firebase/rules-unit-testing@4 firebase-tools@14
      - name: Final audit and all Phase 42 Node regressions
        run: node --test tests/phase42_5_audit.test.cjs tests/phase42_4_recovery.test.cjs tests/phase42_3_races.test.cjs tests/phase42_2_session.test.cjs tests/phase42_1_integration.test.cjs
      - name: Firebase emulator access and recovery verification
        run: npx firebase-tools emulators:exec --only auth,firestore --project demo-boustio-phase42-4 --config firebase.phase32-4.json "node --test tests/phase42_4_emulator.test.cjs"
      - name: NO_DEPLOYMENT safety gate
        run: |
          test -s web/phase42/README-42-5.md
          echo "PHASE42_5_ISOLATED_ONLY_NO_DEPLOYMENT"
