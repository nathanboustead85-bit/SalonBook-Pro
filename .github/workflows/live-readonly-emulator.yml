name: Boustio Live Read-Only Emulator Verification
on:
  push:
    branches:
      - phase-9d4-teal-clients
    paths:
      - 'functions/liveReadinessReport.js'
      - 'functions/legacyProductionReadinessReview.js'
      - 'functions/liveReadinessReport.integration.test.js'
      - '.github/workflows/live-readonly-emulator.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  read-only-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GCLOUD_PROJECT: demo-boustio-live-readonly
      GOOGLE_CLOUD_PROJECT: demo-boustio-live-readonly
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install function dependencies
        working-directory: functions
        run: npm install --no-audit --no-fund
      - name: Test real Firestore read-only verification in isolated emulator
        run: npx --yes firebase-tools@latest emulators:exec --project demo-boustio-live-readonly --only firestore "node --test functions/liveReadinessReport.integration.test.js"
