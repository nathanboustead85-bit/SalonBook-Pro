name: Boustio Phase 40.2 Isolated Browser Dashboard
on:
  workflow_dispatch:
  push:
    branches: [milestone-customer-booking-experience]
    paths:
      - 'web/phase40/**'
      - 'tests/phase40_2_*'
      - '.github/workflows/boustio-phase40-2-isolated-browser.yml'
permissions:
  contents: read
jobs:
  isolated-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GCLOUD_PROJECT: demo-boustio-phase39-5
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:18080
      FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:19099
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install isolated dependencies
        run: npm install --no-save --no-package-lock firebase@11 firebase-admin@13 @firebase/rules-unit-testing@4 firebase-tools@14 @playwright/test@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Phase 40.2 browser and source negative tests
        run: node --test tests/phase40_2_unit.test.cjs tests/phase40_1_negative.test.cjs
      - name: Phase 40.2 Playwright browser lifecycle
        run: npx playwright test tests/phase40_2_browser.spec.cjs --browser chromium --workers 1
      - name: Firebase emulator integration regression
        run: npx firebase-tools emulators:exec --only auth,firestore --project demo-boustio-phase39-5 --config firebase.phase32-4.json "node --test tests/phase39_5_emulator.test.cjs"
      - name: NO_DEPLOYMENT safety gate
        run: |
          test -s web/phase40/README-40-2.md
          test -s firestore.rules
          echo "PHASE40_2_SYNTHETIC_BROWSER_NO_LIVE_FEATURES_NO_DEPLOYMENT"
