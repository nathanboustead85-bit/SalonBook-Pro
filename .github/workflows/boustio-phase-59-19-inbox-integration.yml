name: Boustio Phase 59.19 emulator conversation integration
on:
  push:
    paths:
      - 'chat/emulator-conversation-session.cjs'
      - 'tests/phase5919-session/**'
      - 'security/phase59-19-inbox-integration-contract.md'
      - '.github/workflows/boustio-phase-59-19-inbox-integration.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install isolated Firebase dependencies
        working-directory: tests/phase5919-session
        run: npm install --no-audit --no-fund
      - name: Test actual Firestore emulator conversation integration
        working-directory: tests/phase5919-session
        run: npx firebase emulators:exec --project demo-boustio-phase5919 --only firestore "node --test session.test.cjs" --config firebase.json
      - name: Check session adapter syntax
        run: node --check chat/emulator-conversation-session.cjs
