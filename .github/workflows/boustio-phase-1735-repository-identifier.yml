name: Boustio Phase 17.35 OIDC Repository Identifier Diagnostic
on:
  workflow_dispatch:
    inputs:
      approval:
        description: 'Type CLASSIFY_REPOSITORY_ID (safe identity classification only)'
        required: true
        type: string
permissions:
  contents: read
  id-token: write
concurrency:
  group: boustio-phase1735-repository-identifier
  cancel-in-progress: false
jobs:
  diagnose:
    if: ${{ inputs.approval == 'CLASSIFY_REPOSITORY_ID' && github.ref == 'refs/heads/milestone-customer-booking-experience' && github.repository == 'nathanboustead85-bit/SalonBook-Pro' }}
    runs-on: ubuntu-latest
    environment: boustio-function-deployment
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: milestone-customer-booking-experience
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test repository identifier classifier and guards
        run: |
          node --check scripts/phase1735_repository_identifier.js
          node tests/phase1735_repository_identifier.test.js
      - name: Classify OIDC repository identifier without disclosing subject
        env:
          BOUSTIO_PHASE1735_APPROVAL: ${{ inputs.approval }}
        run: node scripts/phase1735_repository_identifier.js
