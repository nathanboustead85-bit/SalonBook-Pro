name: Boustio Phase 49.6 Staging Verification Readiness
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'security/phase496-*'
      - 'tests/phase496_*'
      - 'docs/security/phase-49-6-staging-verification-plan.md'
      - '.github/workflows/boustio-phase-496-staging-readiness.yml'
permissions:
  contents: read
jobs:
  staging-readiness-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify staging readiness fails closed
        run: node --test tests/phase496_staging_readiness.test.cjs
      - name: Verify Phase 49.5 evidence integrity regressions
        run: node --test tests/phase495_evidence_integrity.test.cjs
      - name: Verify Phase 49.4 approval gates
        run: node --test tests/phase494_approval_gates.test.cjs
      - name: Check no production credentials
        run: |
          test -z "${GOOGLE_APPLICATION_CREDENTIALS:-}"
          test -z "${FIREBASE_TOKEN:-}"
          echo 'Preparation only; seven blockers OPEN; no staging execution or deployment'
