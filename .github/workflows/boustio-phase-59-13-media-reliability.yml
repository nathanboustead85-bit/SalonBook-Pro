name: Boustio Phase 59.13 media reliability emulator
on:
  push:
    paths:
      - 'chat/reliable-media-emulator.cjs'
      - 'chat/reliable-media-store.cjs'
      - 'tests/phase5913-reliability/**'
      - 'security/phase59-13-media-reliability.md'
      - '.github/workflows/boustio-phase-59-13-media-reliability.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  media-reliability:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install isolated dependencies
        working-directory: tests/phase5913-reliability
        run: npm install --no-audit --no-fund
      - name: Install FFmpeg and FFprobe
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Run real Firebase emulator reliability tests
        working-directory: tests/phase5913-reliability
        run: NODE_PATH=./node_modules npx firebase emulators:exec --project demo-boustio-phase5913 --only firestore,storage "node --test reliability.test.cjs" --config firebase.json
