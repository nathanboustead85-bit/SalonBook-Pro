name: Boustio Phase 40.5 Final Isolated Dashboard Audit
on:
  workflow_dispatch:
  push:
    branches: [milestone-customer-booking-experience]
    paths:
      - 'web/phase40/**'
      - 'tests/phase40_5_*'
      - '.github/workflows/boustio-phase40-5-final-audit.yml'
permissions:
  contents: read
jobs:
  isolated-final-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      GCLOUD_PROJECT: demo-boustio-phase40-4
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:18080
      FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:19099
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install isolated dependencies
        run: npm install --no-save --no-package-lock firebase@11 firebase-admin@13 @firebase/rules-unit-testing@4 firebase-tools@14 @playwright/test@1.56.1
      - name: Install isolated Chromium
        run: npx playwright install --with-deps chromium
      - name: Source audit and Phase 40 negative regression
        run: node --test tests/phase40_5_audit.test.cjs tests/phase40_4_security.test.cjs tests/phase40_3_contract.test.cjs tests/phase40_2_unit.test.cjs tests/phase40_1_negative.test.cjs
      - name: Browser lifecycle regression
        run: npx playwright test tests/phase40_2_browser.spec.cjs --browser chromium --workers 1
      - name: Firebase emulator security regression
        run: npx firebase-tools emulators:exec --only auth,firestore --project demo-boustio-phase40-4 --config firebase.phase32-4.json "node --test tests/phase40_4_emulator.test.cjs"
      - name: NO_DEPLOYMENT audit gate
        run: |
          test -s web/phase40/README-40-5.md
          test -s firestore.rules
          echo "PHASE40_5_AUDIT_ONLY_NOT_LAUNCH_APPROVED_NO_DEPLOYMENT"
