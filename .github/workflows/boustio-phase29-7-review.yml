name: Boustio Phase 29.7 Offline Premium Review QA
on:
  workflow_dispatch:
  push:
    branches: [milestone-customer-booking-experience]
    paths:
      - 'web/phase29/onboarding-29-7.html'
      - 'tests/phase29_7_premium_review.test.cjs'
      - '.github/workflows/boustio-phase29-7-review.yml'
permissions:
  contents: read
jobs:
  isolated-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Phase 29.7 preview and safety tests
        run: node --test tests/phase29_7_premium_review.test.cjs
      - name: Existing Phase 29 regression tests
        run: node --test tests/phase29*.test.cjs
      - name: Confirm standalone offline preview
        run: |
          test -s web/phase29/onboarding-29-7.html
          echo "OFFLINE_ONLY_NO_DEPLOYMENT_NO_LIVE_FEATURES"
      - uses: actions/upload-artifact@v4
        with:
          name: Boustio-Phase29-7-Samsung-Single-HTML
          path: web/phase29/onboarding-29-7.html
          retention-days: 14
