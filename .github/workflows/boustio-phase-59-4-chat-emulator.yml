name: Boustio Phase 59.4 real Firestore chat emulator authorization tests
on:
  push:
    paths:
      - 'tests/phase594-chat-emulator/**'
      - 'security/phase59-4-chat-emulator.md'
      - '.github/workflows/boustio-phase-59-4-chat-emulator.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  firestore-chat-authorization:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install isolated emulator test dependencies
        working-directory: tests/phase594-chat-emulator
        run: npm install --no-audit --no-fund
      - name: Run real Firestore emulator authorization tests (synthetic only)
        working-directory: tests/phase594-chat-emulator
        run: npx firebase emulators:exec --project demo-boustio-phase594 --only firestore "node --test chat-rules.test.cjs" --config ../../firebase.json
