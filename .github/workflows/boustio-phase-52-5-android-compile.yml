name: Boustio Phase 52.5 Android compile and backup safety
on:
  push:
    paths:
      - 'app/src/main/**'
      - 'app/build.gradle.kts'
      - 'tests/phase525_android_build_safety.test.cjs'
      - '.github/workflows/boustio-phase-52-5-android-compile.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify source-level backup and release safeguards
        run: node --test tests/phase525_android_build_safety.test.cjs tests/phase524_android_restore_safety.test.cjs
      - name: Compile Android release Kotlin (no install or deployment)
        run: gradle --no-daemon :app:compileReleaseKotlin
      - name: Confirm no installation or deployment
        run: echo 'Compilation only. No APK published, no Firebase operations, no Android device touched.'
