name: Boustio Phase 31.9 Offline Booking Lifecycle Safety
on:
  workflow_dispatch:
  push:
    branches: [milestone-customer-booking-experience]
    paths:
      - 'web/phase31/offline-lifecycle-31-9.js'
      - 'tests/phase31_9_offline_lifecycle.test.cjs'
      - '.github/workflows/boustio-phase31-9-offline-lifecycle.yml'
permissions:
  contents: read
jobs:
  offline-lifecycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Phase 31.9 cancellation, rescheduling and recovery tests
        run: node --test tests/phase31_9_offline_lifecycle.test.cjs
      - name: Phase 31 regression
        run: node --test tests/phase31_*.test.cjs
      - name: Existing availability compatibility
        run: |
          node tests/phase1238_availability_preview.test.js
          node tests/phase1239_catalogue_adapter.test.js
          node tests/phase1280_catalogue_contract.test.js
          node tests/phase1240_public_availability_projection.test.js
      - name: Phase 30 regression
        run: node --test tests/phase30*.test.cjs
      - name: Phase 29 regression
        run: node --test tests/phase29*.test.cjs
      - name: Offline-only guard
        run: |
          test -s web/phase31/offline-lifecycle-31-9.js
          echo "SIMULATION_ONLY_NO_FIREBASE_NO_LIVE_BOOKINGS_NO_PAYMENTS_NO_MESSAGING_NO_DEPLOYMENT"
