name: Boustio Phase 40.3 Isolated Hours and Revision Contract
on:
  workflow_dispatch:
  push:
    branches: [milestone-customer-booking-experience]
    paths:
      - 'web/phase40/**'
      - 'tests/phase40_3_*'
      - '.github/workflows/boustio-phase40-3-hours-revision.yml'
permissions:
  contents: read
jobs:
  isolated-hours-revision:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GCLOUD_PROJECT: demo-boustio-phase40-3
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:18080
      FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:19099
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install emulator-only test dependencies
        run: npm install --no-save --no-package-lock firebase@11 firebase-admin@13 @firebase/rules-unit-testing@4 firebase-tools@14
      - name: Strict business hours and revision unit regression
        run: node --test tests/phase40_3_contract.test.cjs tests/phase40_1_negative.test.cjs tests/phase40_2_unit.test.cjs
      - name: Firebase emulator cross-owner and revision regression
        run: npx firebase-tools emulators:exec --only auth,firestore --project demo-boustio-phase40-3 --config firebase.phase32-4.json "node --test tests/phase40_3_emulator.test.cjs"
      - name: NO_DEPLOYMENT safety gate
        run: |
          test -s web/phase40/README-40-3.md
          test -s firestore.rules
          echo "PHASE40_3_CONTRACT_ONLY_NO_MIGRATION_NO_LIVE_FEATURES_NO_DEPLOYMENT"
