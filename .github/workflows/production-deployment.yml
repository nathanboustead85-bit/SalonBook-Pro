name: Boustio Production Deployment Gate

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type PREPARE-BOUSTIO to confirm'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: boustio-production-deployment
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Production Deployment
    if: >-
      github.ref == 'refs/heads/phase-7c-live-booking' &&
      inputs.confirmation == 'PREPARE-BOUSTIO'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify deployment configuration
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("node:fs");

          const rc = JSON.parse(
            fs.readFileSync(".firebaserc", "utf8")
          );

          const config = JSON.parse(
            fs.readFileSync("firebase.json", "utf8")
          );

          if (
            rc.projects.production !== "salonbook-pro-ad5ff" ||
            rc.projects.emulator !== "demo-boustio-migration" ||
            config.functions.source !== "functions" ||
            config.functions.codebase !== "default"
          ) {
            throw new Error(
              "Production deployment configuration mismatch"
            );
          }

          console.log("Firebase configuration verified.");
          NODE

      - name: Run production safeguards
        run: |
          node --test \
            functions/productionDeploymentGuard.test.js

  approval-gate:
    name: Production Environment Authentication Test
    needs: validate
    if: >-
      github.ref == 'refs/heads/phase-7c-live-booking' &&
      inputs.confirmation == 'PREPARE-BOUSTIO'
    runs-on: ubuntu-latest

    environment:
      name: production

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/107806967630/locations/global/workloadIdentityPools/boustio-github/providers/github'
          service_account: 'boustio-github-deploy@salonbook-pro-ad5ff.iam.gserviceaccount.com'
          token_format: access_token
          create_credentials_file: false
          export_environment_variables: false

      - name: Verify authentication
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        shell: bash
        run: |
          if [ -z "$GOOGLE_ACCESS_TOKEN" ]; then
            echo "::error::Google Cloud authentication failed."
            exit 1
          fi

          echo "Google Cloud authentication succeeded."
          echo "A short-lived access token was issued."
          echo "No Firebase deployment was performed."

      - name: Confirm deployment remains disabled
        run: |
          echo "Boustio production authentication test passed."
          echo "No Firebase deployment commands executed."
          echo "No customer bookings were modified."
