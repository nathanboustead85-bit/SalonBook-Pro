name: Boustio Production Deployment Gate

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type PREPARE-BOUSTIO to confirm'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: boustio-production-deployment
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Production Deployment
    if: >-
      github.ref == 'refs/heads/production-release' &&
      inputs.confirmation == 'PREPARE-BOUSTIO'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify deployment configuration
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("node:fs");

          const rc = JSON.parse(
            fs.readFileSync(".firebaserc", "utf8")
          );

          const config = JSON.parse(
            fs.readFileSync("firebase.json", "utf8")
          );

          if (
            rc.projects.production !== "salonbook-pro-ad5ff" ||
            rc.projects.emulator !== "demo-boustio-migration" ||
            config.functions.source !== "functions" ||
            config.functions.codebase !== "default" ||
            config.functions.runtime !== "nodejs22"
          ) {
            throw new Error(
              "Production deployment configuration mismatch"
            );
          }

          console.log("Firebase configuration verified.");
          NODE

      - name: Verify approved production exports
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("node:fs");

          const source = fs.readFileSync(
            "functions/index.js",
            "utf8"
          );

          const exportsFound = [
            ...source.matchAll(
              /exports\.([A-Za-z_$][\w$]*)\s*=/g
            )
          ].map(match => match[1]);

          const approved = [
            "publishBusiness",
            "unpublishBusiness"
          ];

          if (
            exportsFound.length !== approved.length ||
            exportsFound.some(name => !approved.includes(name))
          ) {
            throw new Error(
              "Unexpected production function exports: " +
              exportsFound.join(", ")
            );
          }

          console.log(
            "Only approved production functions are exported."
          );
          NODE

      - name: Run production safeguards
        run: |
          node --test \
            functions/productionDeploymentGuard.test.js

  approval-gate:
    name: Production Permission Verification
    needs: validate
    if: >-
      github.ref == 'refs/heads/production-release' &&
      inputs.confirmation == 'PREPARE-BOUSTIO'
    runs-on: ubuntu-latest

    environment:
      name: production

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/107806967630/locations/global/workloadIdentityPools/boustio-github/providers/github'
          service_account: 'boustio-github-deploy@salonbook-pro-ad5ff.iam.gserviceaccount.com'
          token_format: access_token
          create_credentials_file: false
          export_environment_variables: false

      - name: Verify authentication
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        shell: bash
        run: |
          if [ -z "$GOOGLE_ACCESS_TOKEN" ]; then
            echo "::error::Authentication failed."
            exit 1
          fi

          echo "Keyless Google Cloud authentication passed."

      - name: Check deployment permissions
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        shell: bash
        run: |
          set -euo pipefail

          cat > permission-request.json <<'JSON'
          {
            "permissions": [
              "cloudfunctions.functions.create",
              "cloudfunctions.functions.update",
              "run.services.create",
              "run.services.update",
              "cloudbuild.builds.create"
            ]
          }
          JSON

          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GOOGLE_ACCESS_TOKEN}" \
            --header "Content-Type: application/json" \
            --data @permission-request.json \
            "https://cloudresourcemanager.googleapis.com/v1/projects/salonbook-pro-ad5ff:testIamPermissions" \
            --output permission-response.json

          node <<'NODE'
          const fs = require("node:fs");

          const response = JSON.parse(
            fs.readFileSync(
              "permission-response.json",
              "utf8"
            )
          );

          const expected = [
            "cloudfunctions.functions.create",
            "cloudfunctions.functions.update",
            "run.services.create",
            "run.services.update",
            "cloudbuild.builds.create"
          ];

          const granted = new Set(
            response.permissions || []
          );

          for (const permission of expected) {
            if (!granted.has(permission)) {
              throw new Error(
                "Permission not confirmed: " + permission
              );
            }

            console.log("PASS: " + permission);
          }

          console.log(
            "All requested project permission checks passed."
          );
          NODE

      - name: Confirm production deployment remains disabled
        shell: bash
        run: |
          echo "Boustio production verification passed."
          echo "No Firebase deployment commands executed."
          echo "No production resources modified."
          echo "Customer bookings remain disabled."
