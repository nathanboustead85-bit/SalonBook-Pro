name: Boustio Phase 55.2 JSON and identity validation
on:
  push:
    paths:
      - 'app/build.gradle.kts'
      - 'app/src/main/java/com/salonbook/pro/AndroidStorageSnapshotAdapter.kt'
      - 'app/src/test/java/com/salonbook/pro/AndroidStorageSnapshotAdapterTest.kt'
      - 'app/src/test/java/com/salonbook/pro/AndroidStorageSnapshotAdapterValidationTest.kt'
      - 'tests/phase552_json_identity_isolation.test.cjs'
      - '.github/workflows/boustio-phase-55-2-json-identity.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  json-identity-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile and run isolated adapter JSON tests
        run: gradle --no-daemon :app:testReleaseUnitTest --tests com.salonbook.pro.AndroidStorageSnapshotAdapterTest --tests com.salonbook.pro.AndroidStorageSnapshotAdapterValidationTest
      - name: Verify isolation and open security gates
        run: node --test tests/phase552_json_identity_isolation.test.cjs
