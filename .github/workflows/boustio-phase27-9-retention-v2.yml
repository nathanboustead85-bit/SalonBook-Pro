name: Boustio Phase 27.9 Firestore Retention V2 Emulator Tests
on:
  workflow_dispatch:
  push:
    branches:
      - milestone-customer-booking-experience
    paths:
      - 'functions/chatRetentionV2.js'
      - 'tests/phase27_9_retention_v2_emulator.test.cjs'
      - 'docs/PHASE27_9_RETENTION_V2.md'
      - '.github/workflows/boustio-phase27-9-retention-v2.yml'
permissions:
  contents: read
jobs:
  retention-v2-emulator:
    if: github.repository == 'nathanboustead85-bit/SalonBook-Pro'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: 'true'
      GCLOUD_PROJECT: demo-boustio-phase279
      GOOGLE_CLOUD_PROJECT: demo-boustio-phase279
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
      FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
      BOUSTIO_CHAT_ENABLED: 'false'
      BOUSTIO_CHAT_ABUSE_BUDGET_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install emulator dependencies
        run: |
          npm install --prefix tests --no-audit --no-fund
          npm install --prefix functions --no-audit --no-fund
      - name: Validate isolated test syntax
        run: |
          node --check functions/chatRetentionV2.js
          node --check tests/phase27_9_retention_v2_emulator.test.cjs
          test "$BOUSTIO_CHAT_ENABLED" = false
      - name: Test timestamp-based retention schema in real emulator
        run: timeout --signal=TERM --kill-after=10s 900s tests/node_modules/.bin/firebase emulators:exec --project demo-boustio-phase279 --only auth,firestore "node --test --test-concurrency=1 tests/phase27_9_retention_v2_emulator.test.cjs"
      - name: Confirm no deployment
        run: echo 'PHASE27_9=EMULATOR_ONLY_NO_DEPLOYMENT'
