name: Boustio Phase 33.1 Secure Read-Only Dashboard Adapter
on:
  workflow_dispatch:
  push:
    branches: [milestone-customer-booking-experience]
    paths:
      - 'web/phase33/**'
      - 'tests/phase33_1_dashboard_adapter.test.cjs'
      - '.github/workflows/boustio-phase33-1-read-only-dashboard.yml'
permissions:
  contents: read
jobs:
  dashboard-adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Phase 33.1 dashboard adapter security and loading tests
        run: node --test tests/phase33_1_dashboard_adapter.test.cjs
      - name: Phase 32.9 data integrity and recovery regression
        run: node --test tests/phase32_9_content_recovery.test.cjs
      - name: Phase 32 staging safety regression
        run: node --test tests/phase32_1_staging_preparation.test.cjs tests/phase32_2_emulator_validation.test.cjs tests/phase32_10_final_audit.test.cjs
      - name: Phase 31 regression
        run: node --test tests/phase31_*.test.cjs
      - name: Phase 30 regression
        run: node --test tests/phase30*.test.cjs
      - name: Phase 29 regression
        run: node --test tests/phase29*.test.cjs
      - name: No deployment verification
        run: |
          test -s firestore.rules
          echo "PHASE33_1_READ_ONLY_NO_DEPLOYMENT"
