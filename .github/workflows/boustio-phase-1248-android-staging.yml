name: Boustio Phase 12.48 Android-to-Staging Integration
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  staging-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: milestone-customer-booking-experience
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install isolated Firebase emulator dependencies
        run: |
          npm install --global firebase-tools@14
          npm install --prefix functions --no-save --ignore-scripts @firebase/rules-unit-testing@4
      - name: Verify staging bridge syntax
        run: |
          node --check functions/phase1248StagingBridge.js
          node --check tests/phase1248_staging_bridge.test.js
      - name: Test Android to staging through Firestore emulator
        env:
          GCLOUD_PROJECT: demo-boustio-phase1245
        run: |
          firebase emulators:exec --config tests/phase1245.firebase.json --only firestore --project demo-boustio-phase1245 \
            "node tests/phase1248_staging_bridge.test.js"
      - name: Verify existing Android compatibility
        run: node tests/phase1244_android_schema_adapter.test.js
      - name: Verify mobile website safety
        run: node tests/phase1247_staging_demo.test.js
      - name: Verify production release remains gated
        run: node tests/phase1230_readiness_gate.test.js
