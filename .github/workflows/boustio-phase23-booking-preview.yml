name: Boustio Phase 23.1 Premium Customer Booking Preview Browser Tests
on:
  workflow_dispatch:
  push:
    branches:
      - milestone-customer-booking-experience
    paths:
      - 'tests/fixtures/phase23_booking_preview.html'
      - 'tests/phase23_booking_entry.mjs'
      - 'tests/phase23_booking_browser.test.cjs'
      - 'website/customer/booking/preview-foundation.mjs'
      - 'docs/PHASE23_1_BOOKING_FOUNDATION.md'
      - 'firestore.rules'
      - '.github/workflows/boustio-phase23-booking-preview.yml'
permissions:
  contents: read
jobs:
  isolated-real-browser-dashboard:
    if: github.repository == 'nathanboustead85-bit/SalonBook-Pro'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: 'true'
      GCLOUD_PROJECT: demo-boustio-phase21
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install isolated Firebase and Chromium test dependencies
        working-directory: tests
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund playwright@1.56.1 esbuild@0.25.12
          npx playwright install --with-deps chromium
      - name: Check booking preview syntax
        run: |
          node --check tests/phase23_booking_entry.mjs
          node --check tests/phase23_booking_browser.test.cjs
          node --check website/customer/booking/preview-foundation.mjs
      - name: Run real Chromium booking preview against isolated Firebase emulators
        run: timeout --signal=TERM --kill-after=10s 420s tests/node_modules/.bin/firebase emulators:exec --project demo-boustio-phase21 --only auth,firestore "node --test tests/phase23_booking_browser.test.cjs"
