name: Boustio Phase 27.6 Firestore Retention Deletion Safety Tests
on:
  workflow_dispatch:
  push:
    branches:
      - milestone-customer-booking-experience
    paths:
      - 'functions/chatStagingRetentionDeletion.js'
      - 'tests/phase27_6_retention_emulator.test.cjs'
      - 'docs/PHASE27_6_FIRESTORE_RETENTION_EMULATOR.md'
      - '.github/workflows/boustio-phase27-6-retention-emulator.yml'
permissions:
  contents: read
jobs:
  retention-emulator:
    if: github.repository == 'nathanboustead85-bit/SalonBook-Pro'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: 'true'
      GCLOUD_PROJECT: demo-boustio-phase276
      GOOGLE_CLOUD_PROJECT: demo-boustio-phase276
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
      FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
      BOUSTIO_CHAT_ENABLED: 'false'
      BOUSTIO_CHAT_ABUSE_BUDGET_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install isolated emulator dependencies
        run: |
          npm install --prefix tests --no-audit --no-fund
          npm install --prefix functions --no-audit --no-fund
      - name: Check isolation and syntax
        run: |
          node --check functions/chatStagingRetentionDeletion.js
          node --check tests/phase27_6_retention_emulator.test.cjs
          test "$GCLOUD_PROJECT" = demo-boustio-phase276
          test "$BOUSTIO_CHAT_ENABLED" = false
      - name: Run real Firestore emulator retention safety tests
        run: timeout --signal=TERM --kill-after=10s 900s tests/node_modules/.bin/firebase emulators:exec --project demo-boustio-phase276 --only auth,firestore "node --test --test-concurrency=1 tests/phase27_6_retention_emulator.test.cjs"
      - name: Confirm no production deployment
        run: echo 'PHASE27_6=EMULATOR_ONLY_NO_DEPLOYMENT'
