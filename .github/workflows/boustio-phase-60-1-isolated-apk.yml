name: Boustio Phase 60.1 isolated Samsung test APK
on:
  push:
    paths:
      - 'app/build.gradle.kts'
      - 'app/src/isolated/**'
      - 'tests/phase60-1-isolated-apk.test.cjs'
      - 'security/phase60-1-isolated-android-apk.md'
      - '.github/workflows/boustio-phase-60-1-isolated-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check package isolation and safety gates
        run: node --test tests/phase60-1-isolated-apk.test.cjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build isolated debug APK only
        run: gradle --no-daemon :app:assembleIsolatedDebug
      - name: Verify APK package and permissions
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/isolated/debug/app-isolated-debug.apk"
          test -s "$APK"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          "$AAPT" dump badging "$APK" > /tmp/boustio-apk-badging.txt
          cat /tmp/boustio-apk-badging.txt | grep '^package:'
          grep -q "name='com.salonbook.pro.isolated'" /tmp/boustio-apk-badging.txt
          ! grep -q "uses-permission: name='android.permission.INTERNET'" /tmp/boustio-apk-badging.txt
          ! grep -q "uses-permission: name='android.permission.ACCESS_NETWORK_STATE'" /tmp/boustio-apk-badging.txt
          sha256sum "$APK" > /tmp/boustio-apk-sha256.txt
          cat /tmp/boustio-apk-sha256.txt
      - name: Upload disposable Samsung test APK
        uses: actions/upload-artifact@v4
        with:
          name: Boustio-Phase60-1-ISOLATED-TEST-APK
          path: app/build/outputs/apk/isolated/debug/app-isolated-debug.apk
          if-no-files-found: error
