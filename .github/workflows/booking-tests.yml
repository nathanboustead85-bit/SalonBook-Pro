name: Boustio Booking Engine Tests

on:
  push:
    branches:
      - phase-7c-live-booking
    paths:
      - 'functions/**'
      - 'firestore.rules'
      - 'firestore.cutover.test.rules'
      - 'firebase.json'
      - 'firebase.http-emulator.json'
      - '.github/workflows/booking-tests.yml'

  pull_request:
    branches:
      - production-release

  workflow_dispatch:

permissions:
  contents: read

jobs:
  booking-tests:
    name: Run Booking Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install backend dependencies
        working-directory: functions
        run: npm install --no-audit --no-fund

      - name: Install isolated HTTP emulator dependencies
        working-directory: functions/http-emulator
        run: npm install --no-audit --no-fund

      - name: Install cutover test dependencies
        working-directory: functions
        run: |
          npm install --no-save --no-audit --no-fund \
            firebase@12 \
            @firebase/rules-unit-testing@5

      - name: Check JavaScript syntax
        working-directory: functions
        run: |
          for file in *.js; do
            node --check "$file"
          done
          node --check http-emulator/index.js

      - name: Run production deployment safety checks
        working-directory: functions
        run: |
          node --test productionDeploymentGuard.test.js

      - name: Run unit tests
        working-directory: functions
        run: |
          node --test \
            bookingMode.test.js \
            freezeBookingMode.test.js \
            finalBookingSyncVerifier.test.js \
            migrationFinalSyncGuard.test.js \
            bookingEngine.test.js \
            trustedCatalogue.test.js \
            trustedBooking.test.js \
            androidBookingAdapter.test.js \
            bookingMigrationPlan.test.js \
            bookingMigrationValidator.test.js \
            firestoreMigrationPreview.test.js \
            authenticatedMigrationPreview.test.js \
            migrationPreviewCallable.test.js \
            migrationPreviewRequestSecurity.test.js \
            transactionalBookingMigration.test.js

      - name: Run Firestore Emulator integration tests
        env:
          GCLOUD_PROJECT: demo-boustio-migration
          GOOGLE_CLOUD_PROJECT: demo-boustio-migration
        run: |
          npx --yes firebase-tools@14.25.1 \
            emulators:exec \
            --project demo-boustio-migration \
            --only firestore \
            "cd functions && node --test firestoreMigrationEmulator.test.js authenticatedCallableEmulator.test.js transactionalBookingMigration.integration.test.js verifiedBookingMigration.integration.test.js"

      - name: Run isolated booking freeze integration tests
        env:
          GCLOUD_PROJECT: demo-boustio-migration
          GOOGLE_CLOUD_PROJECT: demo-boustio-migration
        run: |
          npx --yes firebase-tools@14.25.1 \
            emulators:exec \
            --project demo-boustio-migration \
            --only firestore \
            "cd functions && node --test freezeBookingMode.integration.test.js"

      - name: Run delayed booking upload integration tests
        env:
          GCLOUD_PROJECT: demo-boustio-migration
          GOOGLE_CLOUD_PROJECT: demo-boustio-migration
        run: |
          npx --yes firebase-tools@14.25.1 \
            emulators:exec \
            --project demo-boustio-migration \
            --only firestore \
            "cd functions && node --test pendingBookingUpload.integration.test.js"

      - name: Run cutover security integration tests
        env:
          GCLOUD_PROJECT: demo-boustio-migration
          GOOGLE_CLOUD_PROJECT: demo-boustio-migration
        run: |
          npx --yes firebase-tools@14.25.1 \
            emulators:exec \
            --project demo-boustio-migration \
            --only firestore \
            "cd functions && node --test cutoverSecurity.integration.test.js bookingModeSecurity.integration.test.js bookingModeWriteGuard.integration.test.js"

      - name: Run callable HTTP integration tests
        env:
          GCLOUD_PROJECT: demo-boustio-migration
          GOOGLE_CLOUD_PROJECT: demo-boustio-migration
          FUNCTIONS_EMULATOR_HOST: 127.0.0.1:5001
        run: |
          npx --yes firebase-tools@14.25.1 \
            --config firebase.http-emulator.json \
            emulators:exec \
            --project demo-boustio-migration \
            --only auth,firestore,functions \
            "cd functions && node --test migrationCallableHttpEmulator.test.js"
