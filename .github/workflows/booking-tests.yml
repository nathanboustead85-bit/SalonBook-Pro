name: Boustio Booking Engine Tests

on:
  push:
    branches:
      - phase-7c-live-booking
    paths:
      - 'functions/index.js'
      - 'functions/bookingEngine.js'
      - 'functions/bookingEngine.test.js'
      - 'functions/trustedCatalogue.js'
      - 'functions/trustedCatalogue.test.js'
      - 'functions/trustedBooking.js'
      - 'functions/trustedBooking.test.js'
      - 'functions/androidBookingAdapter.js'
      - 'functions/androidBookingAdapter.test.js'
      - 'functions/bookingMigrationPlan.js'
      - 'functions/bookingMigrationPlan.test.js'
      - 'functions/bookingMigrationValidator.js'
      - 'functions/bookingMigrationValidator.test.js'
      - 'functions/package.json'
      - '.github/workflows/booking-tests.yml'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  booking-tests:
    name: Run Booking Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: functions

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check all JavaScript syntax
        run: |
          node --check index.js
          node --check bookingEngine.js
          node --check bookingEngine.test.js
          node --check trustedCatalogue.js
          node --check trustedCatalogue.test.js
          node --check trustedBooking.js
          node --check trustedBooking.test.js
          node --check androidBookingAdapter.js
          node --check androidBookingAdapter.test.js
          node --check bookingMigrationPlan.js
          node --check bookingMigrationPlan.test.js
          node --check bookingMigrationValidator.js
          node --check bookingMigrationValidator.test.js

      - name: Run all 117 automated tests
        run: |
          node --test \
            bookingEngine.test.js \
            trustedCatalogue.test.js \
            trustedBooking.test.js \
            androidBookingAdapter.test.js \
            bookingMigrationPlan.test.js \
            bookingMigrationValidator.test.js
