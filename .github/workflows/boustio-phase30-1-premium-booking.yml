name: Boustio Phase 30.1 Premium Customer Booking Preview
on:
  workflow_dispatch:
  push:
    branches: [milestone-customer-booking-experience]
    paths:
      - 'web/phase30/booking-30-1.html'
      - 'tests/phase30_1_premium_booking.test.cjs'
      - '.github/workflows/boustio-phase30-1-premium-booking.yml'
permissions:
  contents: read
jobs:
  isolated-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test Phase 30.1 offline booking preview
        run: node --test tests/phase30_1_premium_booking.test.cjs
      - name: Preserve Phase 29 regression checks
        run: node --test tests/phase29*.test.cjs
      - name: Verify standalone HTML
        run: |
          test -s web/phase30/booking-30-1.html
          echo "OFFLINE_ONLY_NO_LIVE_BOOKINGS_NO_DEPLOYMENT"
      - uses: actions/upload-artifact@v4
        with:
          name: Boustio-Phase30-1-Samsung-HTML
          path: web/phase30/booking-30-1.html
          retention-days: 30
