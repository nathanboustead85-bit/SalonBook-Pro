name: Boustio Business Publisher Runtime Source Checks
on:
  workflow_dispatch:
  push:
    branches:
      - milestone-customer-booking-experience
    paths:
      - functions/index.js
      - functions/phase1317PublicSlugMapping.js
      - tests/phase17_publishbusiness_runtime_identity.test.js
      - .github/workflows/boustio-business-publisher-runtime-checks.yml
permissions:
  contents: read
jobs:
  source-check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate function source syntax
        run: |
          node --check functions/index.js
          node --check functions/phase1317PublicSlugMapping.js
      - name: Verify dedicated runtime identity and booking safety
        run: node tests/phase17_publishbusiness_runtime_identity.test.js
