name: Boustio Phase 38.3 Isolated Owner Authorization
on:
  workflow_dispatch:
  push:
    branches: [milestone-customer-booking-experience]
    paths:
      - 'web/phase38/**'
      - 'tests/phase38_3_*'
      - '.github/workflows/boustio-phase38-3-owner-authorization.yml'
permissions:
  contents: read
jobs:
  isolated-owner-authorization:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GCLOUD_PROJECT: demo-boustio-phase38-3
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:18080
      FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:19099
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install isolated test dependencies
        run: npm install --no-save --no-package-lock firebase@11 firebase-admin@13 @firebase/rules-unit-testing@4 firebase-tools@14
      - name: Phase 38.3 authorization and session unit tests
        run: node --test tests/phase38_3_authorization.test.cjs
      - name: Phase 38.2 schema compatibility regression
        run: node --test tests/phase38_2_schema.test.cjs
      - name: Phase 38.3 Firebase emulator owner isolation and denial matrix
        run: npx firebase-tools emulators:exec --only auth,firestore --project demo-boustio-phase38-3 --config firebase.phase32-4.json "node --test tests/phase38_3_emulator.test.cjs"
      - name: NO_DEPLOYMENT safety gate
        run: |
          test -s firestore.rules
          test -s firebase.phase32-4.json
          echo "PHASE38_3_SYNTHETIC_EMULATOR_ONLY_NO_DEPLOYMENT"
