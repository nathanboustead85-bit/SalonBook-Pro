name: Boustio Phase 26.11 Real Firestore Abuse Budget Tests
on:
  workflow_dispatch:
  push:
    branches:
      - milestone-customer-booking-experience
    paths:
      - 'tests/phase26_11_abuse_budget_emulator.test.cjs'
      - 'docs/PHASE26_11_ABUSE_BUDGET_EMULATOR.md'
      - '.github/workflows/boustio-phase26-11-abuse-emulator.yml'
permissions:
  contents: read
jobs:
  firestore-abuse-budget:
    if: github.repository == 'nathanboustead85-bit/SalonBook-Pro'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: 'true'
      GCLOUD_PROJECT: demo-boustio-phase2611
      GOOGLE_CLOUD_PROJECT: demo-boustio-phase2611
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
      FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
      BOUSTIO_CHAT_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install isolated emulator dependencies
        run: |
          npm install --prefix tests --no-audit --no-fund
          npm install --prefix functions --no-audit --no-fund
      - name: Verify isolated test configuration
        run: |
          node --check tests/phase26_11_abuse_budget_emulator.test.cjs
          node --check functions/chatAbuseBudget.js
          test "$GCLOUD_PROJECT" = demo-boustio-phase2611
          test "$BOUSTIO_CHAT_ENABLED" = false
      - name: Run real Firestore emulator abuse budget tests
        run: timeout --signal=TERM --kill-after=10s 600s tests/node_modules/.bin/firebase emulators:exec --project demo-boustio-phase2611 --only auth,firestore "node --test --test-concurrency=1 tests/phase26_11_abuse_budget_emulator.test.cjs"
      - name: Confirm no production deployment
        run: echo 'PHASE26_11=LOCAL_EMULATOR_ONLY_NO_DEPLOYMENT'
