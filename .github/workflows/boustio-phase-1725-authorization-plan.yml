name: Boustio Phase 17.25 Deployment Authorization Plan
on:
  workflow_dispatch:
    inputs:
      approval:
        description: 'Type PREPARE_AUTHORIZATION_GATES (plan only, no deployment)'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: boustio-phase1725-authorization-plan
  cancel-in-progress: false
jobs:
  plan:
    if: ${{ inputs.approval == 'PREPARE_AUTHORIZATION_GATES' && github.ref == 'refs/heads/milestone-customer-booking-experience' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: milestone-customer-booking-experience
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit authorization policy without Google credentials or deployment
        run: |
          node --check functions/index.js
          node tests/phase1722_deployment_readiness.test.js
          node tests/phase1724_deployment_preparation.test.js
          node tests/phase1725_authorization_plan.test.js
