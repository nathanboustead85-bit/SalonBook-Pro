name: Boustio Phase 34.3 Document Freshness and Consistency
on:
  workflow_dispatch:
  push:
    branches: [milestone-customer-booking-experience]
    paths:
      - 'web/phase34/document-freshness-34-3.js'
      - 'tests/phase34_3_document_freshness.test.cjs'
      - 'web/phase34/README-34-3.md'
      - '.github/workflows/boustio-phase34-3-freshness.yml'
permissions:
  contents: read
jobs:
  document-freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Phase 34.3 isolated timestamp and consistency tests
        run: node --test tests/phase34_3_document_freshness.test.cjs
      - name: Phase 34.1 and 34.2 regression
        run: node --test tests/phase34_1_readonly_gateway.test.cjs tests/phase34_2_android_firestore_map.test.cjs
      - name: Phase 33 regression
        run: node --test tests/phase33_*.test.cjs
      - name: Phase 32 offline safety regression
        run: node --test tests/phase32_9_content_recovery.test.cjs tests/phase32_1_staging_preparation.test.cjs tests/phase32_2_emulator_validation.test.cjs tests/phase32_10_final_audit.test.cjs
      - name: Phase 31 regression
        run: node --test tests/phase31_*.test.cjs
      - name: Phase 30 regression
        run: node --test tests/phase30*.test.cjs
      - name: Phase 29 regression
        run: node --test tests/phase29*.test.cjs
      - name: No deployment verification
        run: |
          test -s firestore.rules
          test -s firebase.json
          echo "PHASE34_3_ISOLATED_NO_LIVE_FIREBASE_NO_DEPLOYMENT"
