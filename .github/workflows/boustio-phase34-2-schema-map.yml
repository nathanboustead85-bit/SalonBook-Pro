name: Boustio Phase 34.2 Android Firestore Schema Compatibility
on:
  workflow_dispatch:
  push:
    branches: [milestone-customer-booking-experience]
    paths:
      - 'web/phase34/android-firestore-map-34-2.js'
      - 'tests/phase34_2_android_firestore_map.test.cjs'
      - 'web/phase34/README-34-2.md'
      - '.github/workflows/boustio-phase34-2-schema-map.yml'
permissions:
  contents: read
jobs:
  android-schema-map:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Phase 34.2 actual Android schema mapping tests
        run: node --test tests/phase34_2_android_firestore_map.test.cjs
      - name: Phase 34.1 regression
        run: node --test tests/phase34_1_readonly_gateway.test.cjs
      - name: Phase 33 regression
        run: node --test tests/phase33_*.test.cjs
      - name: Phase 32 offline safety regression
        run: node --test tests/phase32_9_content_recovery.test.cjs tests/phase32_1_staging_preparation.test.cjs tests/phase32_2_emulator_validation.test.cjs tests/phase32_10_final_audit.test.cjs
      - name: Phase 31 regression
        run: node --test tests/phase31_*.test.cjs
      - name: Phase 30 regression
        run: node --test tests/phase30*.test.cjs
      - name: Phase 29 regression
        run: node --test tests/phase29*.test.cjs
      - name: No deployment verification
        run: |
          test -s firestore.rules
          test -s firebase.json
          echo "PHASE34_2_OFFLINE_SCHEMA_MAPPING_NO_DEPLOYMENT"
