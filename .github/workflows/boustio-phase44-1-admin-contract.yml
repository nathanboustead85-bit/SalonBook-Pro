name: Boustio Phase 44.1 Isolated Admin Verification Contract
on:
  workflow_dispatch:
  push:
    branches: [milestone-customer-booking-experience]
    paths:
      - 'web/phase44/**'
      - 'tests/phase44_1_*'
      - '.github/workflows/boustio-phase44-1-admin-contract.yml'
permissions:
  contents: read
jobs:
  isolated-admin-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GCLOUD_PROJECT: demo-boustio-phase44-1
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:18080
      FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:19099
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install isolated dependencies
        run: npm install --no-save --no-package-lock firebase@11 firebase-admin@13 @firebase/rules-unit-testing@4 firebase-tools@14
      - name: Admin verification and Phase 43 audit regression
        run: node --test tests/phase44_1_admin.test.cjs tests/phase43_5_audit.test.cjs
      - name: Firebase emulator read-only owner isolation
        run: npx firebase-tools emulators:exec --only auth,firestore --project demo-boustio-phase44-1 --config firebase.phase32-4.json "node --test tests/phase44_1_emulator.test.cjs"
      - name: NO_DEPLOYMENT safety gate
        run: |
          test -s web/phase44/README-44-1.md
          echo "PHASE44_1_EMULATOR_ONLY_NO_DEPLOYMENT"
