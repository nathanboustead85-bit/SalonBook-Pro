name: Boustio Firebase Credential Preflight (No Deploy)
on:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check configured service account project without revealing credentials
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          node - <<'JS'
          const raw = process.env.FIREBASE_SA || '';
          if (!raw) {
            console.error('Secret FIREBASE_SERVICE_ACCOUNT is missing or empty');
            process.exit(1);
          }
          let credentials;
          try { credentials = JSON.parse(raw); }
          catch (_) {
            console.error('Secret is not a JSON service account key');
            process.exit(1);
          }
          if (credentials.type !== 'service_account' ||
              credentials.project_id !== 'salonbook-pro-ad5ff' ||
              typeof credentials.client_email !== 'string' ||
              typeof credentials.private_key !== 'string') {
            console.error('Service account key is incomplete or belongs to another Firebase project');
            process.exit(1);
          }
          console.log('Credential structure and Firebase project ID match salonbook-pro-ad5ff');
          console.log('No deployment or Firebase API calls were made');
          JS
