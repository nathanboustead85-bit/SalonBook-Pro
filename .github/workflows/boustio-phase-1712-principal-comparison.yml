name: Boustio Phase 17.12 Confirmed IAM Principal Comparison
on:
  workflow_dispatch:
    inputs:
      approval:
        description: 'Type VERIFY_PRINCIPAL_COMPONENTS for safe identity comparison'
        required: true
        type: string
permissions:
  contents: read
  id-token: write
concurrency:
  group: boustio-phase1712-principal-comparison
  cancel-in-progress: false
jobs:
  verify:
    if: ${{ inputs.approval == 'VERIFY_PRINCIPAL_COMPONENTS' && github.ref == 'refs/heads/milestone-customer-booking-experience' }}
    runs-on: ubuntu-latest
    environment: boustio-readonly-verification
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: milestone-customer-booking-experience
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate principal comparison and redaction tests
        run: |
          node --check scripts/phase1712_principal_comparison.js
          node tests/phase1712_principal_comparison.test.js
      - name: Compare OIDC subject with confirmed IAM principal without logging token
        env:
          BOUSTIO_PHASE1712_APPROVED: 'true'
        run: node scripts/phase1712_principal_comparison.js
