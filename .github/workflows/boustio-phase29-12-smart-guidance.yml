name: Boustio Phase 29.12 Smart Setup Guidance QA
on:
  workflow_dispatch:
  push:
    branches: [milestone-customer-booking-experience]
    paths:
      - 'web/phase29/onboarding-29-12.html'
      - 'tests/phase29_12_smart_guidance.test.cjs'
      - '.github/workflows/boustio-phase29-12-smart-guidance.yml'
permissions:
  contents: read
jobs:
  isolated-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test smart guidance
        run: node --test tests/phase29_12_smart_guidance.test.cjs
      - name: Run full Phase 29 regression suite
        run: node --test tests/phase29*.test.cjs
      - name: Verify offline-only preview
        run: |
          test -s web/phase29/onboarding-29-12.html
          echo "OFFLINE_ONLY_NO_DEPLOYMENT"
      - uses: actions/upload-artifact@v4
        with:
          name: Boustio-Phase29-12-Samsung-HTML
          path: web/phase29/onboarding-29-12.html
          retention-days: 14
