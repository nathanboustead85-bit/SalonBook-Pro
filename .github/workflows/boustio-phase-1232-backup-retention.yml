name: Boustio Phase 12.32 Backup Retention Safety
on:
  workflow_dispatch:
jobs:
  retention-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: milestone-customer-booking-experience
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install emulator dependencies
        run: |
          npm install --global firebase-tools@14
          npm install --prefix functions --no-save --ignore-scripts
      - name: Validate test syntax
        run: node --check tests/phase1232_backup_retention.test.js
      - name: Run isolated backup retention and deletion guard tests
        env:
          GCLOUD_PROJECT: demo-boustio-phase1232
        run: |
          firebase emulators:exec --only firestore --project demo-boustio-phase1232 \
            "node tests/phase1232_backup_retention.test.js"
      - name: Re-run readiness gate tests
        run: node tests/phase1230_readiness_gate.test.js
      - name: Re-run offline recovery tests
        run: node tests/phase1227_migration_recovery.test.js
