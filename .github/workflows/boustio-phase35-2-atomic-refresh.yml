name: Boustio Phase 35.2 Isolated Atomic Refresh and Sign-out
on:
  workflow_dispatch:
  push:
    branches: [milestone-customer-booking-experience]
    paths:
      - 'web/phase35/refresh-coordinator-35-2.js'
      - 'tests/phase35_2_atomic_refresh.test.cjs'
      - 'web/phase35/README-35-2.md'
      - '.github/workflows/boustio-phase35-2-atomic-refresh.yml'
permissions:
  contents: read
jobs:
  isolated-atomic-refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GCLOUD_PROJECT: demo-boustio-phase35-2
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:18080
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install isolated test dependencies
        run: npm install --no-save --no-package-lock firebase@11 @firebase/rules-unit-testing@4 firebase-tools@14
      - name: Phase 35.2 real Firestore emulator transaction and concurrency tests
        run: npx firebase-tools emulators:exec --only firestore --project demo-boustio-phase35-2 --config firebase.phase32-4.json "node --test tests/phase35_2_atomic_refresh.test.cjs"
      - name: Phase 34 regression
        run: node --test tests/phase34_*.test.cjs
      - name: No deployment verification
        run: |
          test -s firestore.rules
          test -s firebase.phase32-4.json
          echo "PHASE35_2_EMULATOR_ONLY_NO_DEPLOYMENT"
