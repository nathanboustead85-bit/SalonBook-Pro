name: Boustio Phase 42.2 Isolated Session Hardening
on:
  workflow_dispatch:
  push:
    branches: [milestone-customer-booking-experience]
    paths:
      - 'web/phase42/**'
      - 'tests/phase42_2_*'
      - '.github/workflows/boustio-phase42-2-session-hardening.yml'
permissions:
  contents: read
jobs:
  isolated-session-hardening:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GCLOUD_PROJECT: demo-boustio-phase42-2
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:18080
      FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:19099
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install emulator-only dependencies
        run: npm install --no-save --no-package-lock firebase@11 firebase-admin@13 @firebase/rules-unit-testing@4 firebase-tools@14
      - name: Session and Phase 42.1 regressions
        run: node --test tests/phase42_2_session.test.cjs tests/phase42_1_integration.test.cjs
      - name: Synthetic Firebase emulator verification
        run: npx firebase-tools emulators:exec --only auth,firestore --project demo-boustio-phase42-2 --config firebase.phase32-4.json "node --test tests/phase42_2_emulator.test.cjs"
      - name: NO_DEPLOYMENT safety gate
        run: |
          test -s web/phase42/README-42-2.md
          echo "PHASE42_2_EMULATOR_ONLY_NO_DEPLOYMENT"
