name: Boustio Phase 59.7 Firestore transaction chat emulator
on:
  push:
    paths:
      - 'chat/firestore-adapter.cjs'
      - 'tests/phase597-emulator/**'
      - 'security/phase59-7-firestore-transaction.md'
      - '.github/workflows/boustio-phase-59-7-firestore-transaction.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  firestore-transaction:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install isolated Firebase Admin and emulator dependencies
        working-directory: tests/phase597-emulator
        run: npm install --no-audit --no-fund
      - name: Execute real Firestore emulator transaction tests
        working-directory: tests/phase597-emulator
        run: npx firebase emulators:exec --project demo-boustio-phase597 --only firestore "node --test transaction.test.cjs" --config ../../firebase.json
