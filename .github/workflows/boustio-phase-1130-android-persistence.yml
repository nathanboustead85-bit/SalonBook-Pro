name: Boustio Phase 11.30 Android Restart Persistence
on:
  workflow_dispatch:
  push:
    branches:
      - phase-9d4-teal-clients
    paths:
      - 'app/src/debug/java/com/salonbook/pro/debug/DebugCalendarDiskCache.kt'
      - 'app/src/debug/java/com/salonbook/pro/debug/DebugCalendarSource.kt'
      - 'app/src/main/java/com/salonbook/pro/MainActivity.kt'
      - 'app/src/main/java/com/salonbook/pro/ManagementActivity.kt'
      - 'app/build.gradle.kts'
      - 'functions/phase1130AndroidCalendarPersistence.test.js'
      - 'functions/phase1131StableSigning.test.js'
      - 'functions/phase1132MultiDeviceReadiness.test.js'
      - 'functions/phase1133CloudConflictGuard.test.js'
      - 'functions/phase1134ConcurrentBookingConflict.test.js'
      - 'functions/phase1135CloudDifferencePreview.test.js'
      - 'functions/phase1136ConfirmedCloudImport.test.js'
      - 'functions/phase1137TwoDeviceImportSimulation.test.js'
      - 'functions/phase1138FirestoreEmulatorDevices.test.js'
      - 'functions/phase1139AndroidRecoverySafety.test.js'
      - 'functions/phase1140CloudRecoveryEmulator.test.js'
      - 'functions/phase1141AndroidRecoveryRehearsal.test.js'
      - 'functions/phase1142OfflineSyncPending.test.js'
      - 'functions/phase1143OfflineReconnectEmulator.test.js'
      - 'functions/phase1144OfflineReconnectRehearsal.test.js'
      - 'functions/phase1145PendingSyncReview.test.js'
      - 'functions/phase1146StaleBookingEditGuard.test.js'
      - 'functions/phase1147TwoDeviceConflictEmulator.test.js'
      - 'functions/phase1148ConflictRecoveryReview.test.js'
      - 'functions/phase1149VerifiedCloudBaseline.test.js'
      - 'functions/phase1150VerifiedBookingEditEmulator.test.js'
      - 'functions/phase1151BookingSaveAcknowledgementEmulator.test.js'
      - 'functions/phase1152BookingSyncStatus.test.js'
      - 'functions/phase1153IsolatedAndroidEditRehearsal.test.js'
      - 'functions/phase1154SafeCloudEditRecoveryEmulator.test.js'
      - 'functions/phase1156BookingSyncReliabilityEmulator.test.js'
      - 'functions/phase1157DeviceCloudReadOnly.test.js'
      - 'functions/phase1158TwoDeviceBookingRehearsal.test.js'
      - 'functions/phase1159TwoDeviceReadiness.test.js'
      - 'functions/phase1160SinglePhoneRecoveryAudit.test.js'
      - 'functions/phase1161RecoveryDiagnostics.test.js'
      - 'functions/phase1162WebsiteFeedClarity.test.js'
      - 'functions/phase1163WebsiteCollisionPreview.test.js'
      - 'functions/phase1164WebsiteBookingIntegrationEmulator.test.js'
      - 'functions/phase1165DailyWebsiteOverview.test.js'
      - 'functions/phase1166WebsiteCacheSafety.test.js'
      - 'functions/phase1201PremiumDesign.test.js'
      - 'functions/phase1202PremiumDashboard.test.js'
      - 'functions/phase1203PremiumCalendar.test.js'
      - 'functions/phase1204ModernFriendlyClientsServices.test.js'
      - 'functions/phase1205PremiumClientProfile.test.js'
      - 'functions/phase1206PremiumNavigationSettings.test.js'
      - 'functions/phase1165UnifiedDailyOverview.test.js'
      - 'app/src/main/java/com/salonbook/pro/CloudSyncManager.kt'
      - 'scripts/phase1155TestReliability.test.js'
      - 'scripts/validateFirebaseDebugConfig.js'
      - 'scripts/validateFirebaseDebugConfig.test.js'
      - '.github/workflows/boustio-phase-1130-android-persistence.yml'
permissions:
  contents: read
jobs:
  android-restart-persistence:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
      FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
      GCLOUD_PROJECT: demo-boustio-legacy-init
      GOOGLE_CLOUD_PROJECT: demo-boustio-legacy-init
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # The hosted runner already includes an Android SDK; setup-android@v3
      # attempts to install the removed 'tools' package on newer runners.
      - name: Verify Android SDK
        run: |
          test -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "Android SDK: ${ANDROID_HOME:-/usr/local/lib/android/sdk}"
      # Re-run Firebase validation using the newly configured Base64 secret.
      - name: Phase 11.55 fast booking guard regression preflight
        run: |
          node --test scripts/phase1155TestReliability.test.js functions/phase1133CloudConflictGuard.test.js functions/phase1146StaleBookingEditGuard.test.js functions/phase1153IsolatedAndroidEditRehearsal.test.js functions/phase1152BookingSyncStatus.test.js
      - name: Firebase configuration guard tests
        run: node --test scripts/validateFirebaseDebugConfig.test.js
      - name: Install registered development Firebase configuration
        env:
          BOUSTIO_DEBUG_GOOGLE_SERVICES_B64: ${{ secrets.BOUSTIO_DEBUG_GOOGLE_SERVICES_B64 }}
        run: |
          test -n "$BOUSTIO_DEBUG_GOOGLE_SERVICES_B64" || { echo "::error::Register com.salonbook.pro.devcalendar1110 in Firebase, then set repository secret BOUSTIO_DEBUG_GOOGLE_SERVICES_B64 to Base64 encoding of its downloaded google-services.json"; exit 1; }
          mkdir -p app/src/debug
          printf '%s' "$BOUSTIO_DEBUG_GOOGLE_SERVICES_B64" | base64 --decode > app/src/debug/google-services.json
          node scripts/validateFirebaseDebugConfig.js
      - name: Phase 11.65 website count overview and safety checks
        run: node --test functions/phase1165UnifiedDailyOverview.test.js
      - name: Phase 12.6 premium navigation and settings regression checks
        run: node --test functions/phase1206PremiumNavigationSettings.test.js
      - name: Phase 12.5 premium client profile regression checks
        run: node --test functions/phase1205PremiumClientProfile.test.js
      - name: Phase 12.4 modern friendly clients and services regression checks
        run: node --test functions/phase1204ModernFriendlyClientsServices.test.js
      - name: Phase 12.3 premium calendar regression checks
        run: node --test functions/phase1203PremiumCalendar.test.js
      - name: Phase 12.2 premium dashboard regression checks
        run: node --test functions/phase1202PremiumDashboard.test.js
      - name: Phase 12.1 premium design regression checks
        run: node --test functions/phase1201PremiumDesign.test.js
      - name: Phase 11.66 website feed offline freshness safety
        run: node --test functions/phase1166WebsiteCacheSafety.test.js
      - name: Phase 11.65 daily website booking overview checks
        run: node --test functions/phase1165DailyWebsiteOverview.test.js
      - name: Phase 11.64 isolated website booking integration emulator
        run: |
          npm --prefix functions install --no-audit --no-fund
          GCLOUD_PROJECT=demo-boustio-phase-1164 GOOGLE_CLOUD_PROJECT=demo-boustio-phase-1164 npx --yes firebase-tools@14 emulators:exec --project demo-boustio-phase-1164 --only firestore 'GCLOUD_PROJECT=demo-boustio-phase-1164 node --test functions/phase1164WebsiteBookingIntegrationEmulator.test.js'
      - name: Phase 11.63 website appointment collision preview checks
        run: node --test functions/phase1163WebsiteCollisionPreview.test.js
      - name: Phase 11.62 website/shared feed separation safety checks
        run: node --test functions/phase1162WebsiteFeedClarity.test.js
      - name: Phase 11.61 read-only recovery diagnostics regression
        run: node --test functions/phase1161RecoveryDiagnostics.test.js
      - name: Phase 11.60 single-phone recovery audit regression
        run: node --test functions/phase1160SinglePhoneRecoveryAudit.test.js
      - name: Phase 11.59 real-device preparation safety checks
        run: node --test functions/phase1159TwoDeviceReadiness.test.js
      - name: Phase 11.58 independent two-device booking rehearsal (isolated emulator)
        run: |
          npm --prefix functions install --no-audit --no-fund
          GCLOUD_PROJECT=demo-boustio-phase-1158 GOOGLE_CLOUD_PROJECT=demo-boustio-phase-1158 npx --yes firebase-tools@14 emulators:exec --project demo-boustio-phase-1158 --only firestore 'GCLOUD_PROJECT=demo-boustio-phase-1158 node --test functions/phase1158TwoDeviceBookingRehearsal.test.js'
      - name: Phase 11.57 read-only device verification safety checks
        run: node --test functions/phase1157DeviceCloudReadOnly.test.js
      - name: Phase 11.56 multi-device booking sync reliability emulator integration
        run: |
          npm --prefix functions install --no-audit --no-fund
          GCLOUD_PROJECT=demo-boustio-phase-1156 GOOGLE_CLOUD_PROJECT=demo-boustio-phase-1156 npx --yes firebase-tools@14 emulators:exec --project demo-boustio-phase-1156 --only firestore 'GCLOUD_PROJECT=demo-boustio-phase-1156 node --test functions/phase1156BookingSyncReliabilityEmulator.test.js'
      - name: Phase 11.54 safe cloud edit and recovery emulator integration
        run: |
          npm --prefix functions install --no-audit --no-fund
          GCLOUD_PROJECT=demo-boustio-phase-1154 GOOGLE_CLOUD_PROJECT=demo-boustio-phase-1154 npx --yes firebase-tools@14 emulators:exec --project demo-boustio-phase-1154 --only firestore 'GCLOUD_PROJECT=demo-boustio-phase-1154 node --test functions/phase1154SafeCloudEditRecoveryEmulator.test.js'
      - name: Phase 11.53 isolated Android appointment edit rehearsal checks
        run: node --test functions/phase1153IsolatedAndroidEditRehearsal.test.js
      - name: Phase 11.52 Android booking sync status safety checks
        run: node --test functions/phase1152BookingSyncStatus.test.js
      - name: Phase 11.51 isolated phone save and server acknowledgement integration
        run: |
          npm --prefix functions install --no-audit --no-fund
          GCLOUD_PROJECT=demo-boustio-phase-1151 GOOGLE_CLOUD_PROJECT=demo-boustio-phase-1151 npx --yes firebase-tools@14 emulators:exec --project demo-boustio-phase-1151 --only firestore 'GCLOUD_PROJECT=demo-boustio-phase-1151 node --test functions/phase1151BookingSaveAcknowledgementEmulator.test.js'
      - name: Phase 11.50 isolated verified booking edit and conflict integration
        run: |
          npm --prefix functions install --no-audit --no-fund
          GCLOUD_PROJECT=demo-boustio-phase-1150 GOOGLE_CLOUD_PROJECT=demo-boustio-phase-1150 npx --yes firebase-tools@14 emulators:exec --project demo-boustio-phase-1150 --only firestore 'GCLOUD_PROJECT=demo-boustio-phase-1150 node --test functions/phase1150VerifiedBookingEditEmulator.test.js'
      - name: Phase 11.49 verified cloud baseline safety checks
        run: node --test functions/phase1149VerifiedCloudBaseline.test.js
      - name: Phase 11.48 read-only conflict recovery Android safety checks
        run: node --test functions/phase1148ConflictRecoveryReview.test.js
      - name: Phase 11.47 isolated two-device conflict Firestore integration
        run: |
          npm --prefix functions install --no-audit --no-fund
          GCLOUD_PROJECT=demo-boustio-phase-1147 GOOGLE_CLOUD_PROJECT=demo-boustio-phase-1147 npx --yes firebase-tools@14 emulators:exec --project demo-boustio-phase-1147 --only firestore 'GCLOUD_PROJECT=demo-boustio-phase-1147 node --test functions/phase1147TwoDeviceConflictEmulator.test.js'
      - name: Phase 11.46 stale cloud booking edit guard checks
        run: node --test functions/phase1146StaleBookingEditGuard.test.js
      - name: Phase 11.45 pending cloud sync review safety checks
        run: node --test functions/phase1145PendingSyncReview.test.js
      - name: Phase 11.44 Android offline reconnect demo safety checks
        run: node --test functions/phase1144OfflineReconnectRehearsal.test.js
      - name: Phase 11.43 isolated Firestore offline reconnect conflict integration
        run: |
          npm --prefix functions install --no-audit --no-fund
          GCLOUD_PROJECT=demo-boustio-phase-1143 GOOGLE_CLOUD_PROJECT=demo-boustio-phase-1143 npx --yes firebase-tools@14 emulators:exec --project demo-boustio-phase-1143 --only firestore 'GCLOUD_PROJECT=demo-boustio-phase-1143 node --test functions/phase1143OfflineReconnectEmulator.test.js'
      - name: Phase 11.42 offline cloud sync acknowledgement safety checks
        run: node --test functions/phase1142OfflineSyncPending.test.js
      - name: Phase 11.41 isolated Android recovery rehearsal checks
        run: node --test functions/phase1141AndroidRecoveryRehearsal.test.js
      - name: Phase 11.40 isolated real Firestore cloud recovery integration
        run: |
          npm --prefix functions install --no-audit --no-fund
          GCLOUD_PROJECT=demo-boustio-phase-1140 GOOGLE_CLOUD_PROJECT=demo-boustio-phase-1140 npx --yes firebase-tools@14 emulators:exec --project demo-boustio-phase-1140 --only firestore 'GCLOUD_PROJECT=demo-boustio-phase-1140 node --test functions/phase1140CloudRecoveryEmulator.test.js'
      - name: Phase 11.39 Android cloud recovery safety checks
        run: node --test functions/phase1139AndroidRecoverySafety.test.js
      - name: Phase 11.38 isolated Firestore two-client integration
        run: |
          npm --prefix functions install --no-audit --no-fund
          GCLOUD_PROJECT=demo-boustio-phase-1138 GOOGLE_CLOUD_PROJECT=demo-boustio-phase-1138 npx --yes firebase-tools@14 emulators:exec --project demo-boustio-phase-1138 --only firestore 'GCLOUD_PROJECT=demo-boustio-phase-1138 node --test functions/phase1138FirestoreEmulatorDevices.test.js'
      - name: Phase 11.37 two-device cloud-only import simulation
        run: node --test functions/phase1137TwoDeviceImportSimulation.test.js
      - name: Phase 11.36 confirmed cloud import safety checks
        run: node --test functions/phase1136ConfirmedCloudImport.test.js
      - name: Phase 11.35 read-only cloud differences checks
        run: node --test functions/phase1135CloudDifferencePreview.test.js
      - name: Phase 11.34 concurrent booking conflict simulation
        run: node --test functions/phase1134ConcurrentBookingConflict.test.js
      - name: Phase 11.33 cloud conflict guard checks
        run: node --test functions/phase1133CloudConflictGuard.test.js
      - name: Phase 11.32 multi-device readiness checks
        run: node --test functions/phase1132MultiDeviceReadiness.test.js
      - name: Phase 11.31 stable signing guard tests
        run: node --test functions/phase1131StableSigning.test.js
      - name: Phase 11.30 Android persistence safety checks
        run: node --test functions/phase1130AndroidCalendarPersistence.test.js
      - name: Phase 11.29 recovery regression
        run: node --test functions/phase1129RestartJournal.test.js
      - name: Phase 11.13 Android calendar contract regression
        run: node --test functions/phase1113UnifiedCalendarAndroid.test.js
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore stable Android signing keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for value in SIGNING_KEYSTORE_BASE64 SIGNING_STORE_PASSWORD SIGNING_KEY_ALIAS SIGNING_KEY_PASSWORD; do
            if [[ -z "${!value}" ]]; then
              echo "::error::Missing stable signing secret: $value"
              exit 1
            fi
          done
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/boustio-stable.jks"
          chmod 600 "$RUNNER_TEMP/boustio-stable.jks"
      - name: Compile consistently signed Android debug APK
        env:
          SIGNING_KEYSTORE_PATH: ${{ runner.temp }}/boustio-stable.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: boustio-phase-1130-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
