name: Boustio Phase 55.4 final storage safety audit
on:
  push:
    paths:
      - 'app/src/main/java/com/salonbook/pro/AndroidStorageSnapshotAdapter.kt'
      - 'app/src/main/java/com/salonbook/pro/DurableRecoveryJournal.kt'
      - 'app/src/test/java/com/salonbook/pro/AndroidStorageFinalAuditTest.kt'
      - 'tests/phase554_final_storage_audit.test.cjs'
      - 'docs/security/phase-55-4-final-android-storage-audit.md'
      - '.github/workflows/boustio-phase-55-4-final-storage-audit.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  final-storage-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run adapter, identity, consistency and final audit JUnit tests
        run: gradle --no-daemon :app:testReleaseUnitTest --tests com.salonbook.pro.AndroidStorageSnapshotAdapterTest --tests com.salonbook.pro.AndroidStorageSnapshotAdapterValidationTest --tests com.salonbook.pro.AndroidStorageSnapshotConsistencyTest --tests com.salonbook.pro.AndroidStorageFinalAuditTest
      - name: Verify read-only isolation and seven open blockers
        run: node --test tests/phase551_android_storage_isolation.test.cjs tests/phase552_json_identity_isolation.test.cjs tests/phase553_snapshot_consistency.test.cjs tests/phase554_final_storage_audit.test.cjs
