name: Boustio Phase 32.8 Real Business Data Payload Integrity Emulator Tests
on:
  workflow_dispatch:
  push:
    branches: [milestone-customer-booking-experience]
    paths:
      - 'tests/phase32_8_business_payload_integrity.test.cjs'
      - 'web/phase32/README-32-8.md'
      - '.github/workflows/boustio-phase32-8-data-integrity.yml'
      - 'firestore.rules'
      - 'firebase.phase32-4.json'
permissions:
  contents: read
jobs:
  business-data-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install isolated Firebase test dependencies
        run: npm install --no-save --no-package-lock --ignore-scripts firebase@11 @firebase/rules-unit-testing@4
      - name: Real emulator business payload integrity and earlier security regressions
        run: |
          npx --yes firebase-tools@14 emulators:exec --non-interactive --only firestore,auth --project demo-boustio-phase32-staging --config firebase.phase32-4.json "node --test tests/phase32_4_owner_rules.test.cjs tests/phase32_5_multi_owner_rules.test.cjs tests/phase32_6_concurrent_booking_rules.test.cjs tests/phase32_7_booking_mode_migration.test.cjs tests/phase32_8_business_payload_integrity.test.cjs"
      - name: Phase 32 static safety tests
        run: node --test tests/phase32_1_staging_preparation.test.cjs tests/phase32_2_emulator_validation.test.cjs
      - name: Phase 31 regression
        run: node --test tests/phase31_*.test.cjs
      - name: Phase 30 regression
        run: node --test tests/phase30*.test.cjs
      - name: Phase 29 regression
        run: node --test tests/phase29*.test.cjs
      - name: No deployment verification
        run: |
          test -s firestore.rules
          test -s firebase.phase32-4.json
          echo "DEMO_ONLY_BUSINESS_PAYLOAD_RULES_NO_DEPLOYMENT"
