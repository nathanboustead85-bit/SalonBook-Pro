name: Boustio Phase 45.1 Isolated Staging Safety
on:
  workflow_dispatch:
  push:
    branches: [milestone-customer-booking-experience]
    paths:
      - 'web/phase45/**'
      - 'tests/phase45_1_*'
      - '.github/workflows/boustio-phase45-1-staging-safety.yml'
permissions:
  contents: read
jobs:
  isolated-staging-safety:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GCLOUD_PROJECT: demo-boustio-phase45-1
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:18080
      FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:19099
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install isolated dependencies
        run: npm install --no-save --no-package-lock firebase@11 firebase-admin@13 @firebase/rules-unit-testing@4 firebase-tools@14
      - name: Staging safety and Phase 44 security regressions
        run: node --test tests/phase45_1_readiness.test.cjs tests/phase44_5_audit.test.cjs
      - name: Firebase emulator safety verification
        run: npx firebase-tools emulators:exec --only auth,firestore --project demo-boustio-phase45-1 --config firebase.phase32-4.json "node --test tests/phase45_1_emulator.test.cjs"
      - name: NO_DEPLOYMENT safety gate
        run: |
          test -s web/phase45/README-45-1.md
          echo "PHASE45_1_EMULATOR_ONLY_NO_DEPLOYMENT"
