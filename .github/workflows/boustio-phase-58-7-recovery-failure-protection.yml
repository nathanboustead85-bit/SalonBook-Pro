name: Boustio Phase 58.7 recovery failure protection
on:
  push:
    paths:
      - 'app/src/test/java/com/salonbook/pro/recovery/DisposableRecoveryFailureProtectionTest.kt'
      - 'security/phase58-7-recovery-failure-protection.json'
      - 'security/phase58-7-recovery-failure-protection.md'
      - '.github/workflows/boustio-phase-58-7-recovery-failure-protection.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-recovery-failures:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK from runner image
        run: |
          echo "ANDROID_HOME=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Run Kotlin Robolectric synthetic recovery failure tests
        run: gradle :app:testDebugUnitTest --tests 'com.salonbook.pro.recovery.DisposableRecoveryFailureProtectionTest' --no-daemon --stacktrace
      - name: Verify production safeguards
        run: |
          node -e "const a=require('./security/phase58-7-recovery-failure-protection.json'),g=require('./security/phase51-consolidated-gates.json');if(a.productionRestoreEnabled||a.productionPreferencesTouched||a.deployment||a.originalAndroidAppointments!=='DO_NOT_TOUCH'||Object.values(g.gates).some(x=>x.status!=='OPEN'))process.exit(1)"
