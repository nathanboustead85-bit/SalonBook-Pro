name: Boustio Phase 53.1 isolated Kotlin recovery prototype
on:
  push:
    paths:
      - 'app/src/main/java/com/salonbook/pro/RecoveryTransaction.kt'
      - 'tests/phase531_kotlin_recovery.test.cjs'
      - 'docs/security/phase-53-1-recovery-prototype.md'
      - '.github/workflows/boustio-phase-53-1-kotlin-recovery.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recovery-prototype:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Run offline guardrails
        run: node --test tests/phase531_kotlin_recovery.test.cjs
      - name: Compile Kotlin prototype without installation or deployment
        run: gradle --no-daemon :app:compileReleaseKotlin
