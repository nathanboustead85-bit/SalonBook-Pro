name: Boustio Phase 17 trusted revision tests
on:
  workflow_dispatch:
  push:
    paths:
      - "functions/phase17TrustedRevision.js"
      - "tests/phase17_trusted_revision.test.js"
      - ".github/workflows/boustio-phase17-trusted-revision.yml"
permissions:
  contents: read
jobs:
  trusted-revision:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node tests/phase17_trusted_revision.test.js
      - run: node tests/phase17_public_database_writer.test.js
