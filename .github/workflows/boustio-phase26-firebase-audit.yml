name: Boustio Phase 26.2 Isolated Firebase Access Control Audit
on:
  workflow_dispatch:
  push:
    branches:
      - milestone-customer-booking-experience
    paths:
      - 'tests/phase26_firebase_access.test.cjs'
      - 'docs/PHASE26_2_FIREBASE_SECURITY.md'
      - '.github/workflows/boustio-phase26-firebase-audit.yml'
permissions:
  contents: read
jobs:
  emulator-security-audit:
    if: github.repository == 'nathanboustead85-bit/SalonBook-Pro'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: 'true'
      GCLOUD_PROJECT: demo-boustio-phase26
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
      FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install isolated emulator dependencies
        working-directory: tests
        run: npm install --no-audit --no-fund
      - name: Validate test syntax and isolated project
        run: |
          node --check tests/phase26_firebase_access.test.cjs
          test "$GCLOUD_PROJECT" = "demo-boustio-phase26"
      - name: Run isolated Firebase access-control matrix
        run: timeout --signal=TERM --kill-after=10s 420s tests/node_modules/.bin/firebase emulators:exec --project demo-boustio-phase26 --only auth,firestore "node --test tests/phase26_firebase_access.test.cjs"
      - name: Confirm no production changes
        run: echo 'PHASE26_2=EMULATOR_ONLY_NO_DEPLOYMENT_NO_LIVE_WRITES'
