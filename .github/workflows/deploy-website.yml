name: Deploy SalonBook Pro Website

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type DEPLOY-BOUSTIO-WEBSITE to explicitly authorize a production website deployment'
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Firebase Hosting
    if: >-
      github.repository == 'nathanboustead85-bit/SalonBook-Pro' &&
      github.ref == 'refs/heads/production-release' &&
      inputs.confirmation == 'DEPLOY-BOUSTIO-WEBSITE'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout website files
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy website
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-key.json"
          chmod 600 "$RUNNER_TEMP/firebase-key.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-key.json"
          firebase deploy --only hosting --project salonbook-pro-ad5ff --non-interactive
