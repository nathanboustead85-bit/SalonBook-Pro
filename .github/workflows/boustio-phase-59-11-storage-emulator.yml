name: Boustio Phase 59.11 Firebase Storage emulator integration
on:
  push:
    paths:
      - 'chat/firebase-storage-emulator.cjs'
      - 'tests/phase5911-storage/**'
      - 'security/phase59-11-firebase-storage-emulator.md'
      - '.github/workflows/boustio-phase-59-11-storage-emulator.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  storage-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install isolated Firebase Storage test dependencies
        working-directory: tests/phase5911-storage
        run: npm install --no-audit --no-fund
      - name: Install FFmpeg for media processing
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Execute real Firebase Storage emulator tests
        working-directory: tests/phase5911-storage
        run: NODE_PATH=./node_modules npx firebase emulators:exec --project demo-boustio-phase5911 --only storage "node --test storage.test.cjs" --config firebase.json
