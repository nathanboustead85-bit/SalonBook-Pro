name: Boustio Phase 58.6 Android persistence verification
on:
  push:
    paths:
      - 'app/src/test/java/com/salonbook/pro/recovery/DisposableSharedPreferencesTest.kt'
      - 'app/build.gradle.kts'
      - 'security/phase58-6-android-persistence.json'
      - 'security/phase58-6-android-persistence.md'
      - '.github/workflows/boustio-phase-58-6-android-persistence.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-persistence-simulation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK from runner image
        run: |
          echo "ANDROID_HOME=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Run Robolectric disposable Android preferences tests
        run: gradle :app:testDebugUnitTest --tests 'com.salonbook.pro.recovery.DisposableSharedPreferencesTest' --no-daemon --stacktrace
      - name: Confirm launch gates and nonproduction scope
        run: |
          node -e "const a=require('./security/phase58-6-android-persistence.json'),g=require('./security/phase51-consolidated-gates.json');if(a.productionRestoreEnabled||a.productionPreferencesTouched||a.deployment||a.originalAndroidAppointments!=='DO_NOT_TOUCH'||Object.values(g.gates).some(x=>x.status!=='OPEN'))process.exit(1)"
