name: Boustio Phase 36.1 Isolated Android Firestore Adapter
on:
  workflow_dispatch:
  push:
    branches: [milestone-customer-booking-experience]
    paths:
      - 'web/phase36/android-business-adapter-36-1.js'
      - 'tests/phase36_1_android_adapter.test.cjs'
      - 'web/phase36/README-36-1.md'
      - '.github/workflows/boustio-phase36-1-android-adapter.yml'
permissions:
  contents: read
jobs:
  isolated-android-adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GCLOUD_PROJECT: demo-boustio-phase36-1
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:18080
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install isolated Firebase test dependencies
        run: npm install --no-save --no-package-lock firebase@11 @firebase/rules-unit-testing@4 firebase-tools@14
      - name: Phase 36.1 real Firestore emulator adapter and isolation tests
        run: npx firebase-tools emulators:exec --only firestore --project demo-boustio-phase36-1 --config firebase.phase32-4.json "node --test tests/phase36_1_android_adapter.test.cjs"
      - name: Phase 34 regression suite
        run: node --test tests/phase34_*.test.cjs
      - name: Phase 33 regression suite
        run: node --test tests/phase33_*.test.cjs
      - name: Phase 35.5 offline audit regressions
        run: node --test tests/phase35_5_final_audit.test.cjs
      - name: Verify no deployment
        run: |
          test -s firestore.rules
          test -s firebase.phase32-4.json
          echo "PHASE36_1_ISOLATED_READ_ONLY_NO_DEPLOYMENT"
