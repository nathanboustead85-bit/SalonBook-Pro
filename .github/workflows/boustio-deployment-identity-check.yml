name: Boustio Deployment Identity Check (No Deploy)
on:
  workflow_dispatch:
jobs:
  identify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Identify deployment service account without exposing credentials
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          node - <<'JS'
          const raw=process.env.FIREBASE_SA;
          if (!raw) throw Error('Firebase deployment secret is missing');
          const key=JSON.parse(raw);
          if (key.type!=='service_account' || key.project_id!=='salonbook-pro-ad5ff')
            throw Error('Firebase service account project mismatch');
          const known = {
            'boustio-readonly-verifier@salonbook-pro-ad5ff.iam.gserviceaccount.com': 'Boustio Read-Only Verifier',
            'firebase-adminsdk-fbsvc@salonbook-pro-ad5ff.iam.gserviceaccount.com': 'Firebase Admin SDK',
            'salonbook-hosting-deploy@salonbook-pro-ad5ff.iam.gserviceaccount.com': 'SalonBook Hosting Deployment',
            'salonbook-pro-ad5ff@appspot.gserviceaccount.com': 'App Engine Default',
            'boustio-github-deploy@salonbook-pro-ad5ff.iam.gserviceaccount.com': 'Boustio GitHub Deployment'
          };
          if (Object.hasOwn(known,key.client_email)) {
            console.log('MATCH: GitHub credential is for '+known[key.client_email]);
          } else {
            console.log('NOT MATCHED: GitHub credential is not one of the five known accounts');
            process.exitCode=1;
          }
          console.log('No credentials displayed, no Google Cloud changes made');
          JS
