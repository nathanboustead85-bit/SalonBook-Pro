name: Boustio Phase 30.20 Final Booking Preview Audit
on:
  workflow_dispatch:
  push:
    branches: [milestone-customer-booking-experience]
    paths:
      - 'web/phase30/booking-30-20.html'
      - 'tests/phase30_20_final_audit.test.cjs'
      - '.github/workflows/boustio-phase30-20-final-audit.yml'
permissions:
  contents: read
jobs:
  final-offline-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Dedicated final booking preview audit
        run: node --test tests/phase30_20_final_audit.test.cjs
      - name: Full Phase 30 regression
        run: node --test tests/phase30*.test.cjs
      - name: Preserve Phase 29 regression
        run: node --test tests/phase29*.test.cjs
      - name: Verify isolated HTML and no deployment
        run: |
          test -s web/phase30/booking-30-20.html
          ! grep -Eiq '<script[^>]+src=|<form[[:space:]>]' web/phase30/booking-30-20.html
          echo "OFFLINE_PREVIEW_NO_BOOKINGS_NO_DEPLOYMENT"
      - uses: actions/upload-artifact@v4
        with:
          name: Boustio-Phase30-20-Final-Samsung-HTML
          path: web/phase30/booking-30-20.html
          retention-days: 30
