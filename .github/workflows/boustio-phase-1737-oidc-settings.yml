name: Boustio Phase 17.37 GitHub OIDC Settings Inspection
on:
  workflow_dispatch:
    inputs:
      approval:
        description: 'Type READ_OIDC_SETTINGS (read-only GitHub API)'
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: boustio-phase1737-oidc-settings
  cancel-in-progress: false
jobs:
  inspect:
    if: ${{ inputs.approval == 'READ_OIDC_SETTINGS' && github.ref == 'refs/heads/milestone-customer-booking-experience' && github.repository == 'nathanboustead85-bit/SalonBook-Pro' }}
    runs-on: ubuntu-latest
    environment: boustio-function-deployment
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: milestone-customer-booking-experience
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test GitHub API response classification and security guards
        run: |
          node --check scripts/phase1737_oidc_settings.js
          node tests/phase1737_oidc_settings.test.js
      - name: Read repository OIDC subject customisation settings
        env:
          BOUSTIO_PHASE1737_APPROVAL: ${{ inputs.approval }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/phase1737_oidc_settings.js
