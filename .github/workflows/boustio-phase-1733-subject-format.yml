name: Boustio Phase 17.33 Safe OIDC Subject Format Diagnosis
on:
  workflow_dispatch:
    inputs:
      approval:
        description: 'Type CHECK_SUBJECT_FORMAT (no token or subject disclosure)'
        required: true
        type: string
permissions:
  contents: read
  id-token: write
concurrency:
  group: boustio-phase1733-subject-format
  cancel-in-progress: false
jobs:
  diagnose-subject:
    if: ${{ inputs.approval == 'CHECK_SUBJECT_FORMAT' && github.ref == 'refs/heads/milestone-customer-booking-experience' && github.repository == 'nathanboustead85-bit/SalonBook-Pro' }}
    runs-on: ubuntu-latest
    environment: boustio-function-deployment
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: milestone-customer-booking-experience
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test subject format classifier and security guards
        run: |
          node --check scripts/phase1733_subject_format.js
          node tests/phase1733_subject_format.test.js
      - name: Diagnose subject format without printing token or subject
        env:
          BOUSTIO_PHASE1733_APPROVAL: ${{ inputs.approval }}
        run: node scripts/phase1733_subject_format.js
