name: Boustio Signing Certificate Fingerprint

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fingerprint:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Display public SHA-256 certificate fingerprint
        shell: bash
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: |
          set -euo pipefail
          for value in SIGNING_KEYSTORE_BASE64 SIGNING_STORE_PASSWORD SIGNING_KEY_ALIAS; do
            if [[ -z "${!value}" ]]; then
              echo "::error::Missing signing secret: $value"
              exit 1
            fi
          done
          keystore="$RUNNER_TEMP/boustio-signing.jks"
          trap 'rm -f "$keystore"' EXIT
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          # Output only the public certificate fingerprint; never expose private key or passwords.
          keytool -list -v -keystore "$keystore" -alias "$SIGNING_KEY_ALIAS" -storepass "$SIGNING_STORE_PASSWORD" | grep -E '^[[:space:]]*SHA256:'
