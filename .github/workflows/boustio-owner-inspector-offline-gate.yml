name: Boustio Owner Inspector Offline Safety Gate
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/boustio-owner-inspector-offline-gate.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out inspected backend branch
        uses: actions/checkout@v4
        with:
          ref: milestone-customer-booking-experience
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify existing booking audit tests
        run: npm --prefix functions run test:booking-integration
      - name: Verify owner authentication and no-write inspector contract
        run: |
          node <<'JS'
          const fs=require('node:fs');
          const assert=require('node:assert/strict');
          const entry=fs.readFileSync('functions/index.js','utf8');
          const inspector=fs.readFileSync('functions/inspectMigration.js','utf8');
          const audit=fs.readFileSync('functions/legacyBookingAudit.js','utf8');
          const handler=entry.slice(entry.lastIndexOf('exports.inspectLegacyBookingMigration = onCall('));
          assert.match(handler,/const uid = verifiedUser\(request\)/);
          assert.match(handler,/inspectMigration\(db, uid\)/);
          assert.match(entry,/auth\.token\.email_verified !== true/);
          assert.match(entry,/!auth\.uid/);
          assert.match(handler,/maxInstances: 5/);
          for(const [name,source] of [['inspector',inspector],['audit',audit]]){
            assert.doesNotMatch(source,/\.(create|update|delete|commit|batch|runTransaction)\s*\(/,
              name+' must not perform writes');
          }
          assert.match(inspector,/migrationPerformed: false/);
          assert.match(inspector,/liveBookingsEnabled: false/);
          assert.match(entry,/acceptingBookings: false/);
          console.log('PASS: verified owner identity is required before inspection');
          console.log('PASS: owner UID scopes all inspector reads');
          console.log('PASS: no migration writes or booking activation');
          console.log('INFO: This is an offline contract test, NOT live owner authentication');
          JS
      - name: Prove owner isolation and zero writes with two independent businesses
        run: |
          node <<'JS'
          const assert=require('node:assert/strict');
          const {inspectMigration}=require('./functions/inspectMigration');
          const owners=['owner_alpha','owner_beta'];
          const booking=(id)=>JSON.stringify([{id,staffId:'staff_1',date:'2026-11-20',time:'09:00',duration:30}]);
          const records={owner_alpha:booking('alpha_appointment'),owner_beta:booking('beta_appointment')};
          const reads=[];
          const db={
            collection(root){
              assert.ok(['users','businesses'].includes(root));
              return {doc(uid){
                assert.ok(owners.includes(uid));
                return {collection(child){
                  assert.ok(['liveData','bookingLocks','appointments'].includes(child));
                  return {
                    doc(id){
                      return {
                        async get(){
                          reads.push([root,uid,child,id]);
                          assert.equal(root,'users');
                          assert.equal(child,'liveData');
                          assert.equal(id,'bookings');
                          return {exists:true,get(field){assert.equal(field,'json');return records[uid];}};
                        }
                      };
                    },
                    limit(n){
                      assert.equal(n,1);
                      return {async get(){reads.push([root,uid,child,'query']);return {empty:true};}};
                    }
                  };
                }};
              }};
            },
            async getAll(...refs){return refs.map(()=>({exists:false}));}
          };
          (async()=>{
            for(const owner of owners){
              reads.length=0;
              const result=await inspectMigration(db,owner);
              assert.equal(result.safe,true);
              assert.equal(result.count,1);
              assert.equal(result.lockCount,2);
              assert.equal(result.migrationPerformed,false);
              assert.equal(result.liveBookingsEnabled,false);
              assert.ok(reads.length>=2);
              assert.ok(reads.every(path=>path[1]===owner),'cross-owner Firestore read');
              assert.equal(JSON.stringify(result).includes('appointment'),false,'booking details leaked');
              console.log('PASS: isolated read-only inspection for a simulated owner');
            }
          })().catch(e=>{console.error(e);process.exitCode=1;});
          JS
