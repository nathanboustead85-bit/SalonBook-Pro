name: Boustio Phase 30.7 Salon Profile Preview
on:
  workflow_dispatch:
  push:
    branches: [milestone-customer-booking-experience]
    paths:
      - 'web/phase30/booking-30-7.html'
      - 'tests/phase30_7_salon_profile.test.cjs'
      - '.github/workflows/boustio-phase30-7-salon-profile.yml'
permissions:
  contents: read
jobs:
  isolated-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test salon profile and booking safety
        run: node --test tests/phase30_7_salon_profile.test.cjs
      - name: Full Phase 30 regression
        run: node --test tests/phase30*.test.cjs
      - name: Preserve Phase 29 regression
        run: node --test tests/phase29*.test.cjs
      - name: Verify standalone preview
        run: |
          test -s web/phase30/booking-30-7.html
          echo "OFFLINE_PREVIEW_NO_BOOKINGS_NO_DEPLOYMENT"
      - uses: actions/upload-artifact@v4
        with:
          name: Boustio-Phase30-7-Samsung-HTML
          path: web/phase30/booking-30-7.html
          retention-days: 30
