name: Boustio Phase 32.3 Isolated Firestore Auth Emulator Smoke Tests
on:
  workflow_dispatch:
  push:
    branches: [milestone-customer-booking-experience]
    paths:
      - 'web/phase32/firebase.emulator-32-3.json'
      - 'web/phase32/firestore-deny-all-32-3.rules'
      - 'web/phase32/README-32-3.md'
      - 'tests/phase32_3_emulator_runtime.test.cjs'
      - '.github/workflows/boustio-phase32-3-emulator-runtime.yml'
permissions:
  contents: read
jobs:
  isolated-emulator-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      FIREBASE_CLI_EXPERIMENTS: webframeworks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Offline Phase 32 guard regressions
        run: node --test tests/phase32_1_staging_preparation.test.cjs tests/phase32_2_emulator_validation.test.cjs
      - name: Launch isolated demo Firestore and Auth emulators, then run smoke tests
        run: |
          npx --yes firebase-tools@14 emulators:exec --non-interactive --only firestore,auth --project demo-boustio-phase32-staging --config web/phase32/firebase.emulator-32-3.json "node --test tests/phase32_3_emulator_runtime.test.cjs"
      - name: Full Phase 31 regression
        run: node --test tests/phase31_*.test.cjs
      - name: Phase 30 regression
        run: node --test tests/phase30*.test.cjs
      - name: Phase 29 regression
        run: node --test tests/phase29*.test.cjs
      - name: No deployment or production credentials
        run: |
          test -s web/phase32/firestore-deny-all-32-3.rules
          echo "DEMO_ONLY_EMULATORS_EXEC_NO_CLOUD_PROJECT_NO_DEPLOYMENT"
