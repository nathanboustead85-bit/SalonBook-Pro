name: Boustio Phase 39.2 Isolated Unified Browser Session
on:
  workflow_dispatch:
  push:
    branches: [milestone-customer-booking-experience]
    paths:
      - 'web/phase39/**'
      - 'tests/phase39_2_*'
      - '.github/workflows/boustio-phase39-2-unified-session.yml'
permissions:
  contents: read
jobs:
  isolated-unified-session:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GCLOUD_PROJECT: demo-boustio-phase39-2
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:18080
      FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:19099
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install isolated test dependencies
        run: npm install --no-save --no-package-lock firebase@11 firebase-admin@13 @firebase/rules-unit-testing@4 firebase-tools@14
      - name: Phase 39.2 unified session lifecycle unit tests
        run: node --test tests/phase39_2_session.test.cjs
      - name: Phase 39.1 and Phase 38 session regression
        run: node --test tests/phase39_1_contract.test.cjs tests/phase38_3_authorization.test.cjs tests/phase38_4_recovery.test.cjs
      - name: Phase 39.2 Firebase emulator isolation
        run: npx firebase-tools emulators:exec --only auth,firestore --project demo-boustio-phase39-2 --config firebase.phase32-4.json "node --test tests/phase39_2_emulator.test.cjs"
      - name: NO_DEPLOYMENT safety gate
        run: |
          test -s firestore.rules
          test -s firebase.phase32-4.json
          echo "PHASE39_2_EMULATOR_ONLY_NO_PRODUCTION_NO_DEPLOYMENT"
