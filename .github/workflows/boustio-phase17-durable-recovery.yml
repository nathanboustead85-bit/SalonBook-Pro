name: Boustio Phase 17 durable recovery tests
on:
  workflow_dispatch:
  push:
    paths:
      - "functions/phase17DurableRecovery.js"
      - "tests/phase17_durable_recovery.test.js"
      - ".github/workflows/boustio-phase17-durable-recovery.yml"
permissions:
  contents: read
jobs:
  durable-recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node tests/phase17_durable_recovery.test.js
      - run: node tests/phase17_publication_recovery.test.js
      - run: node tests/phase17_trusted_revision.test.js
      - run: node tests/phase17_public_database_writer.test.js
