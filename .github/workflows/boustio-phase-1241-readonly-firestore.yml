name: Boustio Phase 12.41 Read-only Firestore Emulator
on:
  workflow_dispatch:
jobs:
  public-read-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: milestone-customer-booking-experience
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install isolated emulator test dependencies
        run: |
          npm install --global firebase-tools@14
          npm install --prefix functions --no-save --ignore-scripts @firebase/rules-unit-testing@4
      - name: Validate test syntax
        run: node --check tests/phase1241_firestore_public_read.test.js
      - name: Test isolated read-only Firestore permissions
        env:
          GCLOUD_PROJECT: demo-boustio-phase1241
        run: |
          firebase emulators:exec --config tests/phase1241.firebase.json --only firestore --project demo-boustio-phase1241 \
            "node tests/phase1241_firestore_public_read.test.js"
      - name: Re-run public projection tests
        run: node tests/phase1240_public_availability_projection.test.js
      - name: Re-run production readiness safeguards
        run: node tests/phase1230_readiness_gate.test.js
