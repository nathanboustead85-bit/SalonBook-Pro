name: Boustio Phase 17.6 Staged WIF Authentication Diagnostic
on:
  workflow_dispatch:
    inputs:
      approval:
        description: 'Type VERIFY_AUTH_STAGES to test read-only identity exchange (no Firestore)'
        required: true
        type: string
permissions:
  contents: read
  id-token: write
concurrency:
  group: boustio-phase176-wif-stages
  cancel-in-progress: false
jobs:
  verify:
    if: ${{ inputs.approval == 'VERIFY_AUTH_STAGES' && github.ref == 'refs/heads/milestone-customer-booking-experience' }}
    runs-on: ubuntu-latest
    environment: boustio-readonly-verification
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: milestone-customer-booking-experience
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install authentication library without modifying lockfiles
        run: npm install --prefix functions --no-package-lock --ignore-scripts --no-audit --no-fund
      - name: Test staged diagnostic safeguards
        run: node tests/phase176_wif_stage_diagnostic.test.js
      - name: Set up restricted Workload Identity credentials
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.BOUSTIO_WIF_PROVIDER }}
          service_account: boustio-readonly-verifier@salonbook-pro-ad5ff.iam.gserviceaccount.com
          project_id: ${{ vars.BOUSTIO_FIREBASE_PROJECT_ID }}
          create_credentials_file: true
          export_environment_variables: true
      - name: Test STS federation then service-account impersonation without Firestore
        env:
          BOUSTIO_PHASE176_APPROVED: 'true'
          BOUSTIO_FIREBASE_PROJECT_ID: ${{ vars.BOUSTIO_FIREBASE_PROJECT_ID }}
        run: node scripts/phase176_wif_stage_diagnostic.js
