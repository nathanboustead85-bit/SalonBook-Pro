name: Boustio Phase 33.10 Final Offline Dashboard Audit
on:
  workflow_dispatch:
  push:
    branches: [milestone-customer-booking-experience]
    paths:
      - 'tests/phase33_10_final_dashboard_audit.test.cjs'
      - 'web/phase33/README-33-10.md'
      - '.github/workflows/boustio-phase33-10-final-audit.yml'
permissions:
  contents: read
jobs:
  final-dashboard-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Phase 33.10 end-to-end offline audit
        run: node --test tests/phase33_10_final_dashboard_audit.test.cjs
      - name: All Phase 33 regression tests
        run: node --test tests/phase33_*.test.cjs
      - name: Phase 32 offline safety regression
        run: node --test tests/phase32_9_content_recovery.test.cjs tests/phase32_1_staging_preparation.test.cjs tests/phase32_2_emulator_validation.test.cjs tests/phase32_10_final_audit.test.cjs
      - name: Phase 31 regression
        run: node --test tests/phase31_*.test.cjs
      - name: Phase 30 regression
        run: node --test tests/phase30*.test.cjs
      - name: Phase 29 regression
        run: node --test tests/phase29*.test.cjs
      - name: No deployment verification
        run: |
          test -s firestore.rules
          test -s firebase.json
          echo "PHASE33_10_OFFLINE_AUDIT_NO_DEPLOYMENT"
