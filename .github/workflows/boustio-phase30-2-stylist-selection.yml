name: Boustio Phase 30.2 Stylist Selection Preview
on:
  workflow_dispatch:
  push:
    branches: [milestone-customer-booking-experience]
    paths:
      - 'web/phase30/booking-30-2.html'
      - 'tests/phase30_2_stylist_selection.test.cjs'
      - '.github/workflows/boustio-phase30-2-stylist-selection.yml'
permissions:
  contents: read
jobs:
  isolated-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test stylist selection and staff availability
        run: node --test tests/phase30_2_stylist_selection.test.cjs
      - name: Phase 30 regression tests
        run: node --test tests/phase30*.test.cjs
      - name: Preserve Phase 29 regression tests
        run: node --test tests/phase29*.test.cjs
      - name: Verify standalone preview
        run: |
          test -s web/phase30/booking-30-2.html
          echo "OFFLINE_DEMO_NO_BOOKINGS_NO_DEPLOYMENT"
      - uses: actions/upload-artifact@v4
        with:
          name: Boustio-Phase30-2-Samsung-HTML
          path: web/phase30/booking-30-2.html
          retention-days: 30
