name: Boustio Phase 17.34 OIDC Subject Structure Diagnostic
on:
  workflow_dispatch:
    inputs:
      approval:
        description: 'Type INSPECT_SUBJECT_STRUCTURE (no raw subject or token disclosure)'
        required: true
        type: string
permissions:
  contents: read
  id-token: write
concurrency:
  group: boustio-phase1734-subject-structure
  cancel-in-progress: false
jobs:
  diagnose:
    if: ${{ inputs.approval == 'INSPECT_SUBJECT_STRUCTURE' && github.ref == 'refs/heads/milestone-customer-booking-experience' && github.repository == 'nathanboustead85-bit/SalonBook-Pro' }}
    runs-on: ubuntu-latest
    environment: boustio-function-deployment
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: milestone-customer-booking-experience
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify structure diagnostic safeguards
        run: |
          node --check scripts/phase1734_subject_structure.js
          node tests/phase1734_subject_structure.test.js
      - name: Inspect OIDC subject structure without exposing values
        env:
          BOUSTIO_PHASE1734_APPROVAL: ${{ inputs.approval }}
        run: node scripts/phase1734_subject_structure.js
