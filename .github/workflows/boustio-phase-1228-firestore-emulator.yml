name: Boustio Phase 12.28 Firestore Emulator Recovery
on:
  workflow_dispatch:
jobs:
  firestore-emulator:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: milestone-customer-booking-experience
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install emulator CLI and test dependencies
        run: |
          npm install --global firebase-tools@14
          npm install --prefix functions --no-save --ignore-scripts
      - name: Run isolated Firestore emulator transaction tests
        env:
          GCLOUD_PROJECT: demo-boustio-phase1228
        run: |
          firebase emulators:exec --only firestore --project demo-boustio-phase1228 \
            "cd functions && node ../tests/phase1228_firestore_emulator.test.js"
      - name: Re-run offline recovery tests
        run: node tests/phase1227_migration_recovery.test.js
      - name: Re-run migration safety tests
        run: node tests/phase1226_migration_safety.test.js
