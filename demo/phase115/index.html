<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Boustio — Demo booking</title><style>body{font:16px system-ui;background:#f7f8f7;color:#1c2924;margin:0}main{max-width:560px;margin:40px auto;padding:24px;background:white;border-radius:18px;box-shadow:0 8px 28px #0001}h1{color:#e36b24}label{display:block;margin:18px 0 6px;font-weight:600}select,input,button{width:100%;box-sizing:border-box;padding:13px;border:1px solid #bbc6bf;border-radius:9px;font:inherit}button{margin-top:18px;background:#e36b24;color:white;border:0;cursor:pointer}button:disabled{background:#aaa}#message{margin-top:18px;white-space:pre-wrap}small{color:#566} .banner{background:#fff0d9;padding:12px;border-radius:9px}</style></head><body><main><h1>Boustio</h1><p class="banner"><strong>EMULATOR DEMO ONLY</strong> — Synthetic business and appointments. Not a public booking service.</p><label for="service">Service</label><select id="service"></select><label for="staff">Professional</label><select id="staff"></select><label for="date">Date</label><input id="date" type="date"><label for="slot">Available appointment</label><select id="slot"></select><label for="token">Firebase Auth emulator customer ID token</label><input id="token" type="password" autocomplete="off" placeholder="Verified test account token"><button id="book" disabled>Confirm demo booking</button><p id="message" role="status" aria-live="polite"></p><small>Bookings are validated again by the server. Slots can become unavailable.</small></main><script>
const $=id=>document.getElementById(id),businessId=new URLSearchParams(location.search).get("businessId")||"demo_salon";
let data=null;const message=t=>$("message").textContent=t;
async function api(route,body){const r=await fetch("/api/"+route,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw Error(d.error||"Request failed");return d;}
function fill(el,items){el.replaceChildren(...items.map(x=>{const o=document.createElement("option");o.value=x.value;o.textContent=x.label;return o;}));}
async function refresh(){try{const serviceId=$("service").value;fill($("staff"),data.staff.filter(x=>x.serviceIds.includes(serviceId)).map(x=>({value:x.id,label:x.name})));await slots();}catch(e){message(e.message);}}
async function slots(){try{$("book").disabled=true;const serviceId=$("service").value,staffId=$("staff").value,date=$("date").value;if(!serviceId||!staffId||!date){fill($("slot"),[]);return;}const times=await api("availability",{businessId,serviceId,staffId,date});fill($("slot"),times.map(t=>({value:t,label:new Intl.DateTimeFormat("en-GB",{timeZone:"Europe/London",hour:"2-digit",minute:"2-digit",hour12:false}).format(new Date(t))})));$("book").disabled=!times.length;message(times.length?times.length+" demo slots available":"No slots available");}catch(e){message(e.message);}}
$("service").onchange=refresh;$("staff").onchange=slots;$("date").onchange=slots;
$("book").onclick=async()=>{const btn=$("book");btn.disabled=true;try{const result=await api("book",{businessId,serviceId:$("service").value,staffId:$("staff").value,startAt:$("slot").value,idempotencyKey:crypto.randomUUID(),customerAccessToken:$("token").value});message("Demo booking confirmed! Reference: "+result.bookingId);await slots();}catch(e){message("Booking not confirmed: "+e.message);btn.disabled=false;}};
(async()=>{try{data=await api("catalogue",{businessId});fill($("service"),data.services.map(x=>({value:x.id,label:x.name+" ("+x.durationMinutes+" min)"})));$("date").value="2026-11-10";await refresh();}catch(e){message(e.message);}})();
</script></body></html>
