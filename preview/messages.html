<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Boustio | Messages</title><link rel="stylesheet" href="./studio.css"><link rel="stylesheet" href="./customers.css"></head><body><main><section class="hero"><p>BUSINESS STUDIO</p><h1>Messages and notifications</h1><p>Stay connected with your customers.</p></section><p class="notice">Fictional conversation only. Nothing is transmitted or uploaded.</p><div class="layout"><section class="panel"><h2>Customer chat preview</h2><label for="role">Preview as</label><select id="role"><option value="business">Business</option><option value="customer">Customer</option></select><ol id="chat" aria-live="polite"></ol><label for="message">Demo message</label><textarea id="message" maxlength="500"></textarea><button id="add">Add demo message</button><button id="photo">Add sample photo</button><button id="voice">Add sample voice note</button><button disabled>Upload real attachment</button><button disabled>Record voice note</button></section><section class="panel"><h2>Notification preferences</h2><label><input type="checkbox" id="email" style="width:auto"> Email consent (demo)</label><label><input type="checkbox" id="whatsapp" style="width:auto"> WhatsApp consent (demo)</label><label><input type="checkbox" id="paused" style="width:auto"> Pause notifications</label><label for="kind">Appointment notification</label><select id="kind"><option value="confirmation">Confirmation</option><option value="reminder">Reminder</option><option value="cancellation">Cancellation</option></select><button id="prepare">Preview notification</button><button disabled>Send real notification</button><p id="status" role="status"></p><h2>Delivery history</h2><ul id="history"></ul><button id="clear">Clear demo conversation and history</button><button id="reset">Reset preferences and demo</button></section></div></main><script type="modu
