<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Boustio | Demo Salon booking preview</title>
<style>:root{font-family:system-ui,-apple-system,sans-serif;color:#163d38;background:#f4f8f7}*{box-sizing:border-box}body{margin:0}.wrap{max-width:540px;margin:auto;padding:24px 18px 60px}.brand{font-size:28px;font-weight:800}.brand span{color:#14a493}.pill{display:inline-block;background:#d9efeb;padding:7px 11px;border-radius:20px;font-size:12px;font-weight:700;margin:12px 0}h1{font-size:28px;margin-bottom:6px}p{color:#52726d}.panel{background:white;border:1px solid #dce9e6;border-radius:20px;padding:22px;margin-top:20px;box-shadow:0 8px 24px #174d4010}label{display:block;font-weight:700;margin:16px 0 8px}select,input,button{width:100%;padding:15px;border-radius:12px;font:inherit}select,input{border:1px solid #bfd4ce;background:white;color:#173c36}button{border:0;background:#087c70;color:white;font-weight:700;margin-top:20px;cursor:pointer}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #6db9ad}.result{background:#e3f4ef;padding:18px;border-radius:14px;margin-top:18px}.error{color:#b22222}footer{font-size:13px;color:#607d77;margin-top:25px}</style></head>
<body><main class="wrap"><div class="brand">boustio<span>.</span></div><div class="pill">ISOLATED DEMO · NO REAL BOOKINGS</div><h1 id="business">Demo Salon</h1><p>Choose a published service and a time that fits staff hours and existing sample appointments.</p><section class="panel"><form id="form" novalidate><label for="service">Service</label><select id="service"></select><label for="staff">Professional</label><select id="staff"></select><label for="date">Demo date</label><select id="date"><option value="2026-11-20">20 November 2026 (sample schedule)</option></select><label for="time">Available appointment times</label><select id="time"></select><label for="customer">Your name</label><input id="customer" maxlength="80" autocomplete="name" placeholder="Your full name"><button type="submit">Review appointment preview</button></form><div id="result" aria-live="polite"></div></section><footer>Static test data only. No real availability, customer records, payments, emails or appointments.</footer></main>
<script src="./availabilityPreview.js"></script><script>
const api=window.BoustioAvailabilityPreview,b=api.SAMPLE;
const service=document.getElementById("service"),staff=document.getElementById("staff"),time=document.getElementById("time"),result=document.getElementById("result");
document.getElementById("business").textContent=b.businessName;
function option(select,value,label){const o=document.createElement("option");o.value=value;o.textContent=label;select.append(o)}
for(const s of api.publishedServices(b))option(service,s.id,s.name+" · £"+(s.pricePence/100).toFixed(2)+" · "+s.durationMinutes+" min");
function updateStaff(){staff.replaceChildren();for(const p of b.staff.filter(x=>x.active&&x.serviceIds.includes(service.value)))option(staff,p.id,p.name);updateTimes()}
function updateTimes(){time.replaceChildren();const slots=api.availableSlots(b,{serviceId:service.value,staffId:staff.value,date:document.getElementById("date").value});if(!slots.length)option(time,"","No times available");else for(const t of slots)option(time,t,t)}
service.addEventListener("change",updateStaff);staff.addEventListener("change",updateTimes);document.getElementById("date").addEventListener("change",updateTimes);updateStaff();
document.getElementById("form").addEventListener("submit",e=>{e.preventDefault();result.replaceChildren();const p=api.review(b,{serviceId:service.value,staffId:staff.value,date:document.getElementById("date").value,time:time.value,customerName:document.getElementById("customer").value});const box=document.createElement("div");box.className=p.status==="PREVIEW_ONLY"?"result":"error";if(p.status!=="PREVIEW_ONLY")box.textContent="Please choose an available appointment and enter your name.";else{const title=document.createElement("strong");title.textContent="PREVIEW ONLY — NOT BOOKED";box.append(title);for(const s of [p.customerName,p.businessName,p.serviceName+" with "+p.staffName,p.date+" at "+p.time,"£"+(p.pricePence/100).toFixed(2),"No appointment has been created."]){const line=document.createElement("p");line.textContent=s;box.append(line)}}result.append(box)});
</script></body></html>
