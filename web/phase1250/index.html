<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#087c70"><title>Boustio — Booking journey demo</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#153f39;background:#f4f8f7}*{box-sizing:border-box}body{margin:0}.wrap{max-width:640px;margin:auto;padding:22px 18px 65px}header{display:flex;justify-content:space-between;align-items:center}.brand{font-size:31px;font-weight:850;letter-spacing:-1px}.brand span{color:#10a58e}.pill{font-size:11px;font-weight:800;background:#d9f2eb;padding:9px;border-radius:30px}h1{font-size:32px;line-height:1.1;margin:30px 0 12px}h2{font-size:22px}p{color:#55776e;line-height:1.5}.panel{background:white;border:1px solid #d9e8e3;border-radius:20px;padding:22px;margin:22px 0;box-shadow:0 8px 28px #154b4010}label{display:block;font-weight:750;margin:17px 0 8px}select{width:100%;padding:14px;border:1px solid #bdd8ce;border-radius:12px;background:white;color:#153f39;font:inherit}.times{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}.time{border:1px solid #b4d8cc;border-radius:12px;background:#eef8f5;color:#155b50;padding:13px 4px;font:inherit;font-weight:700}.time[aria-pressed=true]{background:#087c70;color:white}.primary{width:100%;border:0;border-radius:12px;padding:16px;background:#087c70;color:white;font:inherit;font-weight:800;margin-top:20px}.primary:disabled{background:#a9c5be}button:focus-visible,select:focus-visible{outline:3px solid #39ad9d;outline-offset:2px}.notice{background:#e2f2ed;border-radius:12px;padding:14px;margin:20px 0}.result{border:1px solid #9bd4c3;background:#eef9f5;border-radius:12px;padding:16px;margin-top:18px}
</style></head><body><main class="wrap"><header><div class="brand">boustio<span>.</span></div><div class="pill">INTERACTIVE DEMO</div></header><h1>Book your next appointment</h1><p>Demo Salon · Fictional services, stylists and available times.</p><section class="panel"><h2>Find an appointment</h2><label for="service">Choose a service</label><select id="service"></select><label for="stylist">Choose a stylist</label><select id="stylist"></select><label for="day">Choose a day</label><select id="day"></select><label>Available times</label><div id="times" class="times" aria-live="polite"></div><button id="review" class="primary" disabled>Review demo appointment</button><div id="result" aria-live="polite"></div></section><div class="notice">Demonstration only. No real bookings, payments, Firebase access or customer details. Choosing a time does not reserve it.</div></main><script src="./bookingJourney.js"></script><script>
"use strict";
const api=window.BoustioPhase1250,service=document.getElementById("service"),stylist=document.getElementById("stylist"),day=document.getElementById("day"),times=document.getElementById("times"),review=document.getElementById("review"),result=document.getElementById("result");
let selected=null;
function addOption(target,value,label){const o=document.createElement("option");o.value=value;o.textContent=label;target.append(o)}
for(const d of api.fixtures)addOption(day,d.date,d.label);
for(const s of api.fixtures[0].services)addOption(service,s.id,s.name+" · £"+(s.pricePence/100).toFixed(2)+" · "+s.durationMinutes+" min");
function updateStaff(){const old=stylist.value;stylist.replaceChildren();addOption(stylist,"any","Any available stylist");const data=api.options({date:day.value,serviceId:service.value});
if(data.status==="SYNTHETIC_PREVIEW")for(const s of data.staff)addOption(stylist,s.id,s.name);
if([...stylist.options].some(o=>o.value===old))stylist.value=old;render()}
function render(){selected=null;review.disabled=true;result.replaceChildren();times.replaceChildren();const data=api.options({date:day.value,serviceId:service.value,staffId:stylist.value});
if(!data.slots.length){times.textContent="No example times available.";return}
for(const slot of data.slots){const b=document.createElement("button");b.type="button";b.className="time";b.textContent=slot.time+(stylist.value==="any"?" · "+slot.staffName:"");b.setAttribute("aria-pressed","false");
b.addEventListener("click",()=>{selected=slot;review.disabled=false;result.replaceChildren();for(const x of times.children)x.setAttribute("aria-pressed",String(x===b))});times.append(b)}}
service.addEventListener("change",updateStaff);day.addEventListener("change",updateStaff);stylist.addEventListener("change",render);
review.addEventListener("click",()=>{if(!selected)return;const data=api.review({date:day.value,serviceId:service.value,staffId:selected.staffId,time:selected.time});
if(data.status!=="NOT_BOOKED")return;const box=document.createElement("div");box.className="result";const title=document.createElement("strong");title.textContent="Your demo selection — NOT BOOKED";box.append(title);
for(const line of [data.serviceName,"Stylist: "+data.staffName,data.date+" at "+data.time,"£"+(data.pricePence/100).toFixed(2),data.message]){const p=document.createElement("p");p.textContent=line;box.append(p)}result.replaceChildren(box)});
updateStaff();
</script></body></html>
