<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Boustio — Protected staging preview</title><style>
:root{font-family:system-ui,sans-serif;color:#15463d;background:#f4f8f7}*{box-sizing:border-box}body{margin:0}.wrap{max-width:620px;margin:auto;padding:24px 18px}.brand{font-size:30px;font-weight:850}h1{font-size:30px}p{line-height:1.5;color:#54746e}.panel{background:white;border:1px solid #d6e9e2;border-radius:20px;padding:22px}label{display:block;font-weight:700;margin:18px 0 7px}select{width:100%;padding:14px;border:1px solid #abcfc5;border-radius:12px;background:white;font:inherit}.times{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:12px}.time{padding:12px 4px;background:#eaf7f2;border:1px solid #a9d5c9;border-radius:10px;text-align:center}.notice{padding:15px;background:#e1f2ed;border-radius:12px;margin:16px 0}
</style></head><body><main class="wrap"><div class="brand">boustio<span style="color:#10a58e">.</span></div><h1>Customer booking preview</h1><p>Isolated staging only · No real appointments can be made.</p><div class="panel"><h2 id="business">Demo Salon</h2><p id="date">Availability from local test data</p><div id="status" role="status" aria-live="polite">Checking isolated test connection…</div><div id="controls" hidden><label for="service">Choose a service</label><select id="service"></select><label for="stylist">Choose a stylist</label><select id="stylist"></select><label>Example available times</label><div class="times" id="times"></div></div><div class="notice">Read-only preview. No customer details, payments or booking submissions. This page cannot access production Firebase.</div></div></main><script src="../phase1246/publicAvailabilityReader.js"></script><script src="./stagingConnection.js"></script><script>
(async()=>{const status=document.getElementById("status");const data=await window.BoustioPhase1249.load({fetcher:(...args)=>fetch(...args)});
if(data.status!=="STAGING_PREVIEW"){status.textContent="Test availability is unavailable. This is expected unless the local Firestore emulator is running and seeded.";return}
document.getElementById("business").textContent=data.businessName;document.getElementById("date").textContent="Available on "+data.date;
status.textContent="Isolated synthetic test availability — not bookable.";
const controls=document.getElementById("controls"),service=document.getElementById("service"),stylist=document.getElementById("stylist"),times=document.getElementById("times");
for(const s of data.services){const o=document.createElement("option");o.value=s.id;o.textContent=s.name+" · £"+(s.pricePence/100).toFixed(2);service.append(o)}
function updateStaff(){stylist.replaceChildren();const all=document.createElement("option");all.value="any";all.textContent="Any available stylist";stylist.append(all);
for(const id of [...new Set(data.availability.filter(x=>x.serviceId===service.value).map(x=>x.staffId))].sort()){const o=document.createElement("option");o.value=id;o.textContent=id;stylist.append(o)}updateTimes()}
function updateTimes(){times.replaceChildren();const list=[...new Set(data.availability.filter(x=>x.serviceId===service.value&&(stylist.value==="any"||x.staffId===stylist.value)).flatMap(x=>x.times))].sort();
if(!list.length){times.textContent="No example times available.";return}
for(const time of list){const span=document.createElement("span");span.className="time";span.textContent=time;times.append(span)}}
service.addEventListener("change",updateStaff);stylist.addEventListener("change",updateTimes);controls.hidden=false;updateStaff();
})();
</script></body></html>
